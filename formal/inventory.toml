# Required constants of the policy model: each row's statement is the elaborator's
# pretty-printed type, matched by `contextful formal check`.

[claim]
targets  = ["Authority.grant_includedIn_permits", "Authority.attenuate_permits_parent", "Authority.permits_iff_audience_and_every_block", "Authority.attenuateAll_permits_every_parent_block"]
trusted  = ["delegation-library", "delegation-library-cryptography", "delegation-library-parser"]
rests_on = ["delegation-library", "delegation-library-cryptography", "delegation-library-parser"]
verified = ["crates/contextful-core/src/attenuate.rs::widened", "crates/contextful-core/src/attenuate.rs::attenuate", "crates/contextful-policy/src/verify.rs::permits"]

[constant."composed_sound"]
module    = "Contextful.Layer"
statement = "∀ {ls : List Layer} {r : RowId}, composed ls r = true → ∀ (l : Layer), l ∈ ls → l r = true"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the required members were present in the list; that a member performs removal rather than a test; that an execution reaches the fold ahead of an effect.
"""

[constant."composed_narrows"]
module    = "Contextful.Layer"
statement = "∀ {l : Layer} {ls : List Layer} {r : RowId}, composed (l :: ls) r = true → composed ls r = true"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the required members were present in the list; that a member performs removal rather than a test; that an execution reaches the fold ahead of an effect. Says nothing about the order of the list; the theorem holds for any order, and the order is fixed elsewhere.
"""

[constant."filter_then_mask_ne_mask_then_filter"]
module    = "Contextful.Layer"
statement = "∃ keep mask rows, List.map mask (List.filter keep rows) ≠ List.filter keep (List.map mask rows)"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: which order the engine applies, which the relation fixes and the composition theorems assume; that a mask rewrites values rather than removing rows; masks and filters over anything but one row's value.
"""

[constant."zone_layer_sound"]
module    = "Contextful.Placement"
statement = "∀ {effectiveSet : RowId → AllowSet} {session : Placement} {ls : List Layer} {r : RowId}, zoneLayer effectiveSet session ∈ ls → composed ls r = true → effectiveSet r session = true"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the required members were present in the list; that a member performs removal rather than a test; that an execution reaches the fold ahead of an effect. Leaves open that the zone layer is in the list, and that the effective allow-set a row carries is the one its table declares.
"""

[constant."floor_no_downgrade"]
module    = "Contextful.Placement"
statement = "∀ {es : List AllowSet} {c : Placement}, floor es c = true → ∀ (a : AllowSet), a ∈ es → a c = true"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the evidence list backing a floor is non-empty — the empty list folds to admit every caller, and the engine refuses a row naming no evidence table; that the placement a caller declares is its own; that the floor is consulted before inference runs.
"""

[constant."failClosed_floor_rejects_cloud"]
module    = "Contextful.Placement"
statement = "∀ {es : List AllowSet}, failClosed ∈ es → ∀ (id : ZoneId), floor es (Placement.publicCloud id) = false ∧ failClosed (Placement.privateCloud id) = false ∧ failClosed (Placement.publicCloud id) = false"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the fail-closed member is in the evidence list; that the caller's placement is the one it declares; that the floor is consulted before inference runs.
"""

[constant."includedIn_iff_placement_inclusion"]
module    = "Contextful.Placement"
offered_as = "zone-inclusion"
statement = "∀ (small big : List Entry), includedIn small big = true ↔ ∀ (p : Placement), allowSetOf small p = true → allowSetOf big p = true"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the entries parsed from the manifest are the entries the model receives; that a manifest category has a placement case (checked at elaboration, not by this theorem); zone text outside the grammar, which the model folds into the undeclared case.
"""

[constant."includedIn_not_decided_by_sample"]
module    = "Contextful.Placement"
statement = "∀ (sample : List Placement), ∃ small big, (∀ (p : Placement), p ∈ sample → allowSetOf small p = true → allowSetOf big p = true) ∧ includedIn small big = false"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: which decision procedure the engine runs; that the identifier space stays unbounded, which the witness's fresh identifier relies on; samples drawn after the entry lists are fixed.
"""

[constant."effective_included_in_both"]
module    = "Contextful.Placement"
statement = "∀ (a b : List Entry), (allowSetOf (effective a b)).Included (allowSetOf a) ∧ (allowSetOf (effective a b)).Included (allowSetOf b)"
assumptions    = ["propext", "Quot.sound"]
negative  = """
Leaves open: that the effective policy is the one the engine enforces; that each input allow-set is the one its source declares; whether the effective policy is the largest set included in both.
"""

[constant."Authority.grant_includedIn_permits"]
module    = "Contextful.Authority"
statement = "∀ (child parent : Authority.Grant), child.includedIn parent = true → ∀ (r : Authority.Request), (child.under parent).permits r = true → parent.permits r = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/attenuate.rs::widened via crates/contextful-core/src/attenuate.rs::effective; test crates/contextful-cli/tests/integration/differential.rs::the_engine_and_the_lean_reference_agree_over_generated_cases"
negative  = """
Leaves open: the duration and byte ceilings, which the model's grant omits; that the parsed patterns, tenant scopes, allowlists and aggregate constraints are the ones the credential carries; that the engine enforces a request's tenant partition, template, aggregate release, row count and availability instant as the request states them; that the engine consults the check before admitting a request.
"""

[constant."Authority.tenant_never_widens"]
module    = "Contextful.Authority"
statement = "∀ (child parent : Authority.Grant) (t : Authority.Tenant), child.includedIn parent = true → parent.tenant = some t → (child.under parent).tenant = some t ∧ ∀ (r : Authority.Request), (child.under parent).permits r = true → r.tenant = some t"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/attenuate.rs::tenant_kept; test crates/contextful-cli/tests/integration/differential.rs::the_engine_and_the_lean_reference_agree_over_generated_cases"
negative  = """
Leaves open: that the tenant value binds the table's outermost partition column; byte equality between the grant's value, the partition key on disk and the consumer's tenant identifier; that the read path filters to the request's tenant partition.
"""

[constant."Authority.pattern_covers_forms"]
module    = "Contextful.Authority"
statement = "(∀ (n : Authority.Name), Authority.Pattern.star.covers n = true) ∧ (∀ (p n : Authority.Name), (Authority.Pattern.prefixed p).covers n = true ↔ p <+: n) ∧ (∀ (s n : Authority.Name), (Authority.Pattern.literal s).covers n = true ↔ s = n) ∧ ∀ (p : Authority.Pattern), p.subsumes Authority.Pattern.star = true → p = Authority.Pattern.star"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/grant.rs::TablePattern::covers_name; test crates/contextful-cli/tests/integration/differential.rs::the_engine_and_the_lean_reference_agree_over_generated_cases"
negative  = """
Leaves open: pattern parsing, including the refusal of a `*` before the final position; that every consumer reaches the one matcher.
"""

[constant."Authority.template_allowlist"]
module    = "Contextful.Authority"
statement = "(∀ (g : Authority.Grant) (id : Authority.Name), g.templates = none → g.allowsTemplate id = false) ∧ (∀ (g : Authority.Grant) (l : List Authority.Name) (id : Authority.Name), g.templates = some l → Authority.allTemplates ∈ l → g.allowsTemplate id = true) ∧ ∀ (c p : Authority.Grant) (id : Authority.Name), c.templatesWithin p = true → c.allowsTemplate id = true → p.allowsTemplate id = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/grant.rs::Grant::templates_within; test crates/contextful-cli/tests/integration/differential.rs::the_engine_and_the_lean_reference_agree_over_generated_cases"
negative  = """
Leaves open: the manifest's declared template list, which `*` ranges over; that a template's session reads only the tables its statement names; the projected tool listing.
"""

[constant."Authority.absent_grant_field_admits"]
module    = "Contextful.Authority"
statement = "∀ (g : Authority.Grant) (r : Authority.Request), (g.tenant = none → g.tenantAdmits r = true) ∧ (g.aggregate = none → g.aggregateAdmits r = true) ∧ (g.maxRows = none → g.rowsAdmit r = true) ∧ (g.horizon = none → g.horizonAdmits r = true) ∧ (g.templates = none → ∀ (id : Authority.Name), g.allowsTemplate id = false)"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/grant.rs::Grant::allows_template; test crates/contextful-core/tests/integration/grant.rs::fields"
negative  = """
Leaves open: the duration and byte ceilings; that the engine reads an absent field as absent rather than as a default value.
"""

[constant."Authority.aggregate_grant_no_raw_read"]
module    = "Contextful.Authority"
statement = "∀ (g : Authority.Grant) (r : Authority.Request), r.action = Authority.Action.read → r.aggregate = none → g.aggregate.isSome = true ∨ g.actions.contains Authority.Action.read = false → g.permits r = false"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/grant.rs::raw_read_covers; test crates/contextful-core/tests/integration/grant.rs::aggregate_only_grants_contribute_no_raw_table"
negative  = """
Leaves open: that the read path classifies a statement as raw or aggregate as the request states it; group formation, contributor shares and function evaluation, which the request reports rather than computes.
"""

[constant."Authority.checkChain_permits_root"]
module    = "Contextful.Authority"
statement = "∀ (hops : List (List Authority.Grant)) (root gs : List Authority.Grant), Authority.checkChain root hops = some gs → ∀ (r : Authority.Request), (gs.any fun g => g.permits r) = true → (root.any fun g => g.permits r) = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/attenuate.rs::check_chain; test crates/contextful-core/tests/integration/attenuate.rs::narrowing"
negative  = """
Leaves open: expiry, subject derivation and incognito along the chain; a hop proposing no grant list, which inherits its parent's unchanged; credential bytes and block chaining, which the delegation library owns.
"""

[constant."Authority.attenuate_permits_parent"]
module    = "Contextful.Authority"
statement = "∀ (env : Authority.Env) (c : Authority.Credential) (b : Authority.Block) (r : Authority.Request), Authority.permits env (Authority.attenuate c b) r = true → Authority.permits env c r = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-core/src/attenuate.rs::attenuate; test crates/contextful-core/tests/integration/attenuate.rs::narrowing"
negative  = """
Leaves open: credential bytes, signatures and block chaining, which the delegation library owns; a change of the trusted environment between the two decisions; that every block the library verified reaches the decision; facts, checks and restrictions beyond grants, expiry and audience.
"""

[constant."Authority.permits_iff_audience_and_every_block"]
module    = "Contextful.Authority"
statement = "∀ (env : Authority.Env) (c : Authority.Credential) (r : Authority.Request), Authority.permits env c r = true ↔ c.audience = some env.audience ∧ ∀ (b : Authority.Block), b ∈ c.authority :: c.appended → Authority.Block.admits env b r = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-policy/src/verify.rs::permits; test crates/contextful-policy/tests/integration/profile.rs::an_appended_block_narrows_or_adds_nothing"
negative  = """
Leaves open: credential bytes, signatures and block chaining, which the delegation library owns; that the library's evaluator computes the conjunction the model states; facts, checks and restrictions beyond grants, expiry and audience; scoped-session execution after the decision.
"""

[constant."Authority.attenuateAll_permits_every_parent_block"]
module    = "Contextful.Authority"
statement = "∀ (env : Authority.Env) (c : Authority.Credential) (bs : List Authority.Block) (r : Authority.Request), Authority.permits env (Authority.attenuateAll c bs) r = true → ∀ (b : Authority.Block), b ∈ c.authority :: c.appended → Authority.Block.admits env b r = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-policy/src/attenuate.rs::attenuate; test crates/contextful-policy/tests/integration/profile.rs::every_parent_block_admits_what_an_attenuation_chain_permits"
negative  = """
Leaves open: credential bytes, signatures and block chaining, which the delegation library owns; a change of the trusted environment along the chain; that admission rechecks every appended block against its parent; facts, checks and restrictions beyond grants, expiry and audience.
"""

[constant."Mediation.statement_reach_released_rows_pass_session_layers"]
module    = "Contextful.Mediation"
offered_as = "mediation"
statement = "∀ (s : Mediation.Session) (rows : List RowId) (σ : Mediation.State), Mediation.Reach s (Mediation.start rows) σ → ∀ (r : RowId), r ∈ σ.released → ∀ (l : Layer), l ∈ s.layers → l r = true"
assumptions    = ["propext", "Quot.sound"]
binding   = "crates/contextful-policy/src/enforce/session.rs::Session; test crates/contextful-context/tests/integration/read/enforce.rs::every_row_path_takes_the_session"
negative  = """
Leaves open: that the session's layer list holds the required members, in the order the relation fixes; that a layer removes rather than tests; SQL semantics, the planner, joins and aggregates, which the relation abstracts to one fold per row; engine run steps, whose effects answer to the protocol model and allowlist inclusion.
"""

[constant."Allowlist.allowlist_includedIn_sound"]
module = "Contextful.Allowlist"
statement = "∀ (candidate predecessor : List Allowlist.Entry), Allowlist.includedIn candidate predecessor = true → ∀ (host : Allowlist.Name), Allowlist.permits candidate host = true → Allowlist.permits predecessor host = true"
assumptions = ["propext", "Quot.sound"]
binding = "crates/contextful-core/src/connector/attach.rs::Allowlist::included_in; test crates/contextful-core/tests/integration/connector/widen.rs::generated_hosts_agree_with_the_proved_model"
negative = "Leaves open: manifest parsing and host normalization, environment names, credential scopes, clock access, DNS and transport mediation, operator authorization and atomic reload publication; inclusion completeness for unreachable entries."

[constant."Allowlist.widen_witness_admitted"]
module = "Contextful.Allowlist"
statement = "∀ (candidate predecessor : List Allowlist.Entry) (probes : List Allowlist.Name) (host : Allowlist.Name), Allowlist.witness candidate predecessor probes = some host → Allowlist.permits candidate host = true ∧ Allowlist.permits predecessor host = false"
assumptions = ["propext", "Quot.sound"]
binding = "crates/contextful-core/src/connector/attach.rs::Allowlist::widening_witness; test crates/contextful-core/tests/integration/connector/widen.rs::generated_hosts_agree_with_the_proved_model"
negative = "Leaves open: completeness of probe generation, DNS resolution and transport reachability, parsing and normalization, non-host grant dimensions and enforcement of approval at reload. An absent witness proves no inclusion."
