[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

# Every member inherits these; cargo-deny and SBOM generators read the licence from the
# manifest, not from `LICENSE` (`assurance.build.licence-field`). The version equals the
# release tag `contextful-ci tag` cuts next (`assurance.release.workspace-version`).
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fractalboxdev/contextful"

# Every test binary linking the read path embeds the bundled DuckDB; with full debug
# info each weighs hundreds of MiB, and the workspace's test binaries together exceed
# a gate sandbox's disk. Workspace code keeps line tables for backtraces; dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
