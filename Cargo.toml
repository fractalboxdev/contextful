[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

# Every member inherits these; cargo-deny and SBOM generators read the licence from the
# manifest, not from `LICENSE` (`assurance.build.licence-field`). The version equals the
# release tag `contextful-ci tag` cuts next (`assurance.release.workspace-version`).
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fractalboxdev/contextful"

# Every test binary linking the read path embeds the bundled DuckDB; with full debug
# info each weighs hundreds of MiB, and the workspace's test binaries together exceed
# a gate sandbox's disk. Workspace code keeps line tables for backtraces; dependencies
# carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A profile artifact links across crates and strips its symbol table
# (`assurance.build.release-profile`). Panics unwind: the run keeper survives a panicking
# job only by unwinding to its guard (`run.cancel.keeper-panic`).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The component host compiles modules in test builds too; an unoptimized code generator
# takes tens of seconds over the decision module's 2.7 MB WebAssembly build.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
