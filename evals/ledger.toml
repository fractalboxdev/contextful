# The target ledger (`assurance.measure.ledger`): one entry per tracked target, keyed to
# the clause that owns it. An entry names its clause and never copies the clause's text.
#
#   clause  a clause id of spec/spec.lock.json
#   metric  the run-report field path the value fills
#   kind    test | eval | size | bench
#   tier    gate (decides the evaluate stage) | trend (records) | scheduled (nightly job)
#   direction  higher_is_better | lower_is_better, required for every trend entry
#   method  { test = "<crate>::<module>::<function>" } | { bench = "<crate>::<bench target>" }
#           | { cases = "evals/cases/<set>.jsonl" }
#           | { probe = "<tools/probe binary>" } | { issue = <n> }, which reports open and gates nothing
#   target  { op = "==" | "<=" | ">=" | "<" | ">", value = <absolute figure> }
#   seed    the seed every generated fixture derives from
#
# `contextful-ci measure --status` renders evals/ledger.md from this file.

