[package]
build = "../../build/source.rs"
name = "contextful-acceptance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Acceptance tests drive built binaries through their public surfaces. This package
# depends on no workspace package; `contextful-ci gate --stage acceptance` checks that.

[dependencies]
tempfile = "3"
# The loopback S3 server (`s3`): the protocol and signature verification, and its runtime.
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "tokio"] }
s3s = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

[dev-dependencies]
# A third-party reader: the store's Parquet opens with no engine code in the process.
parquet = { version = "58", default-features = false, features = ["zstd"] }
serde_json = "1"
# A third-party network client: it signs each request's holder proof with no engine code.
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
