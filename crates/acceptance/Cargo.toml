[package]
name = "contextful-acceptance"
version = "0.1.0"
edition = "2021"
publish = false

# Acceptance tests drive built binaries through their public surfaces. This package
# depends on no workspace package; `contextful-ci gate --stage acceptance` checks that.

[dependencies]
tempfile = "3"

[dev-dependencies]
# A third-party reader: the store's Parquet opens with no engine code in the process.
parquet = { version = "57", default-features = false, features = ["zstd"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
