[package]
build = "../../tools/ci/build_source.rs"
name = "contextful-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The control snapshot directory: immutable versions, the applied pointer, drafts,
# receipts and attestation nonces, over an atomic replace, an exclusive create and an
# advisory lock (`surface.apply.local-claim`). It links no run path, so the engine and
# the control plane share it.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-fs = { path = "../contextful-fs" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
