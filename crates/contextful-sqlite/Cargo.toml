[package]
name = "contextful-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The SQLite adapter behind the store's catalog ports and the run path's storage ports:
# `machine.sqlite` behind `Catalog` and the journal, blob and awakeable stores,
# `derived.sqlite` behind `DerivedCatalog`. The one package declaring `rusqlite`; it links
# whichever SQLite the host resolves, and only the binary turns on `bundled`
# (`topology.package.sqlite-adapter`).

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-fs = { path = "../contextful-fs" }
# The run stores' one connection admits a nested write from the thread already holding it.
parking_lot = "0.12"
rusqlite = { version = "0.40", default-features = false, features = ["serialize"] }
serde = "1"
serde_json = "1"

[features]
# Compile SQLite from source into the build. Only `contextful-cli` enables it.
bundled = ["rusqlite/bundled"]

[dev-dependencies]
# The journal, blob and awakeable conformance suites every run store adapter passes.
contextful-context = { path = "../contextful-context" }
contextful-engine = { path = "../contextful-engine" }
# Ledger measures record their figures (`assurance.measure.record`).
contextful-eval = { path = "../../tools/eval" }
# The suites run against a compiled-in SQLite, so no test build needs a system library.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde_json = "1"
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
