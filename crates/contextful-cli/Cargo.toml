[package]
name = "contextful-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "contextful"
path = "src/main.rs"

[dependencies]
contextful-agent = { path = "../contextful-agent" }
contextful-connectors = { path = "../contextful-connectors" }
contextful-context = { path = "../contextful-context", features = ["read"] }
contextful-core = { path = "../contextful-core" }
contextful-engine = { path = "../contextful-engine" }
# The harness core: case loader, stub embedder, metrics, report, floors and baseline gate.
contextful-eval = { path = "../../tools/eval" }
contextful-memory = { path = "../contextful-memory" }
contextful-policy = { path = "../contextful-policy" }
contextful-outbound = { path = "../contextful-outbound", default-features = false }
# The binary is the one package compiling SQLite into the build (`topology.package.sqlite-adapter`).
contextful-sqlite = { path = "../contextful-sqlite", features = ["bundled"] }
contextful-sync = { path = "../contextful-sync" }
# The component host (`topology.package.component-host`), linked under `component-host`.
contextful-wasm = { path = "../contextful-wasm", default-features = false, optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
ed25519-dalek = "2"
# The loopback S3 server the S3 sync suite pushes and pulls against.
contextful-acceptance = { path = "../acceptance" }

[features]
default = ["transport-ureq", "component-host", "s3-sync"]
transport-ureq = ["contextful-outbound/transport-ureq", "contextful-connectors/transport-ureq", "contextful-wasm?/transport-ureq"]
# Component sources run as guests under the component host; without it each refuses as
# `ComponentHostMissing`.
component-host = ["dep:contextful-wasm"]
# The interpreted target a component source selects with `--component-target pulley`.
pulley = ["component-host", "contextful-wasm/pulley"]
# The Google Drive source and the PDF decode worker behind its process boundary.
drive = ["contextful-connectors/drive"]
# The S3 and R2 bucket adapter behind `s3://`, `r2://` and `https://` sync endpoints
# (`topology.package.s3-sync-optional`) and the `s3` object source.
s3-sync = ["contextful-sync/s3-sync", "contextful-connectors/s3"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
