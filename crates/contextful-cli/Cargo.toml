[package]
name = "contextful-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "contextful"
path = "src/main.rs"

[dependencies]
contextful-connectors = { path = "../contextful-connectors" }
contextful-context = { path = "../contextful-context" }
contextful-core = { path = "../contextful-core" }
contextful-engine = { path = "../contextful-engine" }
contextful-policy = { path = "../contextful-policy" }
contextful-runtime = { path = "../contextful-runtime" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
