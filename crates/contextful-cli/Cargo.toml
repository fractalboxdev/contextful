[package]
name = "contextful-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "contextful"
path = "src/main.rs"

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-policy = { path = "../contextful-policy" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
