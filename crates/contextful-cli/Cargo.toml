[package]
build = "../../tools/ci/build_source.rs"
name = "contextful-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "contextful"
path = "src/main.rs"

[dependencies]
# The data plane: every adapter a pipeline, a store or a read reaches, the read path's
# under `read-plane` and the run path's under `data-plane`; the control profile links
# none of them (`topology.package.profile`).
contextful-agent = { path = "../contextful-agent", optional = true }
contextful-connectors = { path = "../contextful-connectors", optional = true }
contextful-context = { path = "../contextful-context", default-features = false, optional = true }
contextful-core = { path = "../contextful-core" }
contextful-engine = { path = "../contextful-engine", optional = true }
# The harness core: case loader, stub embedder, metrics, report, floors and baseline gate.
contextful-eval = { path = "../../tools/eval", optional = true }
contextful-memory = { path = "../contextful-memory", optional = true }
# The binary wires `authority.exchange.surface`, the one package enabling the policy
# package's `exchange` feature (`topology.package.exchange-optional`).
contextful-policy = { path = "../contextful-policy", features = ["exchange"] }
contextful-outbound = { path = "../contextful-outbound", default-features = false, optional = true }
# The binary is the one package compiling SQLite into the build (`topology.package.sqlite-adapter`).
contextful-sqlite = { path = "../contextful-sqlite", features = ["bundled"], optional = true }
contextful-sync = { path = "../contextful-sync", optional = true }
# The component host (`topology.package.component-host`), linked under `component-host`.
contextful-wasm = { path = "../contextful-wasm", default-features = false, optional = true }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
url = "2"

[dev-dependencies]
ed25519-dalek = "2"
# The loopback S3 server the S3 sync suite pushes and pulls against.
contextful-acceptance = { path = "../acceptance" }
# Signing the external assertions `contextful token exchange` verifies.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[features]
# The developer build: the data plane with every adapter but the Drive source.
default = ["data-plane", "transport-ureq", "component-host", "s3-sync"]
# The three profiles (`topology.package.profile`), each selected alone with
# `--no-default-features --features <profile>`. The read replica links the read path
# alone (`topology.package.edge-profile`).
contextful-edge = ["read-plane", "transport-ureq", "s3-sync"]
contextful-full = ["data-plane", "transport-ureq", "s3-sync", "drive", "component-host"]
contextful-control = []
# The read path: the store, bucket sync, the read face and its tool server. A build
# without it answers each data-plane subcommand with `ProfileCapabilityAbsent`.
read-plane = [
    "dep:contextful-agent",
    "dep:contextful-context",
    "contextful-context/read",
    "dep:contextful-outbound",
    "dep:contextful-sync",
]
# The run path over the read path: the execution core and its scheduler, the connectors,
# the SQLite run store, memory synthesis and the evaluation runner. A build without it
# answers each run-path subcommand with `ProfileCapabilityAbsent`.
data-plane = [
    "read-plane",
    "dep:contextful-connectors",
    "dep:contextful-engine",
    "dep:contextful-eval",
    "dep:contextful-memory",
    "dep:contextful-sqlite",
]
transport-ureq = ["read-plane", "contextful-outbound/transport-ureq", "contextful-connectors?/transport-ureq", "contextful-wasm?/transport-ureq"]
# Component sources run as guests under the component host; without it each refuses as
# `ComponentHostMissing`.
component-host = ["data-plane", "dep:contextful-wasm"]
# The interpreted target a component source selects with `--component-target pulley`.
pulley = ["component-host", "contextful-wasm/pulley"]
# The PDF decode worker behind the process boundary, which the `file` source's PDF pages
# decode through.
pdf = ["data-plane", "contextful-connectors/pdf"]
# The Google Drive source, decoding its PDF pages through the same worker.
drive = ["pdf", "contextful-connectors/drive"]
# The S3 and R2 bucket adapter behind `s3://`, `r2://` and `https://` sync endpoints
# (`topology.package.s3-sync-optional`) and the `s3` object source.
s3-sync = ["read-plane", "contextful-sync/s3-sync", "contextful-connectors?/s3"]

# Feature sets the features stage tests beside none and all
# (`assurance.build.profile-build`): the bare data plane reaches each compiled-out
# adapter's refusal, and the read replica refuses the run path by name.
[package.metadata.contextful]
feature-runs = ["data-plane", "contextful-edge"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
