[package]
name = "contextful-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The run path's execution core: the runner, the journal and awakeables over their store
# ports with the file-tree and memory adapters, the local catalog, cancellation and the
# live run projection. It reaches the store only through the `Destination` port
# `contextful-cli` wires.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-fs = { path = "../contextful-fs" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Ledger measures record their figures (`assurance.measure.record`).
contextful-eval = { path = "../../tools/eval" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
