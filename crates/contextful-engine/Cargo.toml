[package]
name = "contextful-engine"
version = "0.1.0"
edition = "2021"
publish = false

# The run path's execution core: the runner, the journal and its blob store, the local
# catalog, awakeables, cancellation and the live run projection. It reaches the store
# only through the `Destination` port `contextful-cli` wires.

[dependencies]
contextful-core = { path = "../contextful-core" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
