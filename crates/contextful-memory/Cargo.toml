[package]
name = "contextful-memory"
version = "0.1.0"
edition = "2021"
publish = false

# Memory synthesis over the store: a pass reads landed rows through the writing
# credential's session, extracts claims through the inference port, resolves, revises and
# lands them; the direct write lands a principal's claim.

[dependencies]
contextful-context = { path = "../contextful-context", features = ["read"] }
contextful-core = { path = "../contextful-core" }
contextful-policy = { path = "../contextful-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
