[package]
name = "contextful-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The sandboxed component host: guest connectors built against `wit/connector.wit` run
# under wasmtime, reach the network only through the mediated client in
# `contextful-outbound`, and hand batches over as Arrow IPC.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-outbound = { path = "../contextful-outbound", default-features = false }
arrow-array = "57"
arrow-ipc = { version = "57", default-features = false }
arrow-schema = "57"
bytes = "1"
http = "1"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
url = "2"
wasmtime = { version = "49", default-features = false, features = ["anyhow", "async", "cranelift", "runtime", "component-model", "std"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "49", default-features = false, features = ["p2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# No `default` feature, as in `contextful-outbound`: every build selection resolves the
# package under one feature set, and the binary names `transport-ureq` itself.
[features]
transport-ureq = ["contextful-outbound/transport-ureq"]
# The interpreted target: components compile to Pulley bytecode and run without
# executable memory, for processes under a hardened runtime that refuses JIT.
pulley = ["wasmtime/pulley"]

# The suite drives loopback servers over the ureq adapter, with or without the feature.
[dev-dependencies]
contextful-outbound = { path = "../contextful-outbound", features = ["transport-ureq"] }
half = "2"
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
