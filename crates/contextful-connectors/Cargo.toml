[package]
name = "contextful-connectors"
version = "0.1.0"
edition = "2021"
publish = false

# The native sources compiled into the binary. Each reaches the network only through the
# mediated client in `contextful-runtime`.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-runtime = { path = "../contextful-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
