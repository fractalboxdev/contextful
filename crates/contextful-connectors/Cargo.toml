[package]
name = "contextful-connectors"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The native sources compiled into the binary. Each reaches the network only through the
# mediated client in `contextful-runtime`.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-runtime = { path = "../contextful-runtime" }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
