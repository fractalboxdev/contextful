[package]
name = "contextful-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The native sources compiled into the binary. Each reaches the network only through the
# mediated client in `contextful-outbound`.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-decode = { path = "../contextful-decode" }
contextful-outbound = { path = "../contextful-outbound", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"

[features]
default = ["transport-ureq"]
transport-ureq = ["contextful-outbound/transport-ureq"]
# The PDF decoder the decode worker runs, for the `file` and drive sources.
pdf = ["contextful-decode/pdf"]
# The Google Drive source.
drive = ["pdf"]
# Lists the `s3` object source as compiled in. The binary enables it beside the store's S3
# bucket adapter, which it wires in as the source's `Objects` port.
s3 = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The suite drives loopback servers over the ureq adapter, with or without the feature.
[dev-dependencies]
contextful-outbound = { path = "../contextful-outbound", features = ["transport-ureq"] }
flate2 = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

# The third-party crates a connector package depends on directly
# (`assurance.build.dependency-allowlist`): `regex` matches in linear time and `serde_json`
# stops at a fixed nesting depth; no backtracking regex engine and no parser lifting its
# recursion bound is admitted. `contextful-ci allowlist` holds this package and
# `contextful-decode` to it.
[package.metadata.contextful]
authoring-allowlist = [
    "flate2",
    "libc",
    "pdf-extract",
    "quick-xml",
    "regex",
    "serde",
    "serde_json",
    "sha2",
    "tempfile",
    "time",
    "url",
    "zip",
]
