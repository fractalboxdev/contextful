[package]
name = "contextful-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Pure domain types and the port traits every adapter implements. No I/O, no async
# runtime, no HTTP client, no columnar format (topology.package.domain-impurity).

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }
toml = "0.8"
url = "2"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
