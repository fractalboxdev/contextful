[package]
build = "../../tools/ci/build_source.rs"
name = "contextful-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Pure domain types and the port traits every adapter implements. No I/O, no async
# runtime, no HTTP client, no columnar format (topology.package.domain-impurity).

[dependencies]
base64 = "0.22"
regex-automata = "0.4"
regex-syntax = "0.8"
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
# The decision module parses a case with the same float reader native and on
# `wasm32-unknown-unknown`, where no other package unifies the feature in.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }
toml = "0.8"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[features]
# The JSON Schema derives behind `contextful schema export`; off in every package but the
# binary, so the store write half links no schema library
# (topology.package.store-write-engine-free).
schema = ["dep:schemars"]

[dev-dependencies]
# Model-based merge tests draw writer histories as state machines.
proptest = "1.10"
proptest-state-machine = "0.8"
trybuild = "1"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
