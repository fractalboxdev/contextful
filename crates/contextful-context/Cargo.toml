[package]
name = "contextful-context"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The store adapter and the read face: Parquet table parts, run and snapshot manifests, the table
# pointer, the fold, the relation a scan resolves, and, under `read`, the SQL engine reads
# execute on.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-fs = { path = "../contextful-fs" }
contextful-policy = { path = "../contextful-policy" }
arrow-array = "58"
arrow-buffer = "58"
arrow-cast = "58"
arrow-ord = "58"
arrow-row = "58"
arrow-schema = "58"
arrow-select = "58"
base64 = "0.22"
bytes = "1"
# The read face's embedded SQL engine: Parquet reading and statement serialization link
# statically, so the read path loads no extension while serving; the scalar-function
# interface carries the pepper-holding mask functions. Only the `read` feature links it.
duckdb = { version = "1.10500", features = ["bundled", "parquet", "json", "vscalar"], optional = true }
getrandom = "0.3"
half = "2"
# Read-only mapping of a plaintext vector sidecar (`store.encrypt.sidecar-reader`).
memmap2 = "0.9"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd", "encryption"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[features]
default = ["read"]
# The read face: the embedded SQL engine and the query face over it. A host that lands,
# folds or scans a store without serving reads builds with `default-features = false`.
read = ["dep:duckdb"]

[dev-dependencies]
# Ledger measures record their figures (`assurance.measure.record`).
contextful-eval = { path = "../../tools/eval" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
