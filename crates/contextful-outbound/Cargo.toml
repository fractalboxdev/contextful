[package]
build = "../../tools/ci/build_source.rs"
name = "contextful-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Host mediation for every outbound request a connector makes: the allowlist, the
# pre-send hook, address vetting, origin pinning and credential attachment over one
# transport port; and the credential resolver chain with its lease provider.

[dependencies]
contextful-core = { path = "../contextful-core" }
getrandom = "0.3"
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
# Signature Version 4 for the AWS adapters.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# No `default` feature: a member selected by `--workspace` activates its own `default`,
# one selected through a dependent does not, and the differing feature sets hash every
# dependent twice. Each dependent names `transport-ureq` where it links the adapter.
[features]
# The ureq adapter of the transport port. Without it the crate links no HTTP stack, and
# an embedder supplies its own `egress::Transport`.
transport-ureq = ["dep:ureq"]
# The `aws-secrets-manager` adapter, signing under the workload role. A build without it
# links no Secrets Manager client (`connector.resolve.provider-chain`).
aws-secrets-manager = ["transport-ureq", "sigv4"]
# The `aws-sqs` adapter behind the `Queue` port, signing under the workload role
# (`topology.compose.queue-sqs`). A build without it links no SQS client.
aws-sqs = ["transport-ureq", "sigv4"]
# The Signature Version 4 header signer the AWS adapters share; it performs no I/O.
sigv4 = ["dep:hmac", "dep:sha2"]

# The suite drives loopback servers over the ureq adapter, which the package's own
# dev-dependency entry links into every test build.
[dev-dependencies]
contextful-outbound = { path = ".", features = ["transport-ureq", "aws-secrets-manager", "aws-sqs"] }
contextful-eval = { path = "../../tools/eval" }
contextful-acceptance = { path = "../acceptance" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
