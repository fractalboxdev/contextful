[package]
name = "contextful-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Host mediation for every outbound request a connector makes: the allowlist, the
# pre-send hook, address vetting, origin pinning and credential attachment over one
# transport port; and the credential resolver chain with its lease provider.

[dependencies]
contextful-core = { path = "../contextful-core" }
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

# No `default` feature: a member selected by `--workspace` activates its own `default`,
# one selected through a dependent does not, and the differing feature sets hash every
# dependent twice. Each dependent names `transport-ureq` where it links the adapter.
[features]
# The ureq adapter of the transport port. Without it the crate links no HTTP stack, and
# an embedder supplies its own `egress::Transport`.
transport-ureq = ["dep:ureq"]

# The suite drives loopback servers over the ureq adapter, which the package's own
# dev-dependency entry links into every test build.
[dev-dependencies]
contextful-outbound = { path = ".", features = ["transport-ureq"] }
contextful-eval = { path = "../../tools/eval" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
