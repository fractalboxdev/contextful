[package]
name = "contextful-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The record decoders every source shares: JSON, JSON Lines, delimited text and a workbook.
# The package links no network stack (`topology.package.decode-network-free`).

[dependencies]
contextful-core = { path = "../contextful-core" }
flate2 = "1"
pdf-extract = { version = "0.12", optional = true }
quick-xml = "0.37"
serde_json = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[features]
# PDF page text, pure Rust; a caller runs it behind the decode process boundary.
pdf = ["dep:pdf-extract"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
