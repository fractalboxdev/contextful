[package]
name = "contextful-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The credential format adapter (the delegation profile over biscuit), admission,
# possession proofs, key sets, revocation and the exchange.

[dependencies]
contextful-core = { path = "../contextful-core" }
contextful-fs = { path = "../contextful-fs" }
biscuit-auth = "6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
# Possession proofs: the client key scheme, the body digest and the compact encoding.
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
# Verifying an ES256 signing-port signature: audit roots and tips, and the mint's check
# of the port's answer.
p256 = "0.13"
# The audit chain: the keyed query digest.
hmac = "0.12"
# Audit format v1: the RFC 8785 canonical entry and the BLAKE3 chain digest.
serde_json_canonicalizer = "0.3"
blake3 = "1"
# The exchange: external assertion verification under injected material, behind the
# `exchange` feature (`topology.package.exchange-optional`).
jsonwebtoken = { version = "11", features = ["rust_crypto"], optional = true }
# The credential format: reading the library's block encoding, credential identifiers
# and revocation identifiers.
hex = "0.4"
prost = "0.10"
rand = "0.8"

# Local admission: the kernel-reported uid of a Unix socket peer.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The decision module's `wasm32-unknown-unknown` build: the credential library reads its
# evaluator clock through one host import, and verification draws no randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
biscuit-auth = { version = "6", features = ["wasm"] }
getrandom = { version = "0.2", features = ["custom"] }

[features]
# The exchange suite runs under `--features exchange`; the gate's features stage tests
# this package both ways (`assurance.build.staged-feature-runs`).
exchange = ["dep:jsonwebtoken"]

[dev-dependencies]
# Ledger measures record their figures (`assurance.measure.record`).
contextful-eval = { path = "../../tools/eval" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
