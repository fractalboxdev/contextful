[package]
name = "contextful-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Host mediation for every outbound request a connector makes: the allowlist, address
# vetting, origin pinning and credential attachment; and the credential resolver chain
# with its lease provider.

[dependencies]
contextful-core = { path = "../contextful-core" }
serde_json = "1"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
