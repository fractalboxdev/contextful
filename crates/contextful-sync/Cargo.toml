[package]
build = "../../tools/ci/build_source.rs"
name = "contextful-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Bucket push and pull: the object-store adapters, the bucket manifest commit, fenced
# bucket leases and pointer publication, the conditional-write probe and replica refresh.

[dependencies]
contextful-context = { path = "../contextful-context", default-features = false }
contextful-core = { path = "../contextful-core" }
contextful-policy = { path = "../contextful-policy" }
getrandom = "0.3"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
# The S3 adapter, off by default (`topology.package.s3-sync-optional`): a sans-I/O Signature Version 4
# signer and list-response parser, and a blocking HTTP client over rustls.
rusty-s3 = { version = "0.10", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
# The S3 and R2 bucket adapter. Without it the package links no HTTP stack and opens
# filesystem buckets alone.
s3-sync = ["dep:rusty-s3", "dep:ureq"]

[dev-dependencies]
# An in-process S3 server the S3 adapter's suite runs against.
contextful-acceptance = { path = "../acceptance" }
# Ledger measures record their figures (`assurance.measure.record`).
contextful-eval = { path = "../../tools/eval" }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
