# Throwaway spike for #734. The empty `[workspace]` table makes this package its own
# workspace root, so it stays outside the repository workspace, its lockfile and the gate.
[workspace]

[package]
name = "iceberg-export-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
arrow-array = "58"
arrow-buffer = "58"
arrow-cast = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }
iceberg = { version = "=0.10.1" }
iceberg-catalog-rest = "=0.10.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
iceberg-storage-opendal = "=0.10.1"
serde_json = "1.0.154"
reqwest = { version = "0.12", features = ["json"] }
