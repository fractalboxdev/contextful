# Demonstration pins.
#
# One entry per clause, naming the single artifact that demonstrates it:
#
#   "store.fold.partial-snapshot"  = { test = "contextful_store::fold::tests::partial_snapshot_refused" }
#   "authority.admit.narrowing"    = { theorem = "Contextful.Authority.narrowing_implies_parent" }
#   "store.declare.table-block"    = { item = "contextful_core::pipeline::TableModel" }
#
# A test also pins its clause from its own file, with a tag line above the function:
#
#   /// <the clause statement>
#   // spec: store.fold.partial-snapshot@<first 8 hex of the statement's SHA-256>
#   #[test]
#   fn partial_snapshot() { ... }
#
# `contextful-spec scaffold <contract>.<operation> --package <path>` writes these tagged
# tests, one per refusal and limit clause, each holding a `todo!` until it is written.
#
# An unpinned clause computes `committed`. A pinned clause computes `performed` when the
# artifact is a defined Rust, Lean or gate-run native TypeScript test, is no ignored
# or placeholder test and, for a tag, matches the statement's current rev;
# `broken` otherwise, which reds the gate: a rename or a reworded clause is what fails,
# where a forgotten prose edit is silent. A stale rev raises SpecStalePin; two different
# tests pinning one clause raise SpecBrokenPin.
#
# A refusal or a limit takes a `test` or a `theorem`; an `item` proves presence, not behavior.
# `contextful-spec state` reads this file and the tags and writes spec/status.md.

