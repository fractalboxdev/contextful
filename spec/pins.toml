# Demonstration pins.
#
# A test pins its clause from its own file, with a tag line above the function:
#
#   /// <the clause statement>
#   // spec: store.fold.partial-snapshot@<first 8 hex of the statement's SHA-256>
#   #[test]
#   fn partial_snapshot() { ... }
#
# A Lean theorem takes `-- spec: <id>@<rev>` the same way. This file holds the pins a tag
# cannot carry, by path, with the file or module part naming where the artifact sits:
#
#   "authority.admit.narrowing"    = { theorem = "Contextful.Authority.narrowing_implies_parent" }
#   "store.declare.table-block"    = { item = "contextful_core::pipeline::TableModel" }
#
# `contextful-spec pins --migrate` moves a `test` entry into a tag above its test, and
# `contextful-spec retag <clause>` rewrites the revs of a reworded clause's tags.
# `contextful-spec scaffold <contract>.<operation> --package <path>` writes tagged tests,
# one per refusal and limit clause, each holding a `todo!` until it is written.
#
# An unpinned clause computes `committed`. A pinned clause computes `performed` when the
# artifact is a defined Rust, Lean or gate-run native TypeScript test, is no ignored
# or placeholder test and, for a tag, matches the statement's current rev;
# `broken` otherwise. A stale rev raises SpecStalePin.
#
# A refusal or a limit takes a `test` or a `theorem`; an `item` proves presence, not behavior.
# `contextful-spec state` reads this file and the tags and writes spec/status.md and the
# `pins` of spec/spec.lock.json.

[pin]
"authority.verify.no-bypass-constructor" = { item = "contextful_policy::verify::AdmittedAuthority" }
"topology.compose.crossing-version"   = { item = "contextful_wasm::host::WORLD" }
"topology.coordinate.inventory"            = { item = "contextful_core::coordinate::Catalog" }

# The floor is machine-maintained: `contextful-spec pins` sets each contract's entry to
# its live performed count, and a live count below its floor raises SpecCoverageRegression.

[floor]
assurance = 358
authority = 291
connector = 319
corpus = 126
disclosure = 177
read = 292
run = 620
store = 373
surface = 194
topology = 92
