# Target profile — AWS. `corpus.targets` states the rules this file obeys;
# `contextful-spec lint --check targets` enforces them and `contextful-spec state`
# renders spec/targets.md from it.

provider = "aws"
title    = "AWS"
serves   = "VPC-bound and regulated deployments, and teams already operating on AWS."
primitives = ["functions", "containers", "scheduler", "managed-postgres", "object-store", "queue", "secret-store"]

runtime = '''
The `lambda-fargate` target runs reconciliation in Lambda, starts ECS tasks with `RunTask` directly, and hosts the native Linux `contextful-full` executable in Fargate containers. The query process embeds DuckDB; component execution embeds Wasmtime. RDS Postgres supplies the shared catalog, the engine journal in it makes every run durable and resumable, and S3 holds corpus objects. The `fargate-daemon` alternative keeps scheduling and reconciliation in the native daemon.
'''

diagram = '''
flowchart LR
  CALLER(["MCP or HTTP client"]):::muted
  subgraph ACCOUNT["AWS target"]
    TICK["EventBridge Scheduler"]:::accent
    REC["Lambda reconciler"]:::accent
    ALB["Application Load Balancer"]:::accent
    subgraph TASK["Fargate Linux tasks"]
      QUERY["contextful serve process"]:::accent
      RUN["contextful execution process"]:::accent
    end
    CAT[("RDS Postgres")]:::store
    OBJ[("S3 corpus bucket")]:::store
  end
  TICK -- "due tick" --> REC
  REC -- "ECS RunTask" --> RUN
  CALLER -- "HTTPS" --> ALB
  ALB -- "HTTP store request" --> QUERY
  QUERY -- "read snapshot" --> OBJ
  QUERY -- "catalog read" --> CAT
  RUN -- "conditional write" --> CAT
  RUN -- "publish parts" --> OBJ
'''

[[shape]]
name     = "lambda-fargate"
default  = true
kind     = "orchestrated"
profiles = ["full"]
excludes = []
uses     = ["functions", "containers", "scheduler", "managed-postgres", "object-store", "queue", "secret-store"]

[shape.roles]
cron_tick    = "EventBridge Scheduler"
reconciler   = "Lambda"
orchestrator = "engine journal in the catalog"
catalog      = "RDS Postgres via pg-catalog"
object_store = "S3"
query_face   = "ALB → warm contextful-full on Fargate"
compute      = "Fargate task the reconciler starts with ECS RunTask"
secrets      = "Secrets Manager adapter through the task role"
queue        = "SQS standard queue; S3 event notifications to SQS for object arrival"
realtime     = "Fargate-hosted run projection"

[[shape]]
name = "lambda-only"
kind = "function"
profiles = ["edge"]
wall_clock_cap_min = 15
excludes = ["first-time-backfill", "component-connector"]
uses     = ["functions", "scheduler", "managed-postgres", "object-store", "secret-store"]

[shape.roles]
cron_tick    = "EventBridge Scheduler"
reconciler   = "Lambda"
orchestrator = "engine journal in the catalog"
catalog      = "RDS Postgres via pg-catalog"
object_store = "S3"
query_face   = "Lambda function URL through the Lambda Web Adapter to a read-only contextful serve"
compute      = "Lambda"
secrets      = "Secrets Manager adapter through the function role"

[[shape]]
name     = "fargate-daemon"
kind     = "daemon"
profiles = ["full"]
excludes = []
uses     = ["containers", "managed-postgres", "object-store", "queue", "secret-store"]

[shape.roles]
cron_tick    = "in-process scheduler"
reconciler   = "in-process reconcile loop"
orchestrator = "engine journal in the catalog"
catalog      = "RDS Postgres via pg-catalog"
object_store = "S3"
query_face   = "ALB → contextful serve on Fargate"
compute      = "in-process component host"
secrets      = "Secrets Manager adapter through the task role"
queue        = "SQS standard queue; S3 event notifications to SQS for object arrival"
