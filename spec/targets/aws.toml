# Target profile — AWS. `corpus.targets` states the rules this file obeys;
# `contextful-spec lint --check targets` enforces them and `contextful-spec state`
# renders spec/targets.md from it.

provider = "aws"
title    = "AWS"
serves   = "VPC-bound and regulated deployments, and teams already operating on AWS."
primitives = ["containers", "scheduler", "managed-postgres", "object-store", "queue", "secret-store"]

runtime = '''
The `scheduled-fargate` target runs every process as the native Linux `contextful-full` executable in Fargate containers. EventBridge Scheduler starts `contextful pipeline serve --cycle` as an ECS task on a fixed rate; the cycle takes the cadence lease, runs every due unit and exits. A long-running `contextful serve` behind an Application Load Balancer answers queries and pulls the bucket every 30 s. The query process embeds DuckDB; component execution embeds Wasmtime. RDS Postgres supplies the shared catalog, the engine journal in it makes every run durable and resumable, and S3 holds corpus objects. The `fargate-daemon` alternative keeps scheduling in one always-on task for sub-minute cadences.

The OpenTofu configuration under `apps/aws-fargate/` provisions either shape: a private VPC with its service endpoints, RDS Postgres, the S3 corpus bucket, the SQS queue with its dead-letter queue and object-arrival notification, the ECS cluster, the cycle task or daemon service, and the `serve` service behind the load balancer.
'''

diagram = '''
flowchart LR
  CALLER(["MCP or HTTP client"]):::muted
  subgraph ACCOUNT["AWS target"]
    TICK["EventBridge Scheduler"]:::accent
    ALB["Application Load Balancer"]:::accent
    subgraph TASK["Fargate Linux tasks"]
      CYCLE["contextful cycle process"]:::accent
      QUERY["contextful serve process"]:::accent
    end
    CAT[("RDS Postgres")]:::store
    OBJ[("S3 corpus bucket")]:::store
  end
  TICK -- "ECS RunTask" --> CYCLE
  CALLER -- "HTTPS" --> ALB
  ALB -- "HTTP store request" --> QUERY
  CYCLE -- "conditional write" --> CAT
  CYCLE -- "publish parts" --> OBJ
  QUERY -- "pull snapshot" --> OBJ
  QUERY -- "catalog read" --> CAT
'''

[[shape]]
name     = "scheduled-fargate"
default  = true
kind     = "orchestrated"
profiles = ["full"]
excludes = []
uses     = ["containers", "scheduler", "managed-postgres", "object-store", "queue", "secret-store"]

[shape.roles]
cron_tick    = "EventBridge Scheduler"
reconciler   = "`pipeline serve --cycle` in the scheduled Fargate task"
orchestrator = "engine journal in the catalog"
catalog      = "RDS Postgres via pg-catalog"
object_store = "S3"
query_face   = "ALB → contextful serve on Fargate"
compute      = "in-process component host of the scheduled task"
secrets      = "Secrets Manager adapter through the task role"
queue        = "SQS standard queue; S3 event notifications to SQS for object arrival"
realtime     = "Fargate-hosted run projection"

[[shape]]
name     = "fargate-daemon"
kind     = "daemon"
profiles = ["full"]
excludes = []
uses     = ["containers", "managed-postgres", "object-store", "queue", "secret-store"]

[shape.roles]
cron_tick    = "in-process scheduler"
reconciler   = "in-process reconcile loop"
orchestrator = "engine journal in the catalog"
catalog      = "RDS Postgres via pg-catalog"
object_store = "S3"
query_face   = "ALB → contextful serve on Fargate"
compute      = "in-process component host"
secrets      = "Secrets Manager adapter through the task role"
queue        = "SQS standard queue; S3 event notifications to SQS for object arrival"
