# Target profile — Cloudflare. `corpus.targets` states the rules this file obeys;
# `contextful-spec lint --check targets` enforces them and `contextful-spec state`
# renders spec/targets.md from it.

provider = "cloudflare"
title    = "Cloudflare"
serves   = "Cloudflare deployments with a Linux Container, D1 execution metadata and R2 objects."
primitives = ["functions", "containers", "workflows", "scheduler", "durable-objects", "d1", "object-store", "queue", "secret-store"]

runtime = '''
Cloudflare uses one deployment configuration, `worker-container-d1`. TypeScript routing and reconciliation run in Workers' V8 isolates. Cron Triggers schedule work; Workflows coordinates execution. A Durable Object controls the Linux Container's lifecycle. The Container runs the native `contextful-full` executable with embedded DuckDB and Wasmtime. Workers and Workflows call the Container through requests.

The Rust processes use `CONTEXTFUL_STORAGE_PROFILE=cloudflare-d1`. Requests to the private `contextful.d1` host call a Worker binding handler. The handler reads and writes execution metadata in D1 and execution blobs in R2. A separate R2 bucket stores corpus parts and manifests through its S3-compatible API. Files inside the Container are a replaceable working copy.

Cloudflare Queues carries receive batches and object-arrival notifications. The Rust engine writes the store. A separate Durable Object manages hibernating WebSocket connections for run updates. Workers Secrets supplies credentials to configured bindings. The optional console server runs on a Node.js host. The React assets provide a static browser preview without that server.

The example under `apps/cloudflare-execution/` exposes authenticated `POST /conformance`. Its Container runs `contextful-conformance` against the packaged Linux `contextful` binary. This endpoint tests execution storage; it serves no query or orchestration routes. `status.md` records clause implementation evidence.
'''

diagram = '''
flowchart LR
  CALLER(["MCP or HTTP client"]):::muted
  subgraph ACCOUNT["Cloudflare target"]
    subgraph WORKERS["Workers V8 isolates"]
      ROUTER["routing Worker"]:::accent
      RECON["reconciler Worker"]:::accent
      BIND["execution binding handler"]:::accent
      OWNER["Container Durable Object"]:::accent
    end
    CRON["Cron Trigger"]:::accent
    FLOW["Workflows"]:::accent
    subgraph LINUX["Linux Container running contextful-full"]
      RUST["Rust engine"]:::accent
      SQL["DuckDB library"]:::accent
      WASM["Wasmtime component host"]:::accent
      FILES[("ephemeral snapshot files")]:::store
    end
    DB[("D1 execution database")]:::store
    BLOBS[("R2 execution blobs")]:::store
    CORPUS[("R2 corpus bucket")]:::store
  end
  CALLER -- "HTTPS" --> ROUTER
  ROUTER -- "store request" --> OWNER
  CRON -- "scheduled event" --> RECON
  RECON -- "due execution" --> FLOW
  FLOW -- "dispatch step" --> OWNER
  OWNER -- "start and forward" --> RUST
  RUST -- "SQL" --> SQL
  RUST -- "component invocation" --> WASM
  RUST -- "hydrate snapshot" --> FILES
  SQL -- "scan snapshot" --> FILES
  RUST -- "private contextful.d1 HTTP" --> BIND
  BIND -- "SQL batch" --> DB
  BIND -- "content-addressed objects" --> BLOBS
  RUST -- "S3 API sync" --> CORPUS
'''

[[shape]]
name     = "worker-container-d1"
default  = true
kind     = "orchestrated"
profiles = ["full"]
excludes = []
uses     = ["functions", "containers", "workflows", "scheduler", "durable-objects", "d1", "object-store", "queue", "secret-store"]

[shape.roles]
cron_tick    = "Cron Trigger"
reconciler   = "Worker"
orchestrator = "Workflows"
catalog      = "D1 through a private Worker outbound binding"
object_store = "R2"
query_face   = "Worker router → warm contextful-full Container"
compute      = "Container with cloudflare-d1 storage profile"
secrets      = "Workers Secrets"
queue        = "Cloudflare Queues with a pull consumer; R2 event notifications for object arrival"
realtime     = "Durable Object with a hibernating WebSocket"
