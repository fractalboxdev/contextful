# Registry fragment — contract `assurance`, files spec/80-formal.md and spec/81-engineering.md.

[operation]
model             = {}
prove             = {}
audit-axioms      = {}
recheck           = {}
scope-claim       = {}
differential-test = {}
structure-tree    = {}
automate          = {}
test              = {}
build             = {}
gate              = {}
evaluate          = {}
baseline          = {}

[error]
FormalPackageDependency          = { clause = "assurance.model.declared-dependency", gloss = "The Lean package manifest declares an external library." }
ProofToolchainDrift              = { clause = "assurance.model.toolchain-drift", gloss = "The resolved toolchain release string differs from the pinned one." }
UnmodelledConstructor            = { clause = "assurance.model.unmodelled-constructor", gloss = "A placement category the manifest admits has no case in the model's inductive." }
ProtocolInvariantViolated        = { clause = "assurance.model.protocol-check", gloss = "A state the bounded check reaches breaks a protocol invariant." }
ProtocolConformanceDrift         = { clause = "assurance.differential-test.protocol-drift", gloss = "The protocol model and the Rust store disagree on the state after a step." }
CommutationClaimed               = { clause = "assurance.prove.commutation-claim", gloss = "Order-independence asserted over stages whose order the composition theorem fixes." }
ZoneInclusionSampled             = { clause = "assurance.prove.sampled-inclusion", gloss = "Inclusion decided by evaluating a fixed set of example values." }
ProofTargetUnbound               = { clause = "assurance.prove.unbound-target", gloss = "A proof target named in the claim with no authenticated query path bound to it." }
TheoremWithoutNegativeSpace      = { clause = "assurance.prove.no-negative-space", gloss = "A theorem published with no statement of what it leaves open." }
MediationClaimedFromComposition  = { clause = "assurance.prove.mediation-from-composition", gloss = "A filter-composition theorem offered as a mediation theorem." }
AxiomOutsideAllowlist            = { clause = "assurance.audit-axioms.axiom-outside-allowlist", gloss = "A constant's footprint reaches an axiom absent from the allowlist." }
ProofHoleAxiom                   = { clause = "assurance.audit-axioms.hole-axiom", gloss = "A footprint contains the hole axiom." }
NativeEvaluationAxiom            = { clause = "assurance.audit-axioms.native-evaluation-axiom", gloss = "A footprint contains a per-declaration native-evaluation axiom." }
TheoremConstantMissing           = { clause = "assurance.audit-axioms.missing-constant", gloss = "A required constant is absent from the elaborated environment." }
TheoremStatementDrift            = { clause = "assurance.audit-axioms.statement-drift", gloss = "A required constant's elaborated statement differs from its expected text." }
RecheckEnvironmentCredentialed   = { clause = "assurance.recheck.credential-free", gloss = "The recheck environment exposes a credential." }
RecheckReportMismatch            = { clause = "assurance.recheck.report-mismatch", gloss = "The recheck's per-constant statement or axiom set differs from the first phase's." }
ClaimBeyondNamedDecisions        = { clause = "assurance.scope-claim.beyond-named-decisions", gloss = "The assurance claim asserts an object wider than its named decisions." }
TrustedDependencyUnnamed         = { clause = "assurance.scope-claim.unnamed-dependency", gloss = "The claim rests on a component absent from its trusted-dependency list." }
TranslationChainUnstated         = { clause = "assurance.scope-claim.unstated-chain", gloss = "A theorem over translated code claimed without its translation chain." }
RefinementScopeExceeded          = { clause = "assurance.scope-claim.refinement-exceeded", gloss = "Translation reaches cryptography, a parsing adapter, a database call or concurrency." }
ReferenceModelDrift              = { clause = "assurance.differential-test.disagreement", gloss = "The reference model and the engine's decision function disagree on a case." }
CounterexampleDiscarded          = { clause = "assurance.differential-test.discarded-counterexample", gloss = "A run reported a disagreement and wrote no corpus entry." }
CapabilityDuplicated             = { clause = "assurance.structure-tree.duplicated-capability", gloss = "A second implementation of an engine capability, or a hand-written copy of an engine constant." }
MirrorUnresolved                 = { clause = "assurance.structure-tree.mirror-unresolved", gloss = "A mirrors annotation naming no clause of the lock file." }
ShellCheckFailed                 = { clause = "assurance.automate.unchecked-shell", gloss = "A shell file in the tree that the shell linter rejects." }
VacuousAssertion                 = { clause = "assurance.test.vacuous-exclusion", gloss = "An exclusion assertion evaluated over an empty collection." }
TestNotFirst                     = { clause = "assurance.test.test-first", gloss = "A source change carrying no test that fails against the base commit's source." }
AcceptanceLinksEngine            = { clause = "assurance.test.acceptance-surface", gloss = "The acceptance package depending on a workspace package." }
ExtensionAutoloadRefused         = { clause = "assurance.build.runtime-extension-load", gloss = "A read path loading a query-engine extension into a statically linked binary." }
SecretPlaintext                  = { clause = "assurance.gate.secret-ciphertext", gloss = "A tracked dotenv key holding a value other than dotenvx ciphertext, or a tracked private-key file." }
SecretScopeMissing               = { clause = "assurance.gate.secret-scope", gloss = "A tracked dotenv key with no comment above it stating what it grants." }
CrateGraphViolation           = { clause = "assurance.gate.crate-graph", gloss = "A run-path crate reaching a read-path crate outside the three crossing crates." }
EnforceUnmediatedPath            = { clause = "assurance.gate.row-token", gloss = "A row-returning path reaching stored rows outside a registered relation." }
UnconfiguredEgress               = { clause = "assurance.gate.unconfigured-egress", gloss = "An outbound call a default configuration reaches without operator configuration." }
EnforceInterpolatedSubjectClaim  = { clause = "assurance.gate.interpolated-claim", gloss = "A subject claim formatted into SQL text in a runtime crate." }
BuildDiskPrecondition            = { clause = "assurance.gate.free-disk", gloss = "A gate stage beginning below the free-disk floor." }
BuildSizeCeilingExceeded         = { clause = "assurance.gate.build-size", gloss = "Total build size past the gate's ceiling." }
FootprintBudgetExceeded          = { clause = "assurance.gate.footprint-exceeded", gloss = "A profile artifact over its budget, or carrying an extra dynamic dependency." }
SurfaceCheckFailed               = { clause = "assurance.gate.surface-check-failed", gloss = "A TypeScript surface whose typecheck, unit tests or framework build failed." }
EvalCorpusUnlabeled              = { clause = "assurance.evaluate.unlabeled-corpus", gloss = "An evaluation corpus with no policy labels and no explicit local zone." }
BaselinePathUnresolved           = { clause = "assurance.baseline.unresolvable-path", gloss = "A baseline entry naming no report field, under-sampled, or malformed." }
BaselineRunStampMismatch         = { clause = "assurance.baseline.run-stamp-drift", gloss = "A baseline run block differing from the run's configuration." }
GoldenSetIngested                = { clause = "assurance.baseline.answer-key-in-the-store", gloss = "A golden set reaching the store it measures." }
GoldenRedactionFailed            = { clause = "assurance.baseline.generated-redaction", gloss = "A generated golden the write-time redaction pass cannot clear." }
TraceExportOutOfPerimeter        = { clause = "assurance.baseline.trace-export", gloss = "A hosted trace endpoint configured for a run touching a deployed store." }

