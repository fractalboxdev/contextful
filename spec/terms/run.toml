# Terms (`corpus.registry.term`): each term's defining clause and gloss.
[term]
"journal"         = { clause = "run.journal.step-output", gloss = "The durable record of each step's value, written once, so a resumed run replays recorded steps." }
"entry key"       = { clause = "run.journal.entry-key", gloss = "The `(execution_id, step_label, input_hash)` triple keying one journal entry." }
"idempotency key" = { clause = "run.journal.idempotency-key", gloss = "The key an outbound request carries, derived from its entry key, identical on every re-entry." }
"awakeable"       = { clause = "run.suspend.awakeable", gloss = "A single-use token that suspends a run until a caller resolves it or its deadline passes." }
"execution owner" = { clause = "run.own.execution-owner", gloss = "The one durable owner of a scope's executions, holding its connector identity and pins." }
