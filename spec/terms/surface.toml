# Registry fragment — contract `surface`, files spec/70-control-plane.md and spec/71-console.md.

[operation]
arm            = {}
reconcile      = {}
fire           = {}
dispatch       = {}
edit           = {}
apply          = {}
reside         = {}
open-console   = {}
register-store = {}
visualize      = {}
package        = {}
speak          = {}
ground         = {}
plan-turn      = {}
set-vantage    = {}
browse         = {}
