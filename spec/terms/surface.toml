surface-line-chart-floor   = { clause = "surface.render.component-choice", value = 3, unit = "rows", basis = "chosen", gloss = "Rows on distinct days a line needs." }
surface-topic-tier-tokens  = { clause = "surface.brief.topic-tier", value = 2, unit = "tokens", basis = "chosen", gloss = "Shared tokens the topic tier needs." }
