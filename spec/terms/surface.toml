[error]
ConsoleRouteUngated           = { clause = "surface.open-console.ungated-route", gloss = "An anonymous hosted route serving content instead of its declared identity gate." }
ConsolePageForbidden          = { clause = "surface.open-console.wrong-page", gloss = "A page or API call lacking verified identity and its page grant." }
ConsoleAdminGrantMissing      = { clause = "surface.open-console.admin-grant", gloss = "An Admin edit or apply lacking a server-held admin capability." }
ScheduleUnreadable            = { clause = "surface.arm.unreadable-schedule", gloss = "A schedule string the grammar or cron dialect cannot read." }
TriggerAdapterUnknown         = { clause = "surface.arm.unknown-trigger", gloss = "A trigger value naming no adapter." }
TriggerFaceMissing            = { clause = "surface.arm.trigger-face-missing", gloss = "The external trigger on a deployment serving no route for the wake." }
ControlPointerMalformed       = { clause = "surface.reconcile.pointer-malformed", gloss = "A snapshot pointer body that is not wholly a version." }
ControlSnapshotUnreadable     = { clause = "surface.reconcile.fail-static", gloss = "A poll that could not read its pointer or parse the named document." }
ControlSourceNotLoopback      = { clause = "surface.reconcile.loopback-only", gloss = "A control URL whose host is not a loopback address." }
JobKindUnknown                = { clause = "surface.fire.job-kind-unknown", gloss = "A job block naming a kind outside the union, or carrying a command." }
JobConcurrencyUnset           = { clause = "surface.fire.store-driven-concurrency", gloss = "A store-driven job block declaring no positive `max_in_flight`." }
JobBodyUnregistered           = { clause = "surface.fire.store-driven-body", gloss = "A store-driven job block naming a body the binary does not register." }
JobTargetUnbound              = { clause = "surface.fire.target-unbound", gloss = "A job target binding to no produced table or declared model." }
CycleControlSourceUnresolved  = { clause = "surface.fire.cycle-control-source", gloss = "A control source that does not resolve under one-shot evaluation." }
DispatchUnitNotAHead          = { clause = "surface.dispatch.not-a-head", gloss = "A due id that is a step of a dependent run rather than its head." }
StepResultRefused             = { clause = "surface.dispatch.step-result", gloss = "A step callback body that is no pointer, object-store key, catalog row id or failure line, or passes the cap." }
StepToolError                 = { clause = "surface.dispatch.in-band-tool-error", gloss = "An in-band tool error on a step driving the engine over the tool protocol." }
DispatchCallbackRejected      = { clause = "surface.dispatch.callback-rejected", gloss = "A heartbeat or callback carrying a bad signature, a superseded attempt, a skewed timestamp or a closed step." }
DispatchSubmitRejected        = { clause = "surface.dispatch.submit-signed", gloss = "A worker submission unsigned, skewed, or naming a callback off the worker's relay." }
SecretMaterialInDocument      = { clause = "surface.edit.secret-in-document", gloss = "A credential value written into the configuration document." }
ConnectorUploadRefused        = { clause = "surface.edit.connector-upload", gloss = "A connector artifact offered through the operator surface." }
ControlDraftAbsent            = { clause = "surface.apply.draft-absent", gloss = "An Admin apply with no validated store draft." }
ManifestVersionConflict       = { clause = "surface.apply.version-race", gloss = "An apply whose pointer compare-and-swap lost to a concurrent apply." }
ApplyValidationRefused        = { clause = "surface.apply.validation", gloss = "A document engine validation refused; no version was claimed." }
ConfigOwnerUnconfigured       = { clause = "surface.apply.owner-unconfigured", gloss = "A configuration owner with no storage or no credential behind it." }
ConditionalWriteUnsupported   = { clause = "surface.apply.weak-conditional-backend", gloss = "A configuration owner or catalog backend lacking linearizable conditional replacement." }
StoreNotInitialized           = { clause = "surface.apply.uninitialized-store", gloss = "An edit or apply against a store that has taken no guarded import." }
EnforceRegionMismatch         = { clause = "surface.reside.region-mismatch", gloss = "A configured resource resolving outside the residency allow-set." }
ResidencySitesDiverge         = { clause = "surface.reside.site-regions", gloss = "A push whose residency allow-set differs from the one another site recorded in the bucket manifest." }
StoreRegistryUnreadable       = { clause = "surface.register-store.registry-unreadable", gloss = "A store registry payload that does not parse." }
StoreEntryMalformed           = { clause = "surface.register-store.malformed-entry", gloss = "One registry entry that does not decode." }
StoreIdReserved               = { clause = "surface.register-store.reserved-id", gloss = "A configured store claiming a built-in id." }
