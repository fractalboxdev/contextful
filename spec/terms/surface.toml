StdioCredentialMissing        = { clause = "surface.package.stdio-credential", gloss = "A process-transport client with no credential." }
StoreSelectorAbsent           = { clause = "surface.package.store-selector", gloss = "A spawned engine finding no project manifest above its working directory." }
ConsoleSuggestionUnanswerable = { clause = "surface.speak.unanswerable-suggestion", gloss = "A suggested prompt whose answer is a decline." }
ConsoleUngroundedAnswer       = { clause = "surface.ground.ungrounded-answer", gloss = "Answer prose composed in a turn holding no tool result." }
ConsoleToolNotAdmitted        = { clause = "surface.ground.unadmitted-tool", gloss = "A tool call outside the turn's admitted packs." }
ConsoleMutatingToolRequested  = { clause = "surface.ground.mutating-tool", gloss = "A client-reachable path naming a write." }
ConsoleWriteToolOnOrgFace     = { clause = "surface.ground.org-face-read-only", gloss = "A write tool registered on an organization-wide face." }
ConsoleFileAccessDirect       = { clause = "surface.ground.direct-file-read", gloss = "A table function reading stored bytes by path on the caller surface." }
ConsoleTokenExchangeRefused   = { clause = "surface.ground.mint-refused", gloss = "A per-reader mint the store's exchange route refused." }
ConsolePlannerReachedMemory   = { clause = "surface.plan-turn.planner-reached-memory", gloss = "Planner scaffolding naming a memory relation." }
ConsoleVantageUnparseable     = { clause = "surface.set-vantage.unparseable", gloss = "A vantage that is neither a calendar day nor an instant." }
ConsoleWebBoundUnparseable    = { clause = "surface.set-vantage.web-bound-unparseable", gloss = "A web leg whose publication bound does not parse." }
ConsoleLearningUnscoped       = { clause = "surface.learn.unscoped", gloss = "A distilled conclusion landing without the reading-session scope." }
ConsoleViewNotServerBuilt     = { clause = "surface.render.client-authored-view", gloss = "A view from a client or the model rather than inferred from a result." }
ConsoleBriefUnavailable       = { clause = "surface.brief.absence-is-earned", gloss = "A greeting derivation that errored or overran its budget." }
VisibilityShareAffordance     = { clause = "surface.publish-answer.share-affordance", gloss = "A share control offered on access-explanation output." }
VisibilityAskerlessAudience   = { clause = "surface.publish-answer.askerless-audience", gloss = "A scheduled post to an audience under a service identity." }

