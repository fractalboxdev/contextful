[error]
SpecMalformedId        = { clause = "corpus.address.malformed-id", gloss = "A clause id with the wrong shape, contract or operation." }
SpecDuplicateId        = { clause = "corpus.address.duplicate-id", gloss = "A clause id in two rows." }
SpecScenario           = { clause = "corpus.anatomy.bad-scenario", gloss = "A scenario naming a foreign clause, or holding no WHEN/THEN sentence or fixture path." }
SpecTargetIncomplete   = { clause = "corpus.targets.incomplete", gloss = "A target shape leaving a role unfilled, or a target file without exactly one default shape." }
SpecTargetCapUnrecorded = { clause = "corpus.targets.cap-unrecorded", gloss = "A capped target shape not recording its backfill and component-connector exclusions." }
SpecTargetFunctionProfile = { clause = "corpus.targets.function-profile", gloss = "A function-class target shape listing a profile other than edge." }
SpecAnatomy            = { clause = "corpus.anatomy.bad-anatomy", gloss = "A contract file out of its section order, lede, clause list, title or size." }
SpecRegistry           = { clause = "corpus.registry.unregistered", gloss = "A spelling, error or bound out of step with its fragment." }
SpecRegistryDrift      = { clause = "corpus.registry.drift", gloss = "A defining variant out of step with its registry entry, or a refusal whose code site and pin disagree." }
SpecDanglingReference  = { clause = "corpus.reference.dangling", gloss = "A pointer to no clause." }
SpecExternalLink       = { clause = "corpus.reference.no-literature", gloss = "A link out of the spec, or into references/." }
SpecTypeUnresolved     = { clause = "corpus.reference.type-unresolved", gloss = "A type pointer to no struct or enum." }
SpecUnsettled          = { clause = "corpus.rationale.unsettled-line", gloss = "A malformed unknown, or an appendix heading." }
SpecRecord             = { clause = "corpus.rationale.orphan-record", gloss = "An uncited or missing record, a bad Why, or a record out of anatomy." }
SpecCoverageRegression = { clause = "corpus.state.coverage-floor", gloss = "Fewer performed pins than the floor." }
SpecBrokenPin          = { clause = "corpus.state.bad-pin", gloss = "A pin that names no clause, mismatches its kind, does not resolve, or competes with a second test." }
SpecUnwired            = { clause = "corpus.state.unwired-ceiling", gloss = "More public items only a performed pin's test reaches than the recorded ceiling." }
SpecProofObligationUnpinned = { clause = "corpus.state.proof-obligation", gloss = "A clause listed as a proof obligation that does not compute proved." }
SpecStalePin           = { clause = "corpus.state.stale-pin", gloss = "A tag recording a statement revision the clause no longer carries." }
SpecRoadmap            = { clause = "corpus.state.roadmap", gloss = "A roadmap name resolving to nothing, claimed twice, or a milestone missing its reach or acceptance line." }
SpecAcceptanceMissing  = { clause = "corpus.state.acceptance-first", gloss = "A milestone with a pinned clause and no acceptance test." }
SpecDeferredBehavior   = { clause = "corpus.state.deferred-depth", gloss = "A behavior clause in a milestone marked `Depth: operation`." }
SpecStaleRender        = { clause = "corpus.render.generated", gloss = "A generated file differing from regeneration." }
SpecDatedProse         = { clause = "corpus.render.dated-prose", gloss = "Build-state words or a date in authored text." }
SpecCounterfactual     = { clause = "corpus.render.counterfactual", gloss = "Future or conditional mood in a contract file." }
SpecBannedWord         = { clause = "corpus.render.banned-vocabulary", gloss = "A banned noun, refused name or provenance link." }
SpecLocalPath          = { clause = "corpus.render.local-path", gloss = "An absolute path from a local machine." }
SpecAsciiDiagram       = { clause = "corpus.diagram.fence", gloss = "Box-drawing outside a mermaid fence." }
SpecDiagramBoundary    = { clause = "corpus.diagram.boundary", gloss = "A flowchart node standing for a contract or a boundary instead of a container." }
SpecDiagramNode        = { clause = "corpus.diagram.node", gloss = "A flowchart node bundling attributes, naming an error or an operation, or over its word bound." }
SpecDiagramShape       = { clause = "corpus.diagram.shape", gloss = "A table, store, log or queue drawn other than as a cylinder, or a question drawn other than as a decision." }
SpecDiagramEdge        = { clause = "corpus.diagram.edge", gloss = "A two-way edge, an unlabelled edge between non-decision nodes, or an edge label over its bound." }
SpecDiagramDecision    = { clause = "corpus.diagram.decision", gloss = "A decision node with a long label, an error name, no incoming edge, or exits not each labelled with a distinct outcome." }
SpecDiagramBranch      = { clause = "corpus.diagram.branch", gloss = "A non-decision node branching on a condition through its edge labels." }
SpecDiagramOrphan      = { clause = "corpus.diagram.connected", gloss = "A flowchart node no edge reaches, directly or through its subgraph." }
SpecDiagramDuplicate   = { clause = "corpus.diagram.unique-label", gloss = "Two nodes of one flowchart carrying one label." }
SpecDiagramLayout      = { clause = "corpus.diagram.layout", gloss = "A flowchart without a direction, with a subgraph direction, nested too deep, or over its size." }
SpecDiagramLink        = { clause = "corpus.diagram.no-link", gloss = "A flowchart node carrying a `click` link or tooltip." }
SpecDiagramSequence    = { clause = "corpus.diagram.sequence", gloss = "A sequence diagram with undeclared or unused participants, or over a size bound." }
SpecDiagramMessage     = { clause = "corpus.diagram.message", gloss = "A sequence message or note over its word bound." }
SpecDiagramState       = { clause = "corpus.diagram.state", gloss = "A state diagram without one start, with an unreachable or dead-end state, or a long transition label." }
SpecGuide              = { clause = "corpus.guide.bad-guide", gloss = "A missing or malformed guide, or one restating a rule." }
SpecGuideReach         = { clause = "corpus.guide.reach", gloss = "A registered operation its contract's guide never points into." }
SpecGuidePointerDensity = { clause = "corpus.guide.pointer-density", gloss = "A guide paragraph with too many clause pointers or too little prose per pointer." }
SpecGuideBound         = { clause = "corpus.guide.bound", gloss = "A guide sentence restating a bound value without the bound's clause pointer." }
SpecWordCeiling        = { clause = "corpus.anatomy.word-ceilings", gloss = "A contract or contract ADR whose word count differs from its ceiling." }
SpecClauseUnowned      = { clause = "corpus.state.unowned", gloss = "More unpinned, unscheduled and unquestioned clauses than the ceiling records." }
SpecTerm               = { clause = "corpus.registry.bad-term", gloss = "A term registered twice, naming a missing or foreign clause, glossed out of bounds, or avoided as itself a term." }
SpecTermFirstUse       = { clause = "corpus.registry.term-first-use", gloss = "More guide first uses of a term without its defining pointer than the ceiling records." }
SpecTopic              = { clause = "corpus.topic.bad-topic", gloss = "A topic page out of its registry entry, shape or bounds, restating a rule, or leaving an answer unreachable." }
SpecWhyUnscoped        = { clause = "corpus.rationale.why-scoped", gloss = "More Why citations naming a contract ADR without a section than the ceiling records." }

