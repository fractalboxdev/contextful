# Terms (`corpus.registry.term`): each term's defining clause and gloss.
[term]
"clause"          = { clause = "corpus.address.clause-id", gloss = "One normative sentence: a list item under an operation, addressed as contract, operation and subject." }
"lede"            = { clause = "corpus.anatomy.lede", gloss = "The one paragraph opening an operation section, stating what the operation covers." }
"clause pointer"  = { clause = "corpus.reference.pointer", gloss = "A `{{id}}` reference by which one statement reaches a fact another clause owns." }
"why line"        = { clause = "corpus.rationale.why-cell", gloss = "The indented line under a clause naming the record it rests on, or a short `because` criterion." }
"decision record" = { clause = "corpus.rationale.contract-adr", gloss = "A contract's ADR section holding one decision, its options and what each lost on." }
"pin"             = { clause = "corpus.state.pin", gloss = "A link from a clause to the test, theorem or item that demonstrates it." }
"verdict"         = { clause = "corpus.state.verdict", gloss = "A clause's computed state: committed when unpinned, performed when its pins qualify, broken otherwise." }
"ratchet"         = { clause = "corpus.registry.ceiling", gloss = "A recorded count the tree lowers and never raises; a live count off it fails lint." }
"guide"           = { clause = "corpus.guide.file", gloss = "A contract's non-normative teaching page, reaching each rule by pointer." }
"topic page"      = { clause = "corpus.topic.file", gloss = "A non-normative page answering one question that spans contracts by pointing at the clauses that answer it." }
"card"            = { clause = "corpus.render.card", gloss = "A contract's generated page listing its operations, error cases and bounds." }

