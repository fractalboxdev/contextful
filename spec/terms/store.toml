StoreNodeIdShared            = { clause = "store.lay-out.node-id-shared", gloss = "A node id is declared in a control-plane configuration applied to many machines." }
StoreOrderByUnknownColumn    = { clause = "store.declare.key-unknown", gloss = "An `order_by` names a column neither declared nor injected." }
StoreKeyUnknownColumn        = { clause = "store.declare.key-unknown", gloss = "A `primary_key` names a column neither declared nor injected." }
StoreReservedColumnName      = { clause = "store.reserve.column-name", gloss = "A producer column is spelled inside the reserved namespace and outside the optional set." }
