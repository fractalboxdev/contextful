store-endpoint-answer-first = { clause = "store.endpoint.transport", value = 2, unit = "s", basis = "standard:aws-s3-performance", gloss = "Answer window of the first attempt of an S3 request that may resend." }
store-endpoint-answer-second = { clause = "store.endpoint.transport", value = 4, unit = "s", basis = "standard:aws-s3-performance", gloss = "Answer window of the second attempt of an S3 request that may resend." }
store-endpoint-role-refresh = { clause = "store.endpoint.role-refresh", value = 300, unit = "s", basis = "chosen", gloss = "Lead time before expiry at which workload-role credentials refresh." }
store-endpoint-throttled    = { clause = "store.endpoint.throttled", value = 5, unit = "attempts", basis = "chosen", gloss = "Total attempts of an S3 request the backend answers throttled." }
store-endpoint-backoff-base = { clause = "store.endpoint.throttled", value = 100, unit = "ms", basis = "chosen", gloss = "Ceiling of the backoff before the first throttled resend, doubling per resend." }
