SyncGenerationAbsent         = { clause = "store.pull.generation-absent", gloss = "A pull names a generation the bucket holds no generation manifest for." }
SyncGenerationDiverged       = { clause = "store.pull.generation-diverged", gloss = "A generation pull meets a local file the generation does not list." }
