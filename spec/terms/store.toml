StoreUnknownTable            = { clause = "store.lay-out.unknown-table", gloss = "A table name resolves to no `schema.json` in the tree." }
StoreNodeIdInvalid           = { clause = "store.lay-out.node-id-shape", gloss = "A resolved node id is too long or outside the path-safe pattern." }
StoreCommitLockTimeout       = { clause = "store.reserve.commit-wait", gloss = "A commit outwaited its table's commit lock or a lower value's publication." }
StoreProjectNameInvalid      = { clause = "store.init.name-conflict", gloss = "A project name is not path-safe `/`-separated segments." }
