StoreIndexColumnAbsent       = { clause = "store.index.column-absent", gloss = "An index is declared over a column the reconciled schema lacks." }
StoreIndexColumnType         = { clause = "store.index.column-type", gloss = "An indexed column or `id_column` carries a type the sidecar does not read." }
