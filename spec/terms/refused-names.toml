# Names this corpus does not carry, recorded as digests rather than as spellings.
#
# A denylist written in plaintext puts the very words it refuses into the tree,
# where they are then greppable, copyable and indexed — the check would become the
# leak. Each entry is `sha256(lowercase token)`, so the checker recognizes a word
# it cannot itself state.
#
# `contextful-spec lint --check render` lowercases each word of authored text, digests it, and fails
# on a match, reporting the file and line without printing the token.
#
# `proper = true` marks a name whose ordinary-English spelling is fine and whose
# capitalized use as a proper noun is not; the checker digests the word only when
# it appears capitalized mid-sentence.

[refused]
