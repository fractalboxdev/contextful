# Scan scope — every check reads its globs and its exemptions here, so no lint
# carries a hard-coded path. `spec lint --scope` fails a check with no entry.

[role]
# Each path glob carries one role. The length bound applies to `contract` alone;
# duplication checks read `contract` files only.
contract  = ["spec/*.md"]
registry  = ["spec/terms/*.toml", "spec/pins.toml"]
generated = ["spec/status.md", "spec/spec.lock.json", "spec/build/**"]
record    = ["spec/decisions/*.md"]
plan      = ["spec/roadmap.md"]

[authored]
# What every duplication, vocabulary and tense check reads.
include = ["spec/*.md", "spec/decisions/*.md"]
exclude = ["spec/build/**", "spec/status.md", "spec/spec.lock.json", "spec/roadmap.md", "spec/terms/**"]
strip   = ["front-matter", "transcluded-spans", "fenced-code"]

[check.ids]
reads = ["contract"]

[check.owns]
reads = ["contract"]

[check.anatomy]
reads = ["contract"]

[check.titles]
reads = ["contract"]

[check.size]
reads = ["contract"]
limit = 900

[check.terms]
reads = ["authored"]

[check.aliases]
reads = ["authored"]

[check.foreign]
reads = ["contract"]

[check.literals]
reads = ["contract"]

[check.limits]
reads = ["contract"]

[check.errors]
reads = ["contract"]

[check.shingles]
reads = ["contract"]
gram = 8

[check.prose]
reads = ["contract"]
# A modal is legal inside a clause cell, on an unsettled line, and in a record.
exempt-spans = ["clause-cell", "unsettled-line"]
exempt-roles = ["record"]

[check.scope-words]
reads = ["contract"]

[check.links]
reads = ["contract", "record"]

[check.rationale]
reads = ["contract"]
exempt-roles = ["record"]

[check.citations]
reads = ["contract"]

[check.adr-orphans]
reads = ["contract", "record"]

[check.adr-shape]
reads = ["record"]

[check.tense]
reads = ["contract", "record"]
# The roadmap names milestones and the generated file reports verdicts; both are
# exempt by role rather than by an ad-hoc path test.
exempt-roles = ["plan", "generated"]

[check.unsettled]
reads = ["contract"]

[check.roadmap]
reads = ["plan"]

[check.banned]
reads = ["contract", "record", "plan"]

[check.paths]
reads = ["contract", "record", "plan", "registry"]

[check.diagrams]
reads = ["contract", "record"]

[check.pins]
reads = ["registry"]

[check.render]
reads = ["generated"]
