# Contracts — the first segment of every clause id.
#
# A contract entry carries an ordered file list, so one contract spans several
# files and a split re-keys nothing. `spec lint --titles` holds each file's
# `# ` heading to the title recorded here.

[contract.corpus]
title = "Corpus law"
files = ["spec/00-corpus.md"]
titles = ["Corpus law"]
gloss = "The grammar the corpus obeys: addressing, anatomy, registration, reference, rationale, computed state."

[contract.topology]
title = "System topology and boundaries"
files = ["spec/01-topology.md"]
titles = ["System topology and boundaries"]
gloss = "The parties, the contract inventory, the read path and run path as halves of one workspace, the crossings between them, and the build profiles."

[contract.store]
title = "The context store"
files = ["spec/10-store.md"]
titles = ["The context store"]
gloss = "Parquet parts, the JSON manifest, the rebuildable catalog, snapshot commit, table declaration, reserved columns, and the two time bases."

[contract.sync]
title = "Sync, leases and replicas"
files = ["spec/11-sync.md"]
titles = ["Sync, leases and replicas"]
gloss = "The bucket wire format, push and pull ordering, prefix confinement, conditional-write commit, and the read replica."

