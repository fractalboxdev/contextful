# Contracts — the first segment of every clause id.
#
# A contract entry carries an ordered file list, so one contract spans several
# files and a split re-keys nothing. Each file's `# ` heading equals its title here.

[contract.corpus]
title = "Corpus law"
files = ["spec/00-corpus.md"]
titles = ["Corpus law"]
gloss = "The grammar the corpus obeys: addressing, anatomy, registration, reference, rationale, computed state."

[contract.topology]
title = "System topology"
files = ["spec/01-topology.md"]
titles = ["System topology"]
gloss = "The parties, the read path and run path as halves of one workspace, the crossings between them, the build profiles, coordination and the published hostname."

[contract.store]
title = "The store and its sync"
files = ["spec/10-store.md"]
titles = ["The store and its sync"]
gloss = "Parquet parts, manifests and the catalog; snapshot commit, declaration, reserved columns, time bases, compaction; the bucket wire format, leases and replicas."

[contract.read]
title = "Reading and memory"
files = ["spec/20-read.md", "spec/21-memory.md"]
titles = ["The read face", "Synthesized memory"]
gloss = "View registration, the statement guard, retrieval and ranking, the tool surface and result shape; synthesized memory, revision, provenance and coverage."

[contract.run]
title = "Runs, pipelines and derive"
files = ["spec/30-run.md", "spec/31-pipeline.md", "spec/32-derive.md"]
titles = ["Durable runs", "Pipelines and the write path", "The derive tier"]
gloss = "The journal, cursors, retry and cancellation; the pipeline declaration and landing sequence; deferred per-row work over landed rows."

[contract.connector]
title = "Connectors and credentials"
files = ["spec/40-connector.md", "spec/41-secrets.md"]
titles = ["Connectors and the built-in sources", "Outbound credentials"]
gloss = "The component world, host-mediated capabilities, packaging and pinning, the built-in sources; credential references, hydration, redaction and rotation."

[contract.authority]
title = "Authority and enforcement"
files = ["spec/50-authority.md", "spec/51-enforcement.md"]
titles = ["Admission and authority", "Enforcement and inference placement"]
gloss = "The subject, the delegation profile, admission, custody and revocation; the enforcement layers, row and column restriction, masking and inference zones."

[contract.disclosure]
title = "Visibility, disclosure and accountability"
files = ["spec/60-visibility.md", "spec/61-disclosure.md", "spec/62-accountability.md"]
titles = ["Source-faithful visibility", "Aggregate disclosure", "Audit, erasure and the receipt"]
gloss = "Mirrored source permissions and their freshness; aggregate release under a disclosure budget; the audit chain, erasure and the receipt."

[contract.surface]
title = "Operator and visitor surfaces"
files = ["spec/70-control-plane.md", "spec/71-console.md"]
titles = ["Cadence, dispatch and the operator plane", "The analyst console"]
gloss = "The schedule grammar, reconciler and bounded dispatch, the control document; the analyst console, grounded answers and published answers."

[contract.assurance]
title = "Assurance"
files = ["spec/80-formal.md", "spec/81-engineering.md"]
titles = ["The formal model", "Engineering gates and the quality harness"]
gloss = "The proof package, theorems and proof gate, the differential harness; one home per capability, test placement, build gates and retrieval evaluation."
