AudienceMismatch = { gloss = "A credential's audience differs from the checkpoint's declared audience, or is absent where one is declared.", owner = "authority" }
TimestampMalformed = { gloss = "A credential timestamp does not decode under the single timestamp grammar.", owner = "authority" }
