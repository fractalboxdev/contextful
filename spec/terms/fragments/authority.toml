AttenuationExpiryExtended = { gloss = "A derivation carries an expiry past its parent's.", owner = "authority" }
AttenuationTenantDropped = { gloss = "A derivation removes its parent's tenant scope or names a different tenant.", owner = "authority" }
IssuanceLifetimeAboveCeiling = { gloss = "An explicitly requested lifetime exceeds the project's persisted issuance ceiling.", owner = "authority" }
IssuancePrincipalRequired = { gloss = "A grant of write or execute names no on-behalf-of principal.", owner = "authority" }
IssuanceUnauthorized = { gloss = "A mint request presents no grant carrying the admin action.", owner = "authority" }
IssuanceZoneWildcard = { gloss = "A subject declares a wildcard inference zone at issuance.", owner = "authority" }
IssuerKeyMissing = { gloss = "A face is configured with no issuer key and declines to start.", owner = "authority" }
IssuerKeyUnresolvable = { gloss = "A configured issuer key reference does not resolve to material.", owner = "authority" }
ReplicaCannotIssue = { gloss = "A mint was attempted on a replica, which holds no signing material.", owner = "authority" }
SignatureInvalid = { gloss = "A credential segment's signature does not check against a pinned key.", owner = "authority" }
