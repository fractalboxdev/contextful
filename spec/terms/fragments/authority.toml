AuthorityRevoked = { gloss = "A credential's identifier is on the denylist, or its epoch sits below the current scoped epoch.", owner = "authority" }
ProfileElementUnrecognized = { gloss = "A credential carries a block version, predicate, rule or restriction the profile does not name.", owner = "authority" }
ProfileReservedFact = { gloss = "A token block introduces a fact into the engine's reserved space.", owner = "authority" }
ProfileEvaluationBudget = { gloss = "Evaluator input exceeds the declared fact or iteration ceiling.", owner = "authority" }
