# Registry fragment — contract `authority`, file `spec/40-authority.md`.

[operation]
identify = { gloss = "The subject tuple, its per-member attestation, hygiene at the mint, and the identity links that connect a subject to a source's own principals.", file = "spec/40-authority.md", aliases = ["subject model", "principal model"] }
profile = { gloss = "The versioned delegation profile: the elements admitted, the reserved facts, the bounded evaluator, and the scoped session authorization yields.", file = "spec/40-authority.md", aliases = ["delegation profile", "token profile"] }
grant = { gloss = "What a credential says a holder does: the action vocabulary, table patterns, tenant scope, the template allowlist, ceilings, and the resources that answer by name.", file = "spec/40-authority.md", aliases = ["capability", "grant array"] }
attenuate = { gloss = "Deriving a narrower child credential offline, and the narrowing legality each grant dimension carries.", file = "spec/40-authority.md", aliases = ["attenuation", "delegate", "derive"] }
issue = { gloss = "Minting a credential: the persisted lifetime ceiling, the principal a row-landing grant needs, custody of the signing seed, and the authoring posture a face declares.", file = "spec/40-authority.md", aliases = ["mint", "issuance"] }
verify = { gloss = "Admission at a checkpoint: signature coverage, audience, timestamps, possession proof, key sets, and the admitted-authority value it produces.", file = "spec/40-authority.md", aliases = ["admit", "admission", "verification"] }
revoke = { gloss = "Ending a credential's usefulness ahead of its expiry: short lifetimes, the denylist, the scoped epoch, key rotation, and format withdrawal.", file = "spec/40-authority.md", aliases = ["revocation", "withdraw"] }
exchange = { gloss = "Trading a verified external assertion for a scoped credential, under injected verifying material and a declared exchange policy.", file = "spec/40-authority.md", aliases = ["token exchange", "federate"] }

[term]

# --- identify ---
subject-tuple = { gloss = "The structured principal: agent, host, on-behalf-of principal, task scope, declared inference zone, incognito flag.", owner = "authority", resolves = "code" }
tuple-subset = { gloss = "The members of the subject tuple a given credential binds; the grant attaches to that subset alone.", owner = "authority", resolves = "concept" }
attestation-label = { gloss = "The per-member attribute reading verified or self-asserted, carried wherever the tuple is rendered.", owner = "authority", resolves = "code" }
on-behalf-of = { gloss = "`on_behalf_of` — the verified subject member naming the human or service a credential acts for.", owner = "authority", resolves = "code" }
subject-value = { gloss = "One value inside the subject tuple, checked for hygiene at the mint.", owner = "authority", resolves = "concept" }
padded-value = { gloss = "A subject value carrying leading or trailing whitespace: trimmed on the command line, refused on the exchange.", owner = "authority", resolves = "concept" }
subject-scheme = { gloss = "A scheme prefix on a subject value, a convention of the deployment's claim template and not a mint rule.", owner = "authority", resolves = "concept" }
normalization = { gloss = "The single trim-and-drop pass applied to a verified tuple before any consumer reads it.", owner = "authority", resolves = "code" }
subjectless-credential = { gloss = "A credential carrying no subject member at all.", owner = "authority", resolves = "concept" }
identity-link = { gloss = "A row mapping a source principal onto a subject over identity-provider-verified fields, carrying `method` and `confidence`.", owner = "authority", resolves = "code" }
link-method = { gloss = "How an identity link was established: `scim_email`, `oidc_sub` or `operator_asserted`.", owner = "authority", resolves = "code" }
directory-link = { gloss = "A source-account-to-subject link written by directory provisioning out of the identity provider.", owner = "authority", resolves = "concept" }
unlinked-principal = { gloss = "A subject whose source principal resolves to no link, and therefore reads nothing from that source.", owner = "authority", resolves = "concept" }
agent-ceiling = { gloss = "The rule bounding an agent's reach by the reach of the human it acts for.", owner = "authority", resolves = "concept" }
incognito-member = { gloss = "The subject member a caller sets to pin a session away from remote processing.", owner = "authority", resolves = "code" }
subject-rebinding = { gloss = "A derivation naming a different on-behalf-of principal than its parent.", owner = "authority", resolves = "concept" }

# --- profile ---
delegation-profile = { gloss = "The versioned document naming the exact facts, checks and restriction tuples this engine admits in a credential.", owner = "authority", resolves = "code" }
unrecognized-element = { gloss = "A block version, predicate, rule or restriction the profile does not name.", owner = "authority", resolves = "concept" }
reserved-fact = { gloss = "Current time, deployment audience, resolved resources and authenticated request identity, supplied by the engine and unavailable to a token block.", owner = "authority", resolves = "code" }
evaluator-bound = { gloss = "The feature and resource ceilings under which the profile's evaluator runs.", owner = "authority", resolves = "code" }
appended-block = { gloss = "A block added after the first, contributing no authority fact to an allow decision.", owner = "authority", resolves = "concept" }
unevaluated-restriction = { gloss = "A row restriction or aggregate bound for which no read evaluator exists.", owner = "authority", resolves = "concept" }
wire-field = { gloss = "A declared field of the credential's claim shape, retained even while refused.", owner = "authority", resolves = "code" }
profile-module = { gloss = "The one pinned module a gateway and the engine both execute, compiled natively and to WebAssembly.", owner = "authority", resolves = "code" }
declared-scope = { gloss = "The scope introspection reports off a credential, legible without evaluation.", owner = "authority", resolves = "code" }
scoped-session = { gloss = "What authorization yields: a session carrying every restriction the credential expressed.", owner = "authority", resolves = "code" }
profile-version = { gloss = "The version tag a checkpoint reads to decide whether it implements a credential's profile.", owner = "authority", resolves = "code" }
admission-decides-entry = { gloss = "The boundary between admission and enforcement: admission settles entry, the data plane settles exposure.", owner = "authority", resolves = "concept" }

# --- grant ---
grant = { gloss = "One typed entry of a credential's authority: actions, table patterns, tenant scope, constraints, template allowlist.", owner = "authority", resolves = "code" }
action = { gloss = "One of `read`, `write`, `execute`, `admin`.", owner = "authority", resolves = "code" }
unknown-action = { gloss = "An action token outside the four-verb vocabulary.", owner = "authority", resolves = "concept" }
table-pattern = { gloss = "A granted table selector in one of three forms: bare star, prefix star, or exact name.", owner = "authority", resolves = "code" }
malformed-pattern = { gloss = "A table pattern carrying a star anywhere but its final position.", owner = "authority", resolves = "concept" }
star-pattern = { gloss = "The bare-star table pattern covering every table in the project.", owner = "authority", resolves = "code" }
tenant-scope = { gloss = "An opaque byte string scoping a grant below the table, bound to that table's outermost partition column.", owner = "authority", resolves = "code" }
tenant-identity = { gloss = "The byte-for-byte equality of the grant value, the partition key on disk and the consumer's own tenant identifier.", owner = "authority", resolves = "concept" }
unbindable-tenant = { gloss = "A tenant-scoped grant against a table declaring no bare outermost partition column.", owner = "authority", resolves = "concept" }
tenant-child-lifetime = { gloss = "The lifetime a per-query tenant-scoped child credential carries.", owner = "authority", resolves = "concept" }
tenant-child = { gloss = "A tenant-scoped child derived per query from a broader parent held by the consumer's service.", owner = "authority", resolves = "concept" }
template-allowlist = { gloss = "The deny-by-default list of query-template identifiers a grant authorizes.", owner = "authority", resolves = "code" }
ungranted-template = { gloss = "A query template the caller's allowlist does not name or cover.", owner = "authority", resolves = "concept" }
pipeline-resource = { gloss = "A pipeline identifier treated as a read resource in its own right, separate from the tables it lands.", owner = "authority", resolves = "code" }
ungranted-pipeline = { gloss = "A pipeline identifier no grant of the presented credential covers.", owner = "authority", resolves = "concept" }
run-trace = { gloss = "The operational read that resolves a run record to its pipeline and returns the run's steps.", owner = "authority", resolves = "code" }
row-ceiling = { gloss = "The smallest of the grant's, request's, template's and face's row ceilings, applied to a read.", owner = "authority", resolves = "code" }
aggregate-constraint = { gloss = "The grant fields bounding a derived-result read: minimum group size, contributor share, permitted functions, group ceiling, row ceiling.", owner = "authority", resolves = "code" }

# --- attenuate ---
offline-derivation = { gloss = "Deriving a narrower child by local signature, with no round trip to the issuer.", owner = "authority", resolves = "concept" }
narrowing = { gloss = "The per-dimension comparison holding a child no broader than its parent.", owner = "authority", resolves = "code" }
widening = { gloss = "A proposed child broader than its parent on some grant dimension.", owner = "authority", resolves = "concept" }
child-validity = { gloss = "The derived credential's validity window, contained inside its parent's.", owner = "authority", resolves = "concept" }
expiry-extension = { gloss = "A derivation carrying an expiry past its parent's.", owner = "authority", resolves = "concept" }
tenant-drop = { gloss = "A derivation removing its parent's tenant scope or naming a different tenant.", owner = "authority", resolves = "concept" }
chain-proof = { gloss = "The chain-final proof advancing an ephemeral key per appended block, which defeats truncation to a broader prefix.", owner = "authority", resolves = "concept" }
bearer-delegation = { gloss = "The property that derivation proves the chain and not the identity of the new holder.", owner = "authority", resolves = "concept" }
parent-intact = { gloss = "The parent credential's bytes, unchanged by any derivation from it.", owner = "authority", resolves = "concept" }
derivation-order = { gloss = "The composition of successive derivations, re-checked as a whole chain at admission.", owner = "authority", resolves = "concept" }
local-check = { gloss = "The narrowing comparison a deriving holder runs before minting a child.", owner = "authority", resolves = "code" }
sub-agent = { gloss = "A delegate holding its own child credential bound to its own key pair.", owner = "authority", resolves = "concept" }

# --- issue ---
issuance-ceiling = { gloss = "The persisted longest lifetime any mint path in a project produces.", owner = "authority", resolves = "code" }
lifetime-above-ceiling = { gloss = "An explicitly requested credential lifetime above the persisted ceiling.", owner = "authority", resolves = "concept" }
ceiling-lowering = { gloss = "The recorded previous ceiling and lowering instant a grace guard validates against.", owner = "authority", resolves = "code" }
principal-required = { gloss = "The condition that a write or execute grant names an on-behalf-of principal.", owner = "authority", resolves = "concept" }
default-action-set = { gloss = "The action set a mint produces when the caller asks for none.", owner = "authority", resolves = "code" }
absent-author = { gloss = "A null row-authorship value, meaning no capability credential authorized that write.", owner = "authority", resolves = "concept" }
authoring-posture = { gloss = "The project-open argument selecting `session` or `per_request` authorship for writes through that project.", owner = "authority", resolves = "code" }
one-credential = { gloss = "The rule that a served face admits a verified capability credential and nothing else.", owner = "authority", resolves = "concept" }
missing-issuer-key = { gloss = "A face configured with no issuer key.", owner = "authority", resolves = "concept" }
unresolvable-key-reference = { gloss = "A configured issuer key reference that does not resolve to material.", owner = "authority", resolves = "concept" }
signing-port = { gloss = "The provider-agnostic interface every mint signs through.", owner = "authority", resolves = "code" }
custody-posture = { gloss = "One of `file`, `reference`, `oracle` — where the signing seed sits relative to the engine.", owner = "authority", resolves = "code" }
seed-custody = { gloss = "The custodian's boundary the signing seed does not cross at the oracle posture.", owner = "authority", resolves = "concept" }
algorithm-claim = { gloss = "The signed claim naming Ed25519 or ECDSA P-256, cross-checked against the pinned key's own scheme.", owner = "authority", resolves = "code" }
algorithm-mismatch = { gloss = "An algorithm claim naming a scheme other than the pinned key's.", owner = "authority", resolves = "concept" }
unauthorized-mint = { gloss = "A mint request presenting no grant carrying the admin action.", owner = "authority", resolves = "concept" }
replica-mint = { gloss = "A mint attempted on a replica, which holds public key material alone.", owner = "authority", resolves = "concept" }
zone-wildcard = { gloss = "A subject declaring a wildcard inference zone at issuance.", owner = "authority", resolves = "concept" }
mint-scope = { gloss = "The boundary within which persisted-ceiling enforcement binds a mint run.", owner = "authority", resolves = "concept" }
key-rotation-cadence = { gloss = "The interval at which the credential-signing key rotates.", owner = "authority", resolves = "code" }

# --- verify ---
admitted-authority = { gloss = "The value a verification produces: the normalized subject tuple plus the grants it narrows to, taken as an argument by every read surface and every row-landing effect.", owner = "authority", resolves = "code" }
no-fabricating-constructor = { gloss = "The absence of any constructor producing an admitted authority without a verification.", owner = "authority", resolves = "code" }
re-read = { gloss = "Re-evaluation of expiry, revocation epoch and policy version against the carried authority at each effect.", owner = "authority", resolves = "code" }
format-trait = { gloss = "The four-operation interface — issue, attenuate, verify, introspect — through which the wire format is reached.", owner = "authority", resolves = "code" }
envelope = { gloss = "The version-tagged, dot-delimited detached-signature wire shape of a credential.", owner = "authority", resolves = "code" }
signature-coverage = { gloss = "The property that each signature covers the segments as transmitted rather than a re-serialized structure.", owner = "authority", resolves = "concept" }
bad-signature = { gloss = "A segment whose signature does not check against a pinned key.", owner = "authority", resolves = "concept" }
audience-mismatch = { gloss = "A credential whose audience differs from a checkpoint's declared one, or which carries none.", owner = "authority", resolves = "concept" }
timestamp-grammar = { gloss = "The one grammar under which every checkpoint decodes a credential's timestamps to instants.", owner = "authority", resolves = "code" }
malformed-timestamp = { gloss = "A credential timestamp that does not decode under the grammar.", owner = "authority", resolves = "concept" }
expired = { gloss = "A credential whose expiry precedes the evaluation instant.", owner = "authority", resolves = "concept" }
possession-proof = { gloss = "The per-request signature over method, target, body digest and nonce, checked against the credential's confirmation thumbprint.", owner = "authority", resolves = "code" }
replayed-nonce = { gloss = "A binding nonce repeating inside the checkpoint's replay window.", owner = "authority", resolves = "concept" }
public-key-only = { gloss = "The rule that a verifying checkpoint holds public key material and no signing secret.", owner = "authority", resolves = "concept" }
key-set = { gloss = "The set of issuer keys a verifier accepts, from static pins or a project-published key route.", owner = "authority", resolves = "code" }
key-set-refresh = { gloss = "The interval on which a published key set is re-fetched, single-flight and with one retry on signature failure.", owner = "authority", resolves = "code" }
key-set-unavailable = { gloss = "Opting into a published key set and failing to obtain one.", owner = "authority", resolves = "concept" }
key-set-staleness = { gloss = "The total age past which a last-known-good key set stops being served.", owner = "authority", resolves = "code" }

# --- revoke ---
short-lifetime = { gloss = "The primary withdrawal instrument: a credential that lapses before a withdrawal list would propagate.", owner = "authority", resolves = "concept" }
denylist = { gloss = "The checkpoint-read list of withdrawn credential identifiers.", owner = "authority", resolves = "code" }
revocation-id = { gloss = "The identifier each derivation carries, letting one subtree of delegated authority be withdrawn alone.", owner = "authority", resolves = "code" }
revocation-epoch = { gloss = "A counter scoped on project, tenant and principal class whose bump invalidates that slice of outstanding authority.", owner = "authority", resolves = "code" }
revoked-credential = { gloss = "A credential on the denylist, or one whose epoch sits below the current scoped epoch.", owner = "authority", resolves = "concept" }
denylist-scope = { gloss = "The interval a denylist entry covers, between a withdrawal and the lapse of what it names.", owner = "authority", resolves = "concept" }
leak-response = { gloss = "The paired response to suspected signing-material compromise: project-wide epoch bump plus immediate key retirement.", owner = "authority", resolves = "concept" }
two-clocks = { gloss = "The separation between a provider-side sign-out and a minted credential's own lifetime.", owner = "authority", resolves = "concept" }
rotation-grace = { gloss = "The declared window during which a retiring key version stays verifiable.", owner = "authority", resolves = "code" }
short-grace = { gloss = "A declared or overridden grace window shorter than the effective issuance ceiling.", owner = "authority", resolves = "concept" }
rotation-is-not-revocation = { gloss = "The rule that a retiring key verifies for its whole grace window, and compromise runs on the epoch instead.", owner = "authority", resolves = "concept" }
immediate-retire = { gloss = "Removal of a key version from the published set and every static pin, ahead of its grace window.", owner = "authority", resolves = "code" }
format-withdrawal = { gloss = "Ending acceptance of a credential format under a declared compatibility policy.", owner = "authority", resolves = "concept" }
withdrawn-format = { gloss = "A credential in a format no admission path accepts any longer.", owner = "authority", resolves = "concept" }

# --- exchange ---
exchange-surface = { gloss = "`contextful token exchange` and `POST /auth/exchange`, provisioned under `.contextful/exchange/`.", owner = "authority", resolves = "code" }
exchange-policy = { gloss = "`policy.toml` — expected issuer and audience, subject map, role claim and role grants, default grants, lifetime, minted issuer and audience.", owner = "authority", resolves = "code" }
injected-material = { gloss = "`verify.key` — the operator-supplied shared secret, PEM public key or key-set document the exchange verifies an assertion against.", owner = "authority", resolves = "code" }
read-path-independence = { gloss = "The property that the identity provider is contacted at the mint alone and never on a read.", owner = "authority", resolves = "concept" }
minted-grants = { gloss = "Grants drawn from the exchange policy's role map and default grants, and from nowhere else.", owner = "authority", resolves = "code" }
minted-lifetime-default = { gloss = "The lifetime a minted credential carries when the policy declares none.", owner = "authority", resolves = "code" }
minted-lifetime-ceiling = { gloss = "The ceiling a configured minted lifetime clamps down to.", owner = "authority", resolves = "code" }
minted-audience = { gloss = "The deployment audience stamped on a minted credential, falling back to the project's persisted default.", owner = "authority", resolves = "code" }
assertion-invalid = { gloss = "An external assertion with a bad signature, a lapsed expiry, an untrusted issuer or audience, or a missing mapped claim.", owner = "authority", resolves = "concept" }
missing-material = { gloss = "An exchange configured with no verifying material.", owner = "authority", resolves = "concept" }
per-reader-token = { gloss = "The short-lived, least-privilege credential an embedding application mints per signed-in reader per request.", owner = "authority", resolves = "concept" }
no-cross-reader-cache = { gloss = "The rule that an exchanged credential is never reused for a second reader.", owner = "authority", resolves = "concept" }
mint-custody = { gloss = "The embedding application's backend key custody, the one place the root capability lives.", owner = "authority", resolves = "concept" }
bound-tenancy = { gloss = "The organization identifier stamped into the minted subject's account member and read through a bound parameter.", owner = "authority", resolves = "code" }
no-directory = { gloss = "The absence of any user directory or directory-synchronization feed inside the engine.", owner = "authority", resolves = "concept" }
identity-versus-capability = { gloss = "The division between an assertion answering who a principal is and a credential answering what that principal does.", owner = "authority", resolves = "concept" }
minted-derivation = { gloss = "Offline narrowing of a minted credential into sub-agent children, each bound to its holder's key pair.", owner = "authority", resolves = "concept" }

