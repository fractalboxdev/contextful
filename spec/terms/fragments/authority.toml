[limit]
subject-value-bytes = { value = 256, unit = "B", owner = "authority.identify.limit.subject-value", gloss = "Longest subject value the mint accepts." }
tenant-child-lifetime = { value = 15, unit = "min", owner = "authority.grant.limit.tenant-child-lifetime", gloss = "Lifetime of a per-query tenant-scoped child credential." }
issuance-lifetime-ceiling = { value = 24, unit = "h", owner = "authority.issue.limit.issuance-ceiling", gloss = "Longest credential lifetime a project's persisted issuance policy permits." }
issuer-key-rotation-cadence = { value = 90, unit = "d", owner = "authority.issue.limit.key-rotation-cadence", gloss = "Interval at which the credential-signing key rotates." }
key-set-refresh-interval = { value = 300, unit = "s", owner = "authority.verify.limit.key-set-refresh", gloss = "Lifetime of a fetched published key set before refresh." }
key-set-stale-ceiling = { value = 1, unit = "h", owner = "authority.verify.limit.key-set-staleness", gloss = "Total age past which a last-known-good key set stops being served." }
exchange-mint-lifetime-default = { value = 900, unit = "s", owner = "authority.exchange.limit.minted-lifetime-default", gloss = "Lifetime a minted credential carries when the exchange policy declares none." }
