# Registry fragment — `topology`, the contract in `spec/01-topology.md`.
# Operations, subject terms, error identifiers and named bounds this file owns.

[operation]
compose          = { gloss = "The two halves of the engine, the three contracts crossing between them, the mediation obligation, and the five pillars.", file = "spec/01-topology.md", aliases = ["composition"] }
package          = { gloss = "The crate map, the domain crate and its ports, and the three build profiles with their bundles, targets, artifacts and budgets.", file = "spec/01-topology.md", aliases = ["packaging"] }
deploy           = { gloss = "Deployment roles, self-hosted shapes, the reference target, and the parity holding one declaration's output identical across targets.", file = "spec/01-topology.md", aliases = ["deployment"] }
publish-hostname = { gloss = "A descriptor per published hostname, its declared gate, and the anonymous probe the deploy judges it by.", file = "spec/01-topology.md", aliases = ["hostname-posture"] }
coordinate       = { gloss = "The one coordination property, the two single-writer operations needing it, and the catalog backends supplying it.", file = "spec/01-topology.md", aliases = ["coordination"] }
bound-application = { gloss = "Where the engine's contracts end, where an application's vocabulary begins, and what the commercial layer reaches.", file = "spec/01-topology.md", aliases = ["application-boundary"] }

[term]
# — compose
workspace          = { gloss = "The one Cargo workspace both halves compile from.", owner = "topology", resolves = "code" }
read-path          = { gloss = "The half holding data at rest and its retrieval.", owner = "topology", resolves = "concept" }
run-path           = { gloss = "The half holding execution: journal, scheduler, cursor commit, awakeables, connector steps.", owner = "topology", resolves = "concept" }
crossing           = { gloss = "One of the three versioned contracts carrying state between the read path and the run path.", owner = "topology", resolves = "concept" }
cli-binary         = { gloss = "The single command binary `contextful`.", owner = "topology", resolves = "code" }
enforcement-stack  = { gloss = "The layers every access to data traverses, spanning both halves.", owner = "topology", resolves = "concept" }
enforcement-span   = { gloss = "The property that the enforcement stack sits in both halves rather than one.", owner = "topology", resolves = "concept" }
semantic-layer     = { gloss = "The content-interpreting layer, which reaches enforcement through a crossing.", owner = "topology", resolves = "concept" }
mediation          = { gloss = "Complete mediation: no reachable path returns a row without traversing the enforcement stack.", owner = "topology", resolves = "concept" }
pillar             = { gloss = "One of the five properties the composition holds across both halves.", owner = "topology", resolves = "concept" }
pillar-one-tree    = { gloss = "Laptop through cluster from one source tree, with no external coordination process on a single node.", owner = "topology", resolves = "concept" }
pillar-connector   = { gloss = "Agent-authorable sandboxed connectors with a native sibling authoring path.", owner = "topology", resolves = "concept" }
pillar-store       = { gloss = "A store readable by ordinary columnar and SQL tooling.", owner = "topology", resolves = "concept" }
pillar-inference   = { gloss = "One operator-configured model egress and no model-vendor SDK in any crate.", owner = "topology", resolves = "concept" }
pillar-local-first = { gloss = "Offline operation, opt-in sync, no callback, no license check, no telemetry.", owner = "topology", resolves = "concept" }
inference-egress   = { gloss = "The single outbound path from the engine to a language model.", owner = "topology", resolves = "concept" }
script-runtime     = { gloss = "A JavaScript-class interpreter, absent from every profile.", owner = "topology", resolves = "concept" }
contract-inventory = { gloss = "The twenty contracts partitioning the corpus, registered in `spec/terms/contract.toml`.", owner = "topology", resolves = "code" }
memory-substrate   = { gloss = "The property that synthesized memory rides ordinary store tables and an ordinary workflow.", owner = "topology", resolves = "concept" }
introspection      = { gloss = "Each half's own spine of what happened, unmerged.", owner = "topology", resolves = "concept" }

# — package
crate-map            = { gloss = "The thirteen crates of the workspace and their charters.", owner = "topology", resolves = "code" }
domain-crate         = { gloss = "`contextful-core`, the pure domain crate with no I/O.", owner = "topology", resolves = "code" }
domain-type          = { gloss = "A type the domain crate defines and every adapter consumes.", owner = "topology", resolves = "code" }
port-set             = { gloss = "The trait set every adapter implements.", owner = "topology", resolves = "code" }
dependency-direction = { gloss = "Adapters depend on the domain crate and the domain crate on none of them.", owner = "topology", resolves = "concept" }
execution-crate      = { gloss = "A crate holding the run path's execution responsibility.", owner = "topology", resolves = "code" }
data-crate           = { gloss = "A crate holding the read path's storage, memory, sync or evaluation responsibility.", owner = "topology", resolves = "code" }
governance-crate     = { gloss = "A crate holding policy, the tool server or the control plane.", owner = "topology", resolves = "code" }
profile              = { gloss = "A build profile selected by Cargo feature bundle over the one workspace.", owner = "topology", resolves = "code" }
profile-selection    = { gloss = "Fixing a profile at build time rather than by run-time detection.", owner = "topology", resolves = "concept" }
artifact-content     = { gloss = "What a release artifact carries, and what stays outside it.", owner = "topology", resolves = "concept" }
edge-profile         = { gloss = "`contextful-edge`, the read replica profile.", owner = "topology", resolves = "code" }
edge-eligibility     = { gloss = "The edge profile as the one profile a function-class target hosts.", owner = "topology", resolves = "concept" }
full-profile         = { gloss = "`contextful-full`, the daemon profile.", owner = "topology", resolves = "code" }
control-profile      = { gloss = "`contextful-control`, the self-hosted control-plane profile.", owner = "topology", resolves = "code" }
feature-bundle       = { gloss = "The Cargo feature set a profile selects.", owner = "topology", resolves = "code" }
dependency-lattice   = { gloss = "Which heavy dependency links into which profiles.", owner = "topology", resolves = "concept" }
edge-budget          = { gloss = "The edge profile's compressed and idle-resident bound pair.", owner = "topology", resolves = "concept" }
full-budget          = { gloss = "The full profile's compressed and idle-resident bound pair.", owner = "topology", resolves = "concept" }
control-budget       = { gloss = "The control profile's compressed and idle-resident bound pair.", owner = "topology", resolves = "concept" }
budget               = { gloss = "A profile's footprint pair, stated once per profile in this contract.", owner = "topology", resolves = "concept" }
build-target         = { gloss = "A target triple a profile compiles for.", owner = "topology", resolves = "code" }
release-artifact     = { gloss = "The archive, checksum, SBOM, formula, install script and image a profile ships as.", owner = "topology", resolves = "concept" }
runtime-worker       = { gloss = "An async-runtime worker thread a profile runs.", owner = "topology", resolves = "code" }
runtime-flavor       = { gloss = "The async-runtime shape a profile selects.", owner = "topology", resolves = "code" }
component-host       = { gloss = "The linked host a component connector executes inside.", owner = "topology", resolves = "concept" }
crdt-confinement     = { gloss = "The CRDT library linking into the control profile alone.", owner = "topology", resolves = "concept" }

# — deploy
deployment-declaration = { gloss = "`contextful.toml`, the one declaration deploying to every provider.", owner = "topology", resolves = "code" }
target-profile         = { gloss = "A provider's record of which primitives back which role.", owner = "topology", resolves = "concept" }
target-shape           = { gloss = "A deployment shape a provider's primitives express or record as absent.", owner = "topology", resolves = "concept" }
target-adapter         = { gloss = "The per-provider crate sitting behind the domain ports.", owner = "topology", resolves = "code" }
role                   = { gloss = "Control-plane target or worker target.", owner = "topology", resolves = "concept" }
control-plane-target   = { gloss = "The target running the tick, the reconciler, the orchestrator and the single-writer catalog.", owner = "topology", resolves = "concept" }
worker-target          = { gloss = "The target accepting a job, running it to completion and reporting back.", owner = "topology", resolves = "concept" }
reference-target       = { gloss = "The single-process deployment every other target is compared against.", owner = "topology", resolves = "concept" }
self-hosted-shape      = { gloss = "One of the three shapes the binary runs as when a team hosts it.", owner = "topology", resolves = "concept" }
control-plane-daemon   = { gloss = "The control plane's self-hosted daemon form.", owner = "topology", resolves = "concept" }
wall-clock-cap         = { gloss = "A target's per-invocation wall-clock ceiling and what it excludes.", owner = "topology", resolves = "concept" }
parity-gate            = { gloss = "The comparison holding one declaration's output identical across targets.", owner = "topology", resolves = "concept" }
parity-soak            = { gloss = "The accumulation period a parity comparison runs after.", owner = "topology", resolves = "concept" }
telemetry-sink         = { gloss = "Where traces and logs land, and what stdout is reserved for.", owner = "topology", resolves = "code" }

# — publish-hostname
descriptor           = { gloss = "The per-hostname artifact naming its worker, hostname, contract version and gate.", owner = "topology", resolves = "code" }
descriptor-field     = { gloss = "A key a descriptor models, against which an unmodelled key is refused.", owner = "topology", resolves = "code" }
descriptor-emission  = { gloss = "The deploy's derivation of a hostname's provider configuration from its descriptor.", owner = "topology", resolves = "concept" }
gate                 = { gloss = "A descriptor's declared posture: `access`, `adminToken`, or acknowledged `public`.", owner = "topology", resolves = "code" }
posture-probe        = { gloss = "The anonymous request the deploy judges a hostname's gate by.", owner = "topology", resolves = "concept" }
probe-table          = { gloss = "The deploy's hostname-and-gate table, derived from the descriptor set.", owner = "topology", resolves = "code" }
wildcard-application = { gloss = "A domain-wide application carrying a reusable bypass policy, gating no hostname on its own.", owner = "topology", resolves = "concept" }
reserved-key         = { gloss = "The fixed set an unmodelled configuration key is checked against.", owner = "topology", resolves = "code" }

# — coordinate
coordination-primitive  = { gloss = "Linearizable compare-and-swap behind the catalog port.", owner = "topology", resolves = "concept" }
single-writer-operation = { gloss = "One of the two operations needing the coordination primitive.", owner = "topology", resolves = "concept" }
cas-statement           = { gloss = "The one conditional update a compare-and-swap resolves to.", owner = "topology", resolves = "code" }
shard-lease             = { gloss = "The row granting one holder a source partition until its expiry.", owner = "topology", resolves = "code" }
catalog-port            = { gloss = "The `Catalog` trait every backend is reached through.", owner = "topology", resolves = "code" }
catalog-backend         = { gloss = "The store supplying the coordination primitive for a topology.", owner = "topology", resolves = "concept" }
cluster-availability    = { gloss = "Availability in the cluster shape, which is the shared database's.", owner = "topology", resolves = "concept" }
consensus-system        = { gloss = "A bundled replication or coordination service, absent from the tree.", owner = "topology", resolves = "concept" }
air-gap                 = { gloss = "Running with no process reachable beyond a deployment's own sources.", owner = "topology", resolves = "concept" }

# — bound-application
engine-scope        = { gloss = "The reusable contracts the engine owns.", owner = "topology", resolves = "concept" }
application-scope   = { gloss = "The domain material an application owns.", owner = "topology", resolves = "concept" }
lexicon             = { gloss = "The per-store declaration where an application names its own vocabulary.", owner = "topology", resolves = "concept" }
reference-surface   = { gloss = "The reference console and operator surface, which configure no application store.", owner = "topology", resolves = "concept" }
console-scope       = { gloss = "The console as one shared interface over engine capabilities plus application metadata.", owner = "topology", resolves = "concept" }
prediction-shape    = { gloss = "The generic prediction, observation and outcome-label shapes the engine keeps.", owner = "topology", resolves = "concept" }
operator-graph      = { gloss = "The operator view's graph, derived from configured pipelines.", owner = "topology", resolves = "concept" }
shared-abstraction  = { gloss = "A behavior generalized into the engine once a second consumer shares its invariants.", owner = "topology", resolves = "concept" }
public-surface      = { gloss = "A surface every client reaches the engine through.", owner = "topology", resolves = "concept" }
litmus              = { gloss = "The test placing a behavior in the engine or in the commercial layer.", owner = "topology", resolves = "concept" }
paid-feature        = { gloss = "A net-new capability the commercial layer adds beside the data plane.", owner = "topology", resolves = "concept" }
self-service        = { gloss = "A team running every data-plane capability itself against its own bucket.", owner = "topology", resolves = "concept" }
substrate           = { gloss = "What the engine supplies, as distinct from a certification about operating it.", owner = "topology", resolves = "concept" }

[error]
TopologyUndeclaredCrossing   = { gloss = "A call path carries state between the halves outside the three named crossings.", owner = "topology" }
MediationBypass              = { gloss = "A code path reads or releases a row without entering the enforcement stack.", owner = "topology" }
VendorSdkLinked              = { gloss = "A crate declares a model-vendor SDK, or a second outbound path to a model exists.", owner = "topology" }
ScriptRuntimeLinked          = { gloss = "A script-language runtime links into a profile.", owner = "topology" }
DomainCrateImpurity          = { gloss = "The domain crate declares an async runtime, a component host, an HTTP client or a columnar-format implementation.", owner = "topology" }
TopologyDependencyInversion  = { gloss = "A dependency edge runs from the domain crate toward an adapter crate.", owner = "topology" }
ComponentHostMissing         = { gloss = "A component connector is dispatched on a profile linking no component host.", owner = "topology" }
ProfileDependencyLeak        = { gloss = "The CRDT library appears in the resolved dependency graph of the edge or full profile.", owner = "topology" }
TargetShapeUnsupported       = { gloss = "A target profile claims a shape the provider's primitives do not express.", owner = "topology" }
ParityDivergence             = { gloss = "A target's output differs byte-wise from the reference target's.", owner = "topology" }
HostnamePostureMismatch      = { gloss = "An anonymous probe's response disagrees with the hostname's declared gate.", owner = "topology" }
ProbeTableDrift              = { gloss = "The probe table and the descriptor set name different hostname-and-gate pairs.", owner = "topology" }
DescriptorUnknownField       = { gloss = "A descriptor carries a key its contract version does not model.", owner = "topology" }
CatalogCasUnsupported        = { gloss = "A catalog backend's conditional update is not linearizable.", owner = "topology" }
ApplicationVocabularyInEngine = { gloss = "An application's role name, rating schema or category meaning enters engine code.", owner = "topology" }
PrematureAbstraction         = { gloss = "An abstraction is generalized from a single consumer on name or shape agreement alone.", owner = "topology" }
PrivateBackChannel           = { gloss = "A route, header or build is reserved for the commercial layer.", owner = "topology" }
PaywalledDataPlane           = { gloss = "An existing data-plane capability is gated behind a license check.", owner = "topology" }

[limit]
edge-artifact-compressed  = { value = 50,  unit = "MiB",     owner = "topology.package.limit.edge-budget",     gloss = "Compressed release artifact of the edge profile." }
edge-idle-rss             = { value = 60,  unit = "MiB",     owner = "topology.package.limit.edge-budget",     gloss = "Idle resident set of the edge profile." }
full-artifact-compressed  = { value = 150, unit = "MiB",     owner = "topology.package.limit.full-budget",     gloss = "Compressed release artifact of the full profile." }
full-idle-rss             = { value = 180, unit = "MiB",     owner = "topology.package.limit.full-budget",     gloss = "Idle resident set of the full profile." }
control-artifact-compressed = { value = 60, unit = "MiB",    owner = "topology.package.limit.control-budget",  gloss = "Compressed release artifact of the control profile." }
control-idle-rss          = { value = 80,  unit = "MiB",     owner = "topology.package.limit.control-budget",  gloss = "Idle resident set of the control profile." }
full-worker-cap           = { value = 8,   unit = "workers", owner = "topology.package.limit.runtime-worker",  gloss = "Ceiling on the full profile's async-runtime worker count." }
control-worker-count      = { value = 2,   unit = "workers", owner = "topology.package.limit.runtime-worker",  gloss = "The control profile's async-runtime worker count." }
function-wall-clock       = { value = 15,  unit = "min",     owner = "topology.deploy.limit.wall-clock-cap",   gloss = "Per-invocation wall clock above which a target hosts neither a backfill nor a component connector." }
parity-soak-window        = { value = 24,  unit = "h",       owner = "topology.deploy.limit.parity-soak",      gloss = "Accumulation period before the parity comparison runs." }
