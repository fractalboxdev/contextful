# Registry fragment — the `memory` contract.
# Operations, subjects, error identifiers and named bounds owned by spec/21-memory.md.

[operation]
declare       = { gloss = "The five memory table shapes, their canonical columns, the tier and scope vocabularies, and the closed relation set.", file = "spec/21-memory.md", aliases = ["memory-shape-declaration"] }
synthesize    = { gloss = "Extract, Resolve and Consolidate over landed rows; the deduplication key, evidence support, the synthesis audit record, and coverage gaps.", file = "spec/21-memory.md", aliases = ["distil", "distill"] }
revise        = { gloss = "Supersession within one validity line, confidence decay, the direct write and its anchor, expiry, retention and promotion.", file = "spec/21-memory.md", aliases = ["supersede"] }
recall        = { gloss = "Serving live memory at present time: the two clocks, tier-first ordering, the scope filter, and the evidence gate.", file = "spec/21-memory.md", aliases = ["memory-read"] }
forget        = { gloss = "Tombstoning a selected subject, the cascade over rows distilled from it, and the dry-run approval path.", file = "spec/21-memory.md", aliases = ["memory-erase"] }
resolve-entity = { gloss = "Candidate-to-identity matching, script-aware aliases, the knowledge card, place identity and nearness, and edge materialization.", file = "spec/21-memory.md", aliases = ["entity-resolution"] }
settle        = { gloss = "Predictions, observations, the declared resolution form, the citation a verdict owes, and the label views.", file = "spec/21-memory.md", aliases = ["outcome-labeling"] }

[term]
# — shapes and columns
memory-shape        = { gloss = "The five table conventions synthesized memory takes: episodes, facts, entities, edges, preferences.", owner = "memory", resolves = "code" }
shape-declaration   = { gloss = "The `shape` key a table names beside its columns, binding the schema validator to a canonical column set.", owner = "memory", resolves = "code" }
canonical-column    = { gloss = "A column a memory shape requires of any table declaring that shape.", owner = "memory", resolves = "concept" }
fact-columns        = { gloss = "The canonical column set of `memory_facts`.", owner = "memory", resolves = "concept" }
entity-columns      = { gloss = "The canonical column set of `memory_entities`.", owner = "memory", resolves = "concept" }
edge-columns        = { gloss = "The canonical column set of `memory_edges`.", owner = "memory", resolves = "concept" }
episode-columns     = { gloss = "The canonical column set of `memory_episodes`.", owner = "memory", resolves = "concept" }
preference-columns  = { gloss = "The canonical column set of `memory_preferences`.", owner = "memory", resolves = "concept" }
confidence          = { gloss = "The strength column a claim, a preference and an edge carry on the interval 0..1.", owner = "memory", resolves = "code" }
value               = { gloss = "The `memory_preferences` column holding what a subject prefers under one key.", owner = "memory", resolves = "code" }
validity-pair       = { gloss = "A memory shape naming its validity columns through the ordinary table declaration.", owner = "memory", resolves = "concept" }
tier                = { gloss = "The provenance standing column: curated, derived, researched.", owner = "memory", resolves = "code" }
scope               = { gloss = "The optional string partitioning one subject's claims by the surface that produced them.", owner = "memory", resolves = "code" }
support             = { gloss = "The `{contributors, records}` evidence cardinality stamped on a claim.", owner = "memory", resolves = "code" }
support-band        = { gloss = "The banded rendering of `support` as `0`, `1-9`, `10-99` or `100+`.", owner = "memory", resolves = "concept" }
support-is-derived  = { gloss = "Support computed at write time and excluded from the deduplication key.", owner = "memory", resolves = "concept" }
contributor-key     = { gloss = "The registrable domain a fetched result stamps, so contributors count distinct publishers.", owner = "memory", resolves = "code" }
relation-type       = { gloss = "The `rel_type` column and the closed vocabulary it draws from.", owner = "memory", resolves = "code" }
relation-flags      = { gloss = "Optional inverse and symmetric flags on a declared relation type, read as traversal hints.", owner = "memory", resolves = "code" }
place-tables        = { gloss = "The three deployment-supplied CSV tables: the place dimension, its aliases, and the place-to-entity exposure map.", owner = "memory", resolves = "concept" }
extract-template    = { gloss = "The deployment-supplied prompt template and output schema the Extract stage validates candidates against.", owner = "memory", resolves = "code" }

# — synthesis
synthesis-stage     = { gloss = "One of Extract, Resolve, Consolidate.", owner = "memory", resolves = "concept" }
extract             = { gloss = "The one synthesis stage that calls a model, emitting validated candidates.", owner = "memory", resolves = "code" }
resolve             = { gloss = "The deterministic stage mapping candidate mentions onto canonical identities.", owner = "memory", resolves = "code" }
candidate-schema    = { gloss = "The declared output schema every extracted candidate validates against.", owner = "memory", resolves = "code" }
extract-attempts    = { gloss = "The bounded retry of a schema-invalid extract response.", owner = "memory", resolves = "concept" }
dead-letter         = { gloss = "The table a terminal extract failure or an undeclared candidate lands in.", owner = "memory", resolves = "code" }
dedup-key           = { gloss = "`sha256(prompt_hash ‖ source_row_ids ‖ canonical_subject ‖ predicate)`, the identity Consolidate upserts on.", owner = "memory", resolves = "code" }
idempotence         = { gloss = "Repeating a synthesis pass over one row set under one template writing nothing new.", owner = "memory", resolves = "concept" }
prompt-version      = { gloss = "The column telling two extract generations apart under a changed template.", owner = "memory", resolves = "code" }
template-hash       = { gloss = "The hash covering the operator template alone, excluding the data markers around ingested values.", owner = "memory", resolves = "code" }
tier-derivation     = { gloss = "Computing `tier` at write time from the writing grant and the run's source.", owner = "memory", resolves = "concept" }
audit-record        = { gloss = "The per-stage span set: endpoint, model id, template hash, token counts, drop reason, entity action, claim action.", owner = "memory", resolves = "concept" }
lineage             = { gloss = "A memory row's resolution back to its pass, its model and its source rows.", owner = "memory", resolves = "concept" }
commit              = { gloss = "The post-run commit a memory write shares with the write path.", owner = "memory", resolves = "code" }
coverage-gap        = { gloss = "A subject no declared source covers; closed by a source declaration, not by a fetch.", owner = "memory", resolves = "concept" }
gap-record          = { gloss = "The stored row for an open gap: subject, gap kind, observing pass, last-observed instant.", owner = "memory", resolves = "concept" }

# — revision
supersession        = { gloss = "A landing claim retiring the prior live claim on one subject, predicate and scope.", owner = "memory", resolves = "concept" }
retired-row-stays   = { gloss = "A superseded row remaining in the table for audit and point-in-time reads.", owner = "memory", resolves = "concept" }
confidence-decay    = { gloss = "The 0.5 multiplier applied to a retired claim's confidence when the object changed.", owner = "memory", resolves = "concept" }
validity-line       = { gloss = "The equivalence that scopes revision: both claims open-ended, or both anchored to one instant.", owner = "memory", resolves = "concept" }
replay-skips-revision = { gloss = "A candidate arriving under a present deduplication key resolving as an upsert.", owner = "memory", resolves = "concept" }
batch-collision     = { gloss = "Two claims about one subject and predicate landing inside a single batch, both kept.", owner = "memory", resolves = "concept" }
tier-precedence     = { gloss = "A claim retiring a prior of equal or higher standing, and a lower one landing not live.", owner = "memory", resolves = "concept" }
direct-write        = { gloss = "The tool that asserts a claim without a synthesis pass.", owner = "memory", resolves = "code" }
direct-write-shape  = { gloss = "The restriction of the direct write to the claim shape.", owner = "memory", resolves = "concept" }
anchor              = { gloss = "The `observed_at` instant pinning a claim's validity start and end to one point.", owner = "memory", resolves = "code" }
anchor-outside-identity = { gloss = "The anchor taking no part in the deduplication key.", owner = "memory", resolves = "concept" }
assertion-provenance = { gloss = "The direct-assertion stage marker and the author subject tuple stamped beside it.", owner = "memory", resolves = "concept" }
assertion-citation  = { gloss = "A direct assertion's textual citations, governed by the claim table's own read rules.", owner = "memory", resolves = "concept" }
expiry              = { gloss = "The validity end a scheduled pass stamps on an unpromoted researched claim.", owner = "memory", resolves = "code" }
retention           = { gloss = "Survival of an expired researched claim through citation or promotion.", owner = "memory", resolves = "concept" }
promotion           = { gloss = "Raising a claim's tier by patching the record and appending a marker pass.", owner = "memory", resolves = "code" }
edge-revision       = { gloss = "The claim revision rule applied over source, relation type, target and scope.", owner = "memory", resolves = "concept" }

# — recall
present-time        = { gloss = "Recall answering as of now and accepting no time bound of its own.", owner = "memory", resolves = "concept" }
recall-clocks       = { gloss = "The pair recall bounds: the session's vantage over ingestion time, and the validity columns over what a row claims.", owner = "memory", resolves = "concept" }
open-interval       = { gloss = "The open-ended validity a present-time recall returns.", owner = "memory", resolves = "concept" }
fold                = { gloss = "Keeping the latest row per deduplication key before ranking.", owner = "memory", resolves = "concept" }
tier-order          = { gloss = "Ordering by tier first and by score second.", owner = "memory", resolves = "concept" }
score               = { gloss = "Confidence multiplied by the rank-position factor `(index + 1) / total`.", owner = "memory", resolves = "concept" }
scope-filter        = { gloss = "The exact-match scope argument of a recall.", owner = "memory", resolves = "code" }
evidence            = { gloss = "A reference from a claim to a source table's row identifier.", owner = "memory", resolves = "code" }
id                  = { gloss = "The row-identifier column an evidence reference reads where a table declares no single-column primary key.", owner = "memory", resolves = "code" }
evidence-gate       = { gloss = "Serving a synthesized claim when every evidence row reads through the caller's session.", owner = "memory", resolves = "concept" }
evidence-unresolved = { gloss = "Suppression of a claim whose lineage does not resolve.", owner = "memory", resolves = "concept" }
evidence-references = { gloss = "The bound on how many evidence rows one claim names.", owner = "memory", resolves = "concept" }
zone-check          = { gloss = "Recall checking each row's inference zone by the rule a table read applies.", owner = "memory", resolves = "concept" }
only-door           = { gloss = "Memory tables excluded from candidate generation, so a claim reaches an answer through recall.", owner = "memory", resolves = "concept" }
empty-store         = { gloss = "A store with no claim table recalling a clean zero.", owner = "memory", resolves = "concept" }
injection           = { gloss = "Recalled claims entering a grounded turn as an explicit, traced block.", owner = "memory", resolves = "concept" }
knowledge-card-link = { gloss = "The identifiers a recall result carries so a reader reaches the card and the evidence rows.", owner = "memory", resolves = "concept" }

# — forget
forget-call         = { gloss = "`memory.forget(shape, selector, reason, cascade)`.", owner = "memory", resolves = "code" }
tombstone           = { gloss = "The audit-visible marker row a forget writes.", owner = "memory", resolves = "code" }
physical-delete     = { gloss = "Removal of tombstoned rows from the files at the next compaction.", owner = "memory", resolves = "concept" }
cascade             = { gloss = "The one-hop drop of synthesized rows whose evidence includes a forgotten subject.", owner = "memory", resolves = "code" }
dry-run             = { gloss = "A forget that returns the cascade list and writes nothing.", owner = "memory", resolves = "code" }
privilege           = { gloss = "The forget grant, excluded from the default grant set.", owner = "memory", resolves = "concept" }
marker-commit       = { gloss = "A tombstone and its cascade markers reaching the bucket in the commit that retires the rows.", owner = "memory", resolves = "concept" }
serving             = { gloss = "Tombstoned and cascade-marked rows dropped ahead of ranking.", owner = "memory", resolves = "concept" }

# — identity, place, graph
entity-id           = { gloss = "The opaque canonical identifier of a resolved thing.", owner = "memory", resolves = "code" }
entity_id           = { gloss = "The `memory_entities` column carrying that identifier, and the key a row pointing at an entity holds.", owner = "memory", resolves = "code" }
alias-normalization = { gloss = "Folding script variants and full-width forms of one name onto a single identity.", owner = "memory", resolves = "concept" }
alias-match-mode    = { gloss = "Containment for an ideographic alias; ASCII word boundaries for a latin or numeric one.", owner = "memory", resolves = "concept" }
alias-stem          = { gloss = "A trailing `*` holding the left boundary and dropping the right; `\\*` a literal asterisk.", owner = "memory", resolves = "code" }
ambiguous-mention   = { gloss = "A mention matching two identities with no deterministic key to separate them.", owner = "memory", resolves = "concept" }
knowledge-card      = { gloss = "`entity.explain(reference)` and the identity, aliases, attributes and authorized claims it returns.", owner = "memory", resolves = "code" }
card-authorization  = { gloss = "The entity read grant the card requires, and the separate claim grant its claims require.", owner = "memory", resolves = "concept" }
entity-upsert       = { gloss = "The single-row entity writer, reachable from the command line.", owner = "memory", resolves = "code" }
place-id            = { gloss = "The opaque identifier of the place a row concerns.", owner = "memory", resolves = "code" }
parent-closure      = { gloss = "The transitive closure over declared parent edges that defines nearness.", owner = "memory", resolves = "code" }
no-geometry         = { gloss = "The absence of a geometry type, a distance function and a radius.", owner = "memory", resolves = "concept" }
place-left-join     = { gloss = "The left join onto the place alias dimension that lands a null tag rather than dropping a row.", owner = "memory", resolves = "concept" }
place-fold          = { gloss = "Place resolution reading the latest row per key across re-landed snapshots.", owner = "memory", resolves = "concept" }
edge-materialization = { gloss = "An edge written as an explicit typed row at synthesis time.", owner = "memory", resolves = "concept" }
edge-endpoint       = { gloss = "The source and target identities a candidate edge resolves to.", owner = "memory", resolves = "code" }
edge-provenance     = { gloss = "Lineage and validity stamped on an edge in the shape a claim carries.", owner = "memory", resolves = "concept" }
traversal           = { gloss = "The recursive query over `memory_edges`, seeded by resolution and ranked recall.", owner = "memory", resolves = "concept" }
undeclared-relation = { gloss = "A candidate edge typed outside the deployment's closed relation set.", owner = "memory", resolves = "concept" }

# — settling
prediction          = { gloss = "One row of `predictions`: subject, target, resolution form and key, declared source, instant, confidence.", owner = "memory", resolves = "code" }
observation         = { gloss = "One row of `outcomes`: the prediction settled, the verdict, the signal, the source, the citation, the instant.", owner = "memory", resolves = "code" }
no-new-primitive    = { gloss = "Settling built from ordinary tables and a view, adding no storage or runtime primitive.", owner = "memory", resolves = "concept" }
resolution-form     = { gloss = "Exactly one of a relative horizon, an absolute deadline, or an open-ended watch.", owner = "memory", resolves = "code" }
deadline-canonicalization = { gloss = "A calendar-day deadline resolving to midnight UTC on that day.", owner = "memory", resolves = "concept" }
scheduling          = { gloss = "Asynchronous observation at the resolve instant; an open-ended watch scheduled not at all.", owner = "memory", resolves = "concept" }
prediction-id       = { gloss = "The content address over subject, target, resolution key and prediction instant.", owner = "memory", resolves = "code" }
observation-id      = { gloss = "The content address over every field an observation row asserts.", owner = "memory", resolves = "code" }
resolution-source   = { gloss = "`metric`, `adjudicator` or `manual`, declared on the prediction.", owner = "memory", resolves = "code" }
comparator-custody  = { gloss = "A metric comparator stored verbatim and evaluated outside the engine.", owner = "memory", resolves = "concept" }
comparator-missing  = { gloss = "A metric registration carrying no comparator.", owner = "memory", resolves = "concept" }
comparator-on-judgment = { gloss = "A comparator supplied alongside a judgment source.", owner = "memory", resolves = "concept" }
unknown-source      = { gloss = "A resolution source outside the declared set.", owner = "memory", resolves = "concept" }
unsourced-verdict   = { gloss = "A verdict carrying no resolution source.", owner = "memory", resolves = "concept" }
source-mismatch     = { gloss = "An observation whose resolution source contradicts its registration.", owner = "memory", resolves = "concept" }
settling-citation   = { gloss = "The `http` or `https` reference a judgment verdict carries onto the label view.", owner = "memory", resolves = "code" }
https               = { gloss = "The transport-secured URL scheme a settling citation is written in.", owner = "memory", resolves = "concept" }
undeclared-rule     = { gloss = "The null-verdict signal for a verdict against a prediction that declared no source.", owner = "memory", resolves = "code" }
self-rated          = { gloss = "The null-verdict signal for an outcome derived from the store's own rating.", owner = "memory", resolves = "code" }
unresolved-signal   = { gloss = "The application-supplied `unresolved:<reason>` signal holding the verdict null.", owner = "memory", resolves = "code" }
application-cadence = { gloss = "Freshness thresholds and observation intervals owned by the application.", owner = "memory", resolves = "concept" }
outcome-label       = { gloss = "`outcome_labels`, the join of predictions to outcomes with derived lead time.", owner = "memory", resolves = "code" }
grace-window        = { gloss = "The inclusive window past a deadline within which a settlement is scored.", owner = "memory", resolves = "concept" }
epoch-comparison    = { gloss = "Casting text instants to epoch seconds before comparing them in the view.", owner = "memory", resolves = "concept" }
view-partition      = { gloss = "`outcome_labels_unresolved` negating the scored predicate verbatim under null guards.", owner = "memory", resolves = "code" }
defensive-projection = { gloss = "A column a store may not carry projected as the null literal.", owner = "memory", resolves = "concept" }

[error]
MemoryShapeColumnMissing    = { gloss = "A table naming a memory shape omits one of that shape's canonical columns.", owner = "memory" }
MemoryUndeclaredRelation    = { gloss = "A candidate edge carries a relation type outside the reserved core and the deployment's declared set.", owner = "memory" }
MemoryCandidateSchemaInvalid = { gloss = "An extracted candidate fails the declared output schema on its terminal attempt.", owner = "memory" }
MemoryExtractExhausted      = { gloss = "An extract batch exhausts its retry attempts and lands in the dead-letter table.", owner = "memory" }
MemoryDirectWriteShapeRefused = { gloss = "A direct write targets a memory shape other than the claim shape.", owner = "memory" }
MemoryEvidenceUnresolved    = { gloss = "A claim's evidence names an unreadable row, a masked row, an unknown table, another memory row, or malformed lineage.", owner = "memory" }
MemoryEvidenceOverflow      = { gloss = "A claim names more evidence references than the bound permits.", owner = "memory" }
MemoryForgetUngranted       = { gloss = "A caller invokes forget without the privileged forget grant.", owner = "memory" }
MemoryEntityAmbiguous       = { gloss = "A mention resolves onto two canonical identities with no deterministic key to separate them.", owner = "memory" }
MemoryEdgeEndpointUnresolved = { gloss = "A candidate edge's source or target resolves to no identity.", owner = "memory" }
OutcomeResolutionFormInvalid = { gloss = "A prediction names no resolution form, or more than one.", owner = "memory" }
OutcomeSourceUnknown        = { gloss = "A registration names a resolution source outside metric, adjudicator and manual.", owner = "memory" }
OutcomeComparatorMissing    = { gloss = "A metric registration carries no comparator.", owner = "memory" }
OutcomeComparatorOnJudgment = { gloss = "A comparator accompanies an adjudicator or manual registration.", owner = "memory" }
OutcomeVerdictUnsourced     = { gloss = "An observation carries a verdict and no resolution source.", owner = "memory" }
OutcomeSourceMismatch       = { gloss = "An observation's resolution source contradicts the prediction's registration.", owner = "memory" }
OutcomeCitationMissing      = { gloss = "A judgment verdict carries no http or https settling citation.", owner = "memory" }

[limit]
memory-extract-attempts  = { value = 3, unit = "attempts", owner = "memory.synthesize.limit.extract-attempts", gloss = "Retries of a schema-invalid extract response, with feedback, per batch." }
memory-evidence-references = { value = 256, unit = "entries", owner = "memory.recall.limit.evidence-references", gloss = "Evidence row references one claim may name before recall suppresses it." }
outcome-grace-window     = { value = 86400, unit = "s", owner = "memory.settle.limit.grace-window", gloss = "Inclusive window past a prediction's deadline within which an observation is still scored." }
