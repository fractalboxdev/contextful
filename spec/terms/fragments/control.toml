# Registry fragment — the `control` contract.
# Cadence, dispatch and the operator plane, in `spec/50-control-plane.md`.

[operation]
arm = { gloss = "The schedule grammar, the trigger adapter and its durability, the wake route, and how an entry computes its next fire.", file = "spec/50-control-plane.md", aliases = ["schedule", "trigger"] }
reconcile = { gloss = "The control source, the snapshot pointer and its versions, the pure schedule diff, and what a failed poll leaves armed.", file = "spec/50-control-plane.md", aliases = ["diff"] }
fire = { gloss = "Job declaration, the closed kind union, same-tick ordering, the fire watermark, and the one-shot evaluation.", file = "spec/50-control-plane.md", aliases = ["tick"] }
dispatch = { gloss = "The two deployment roles, the bounded fire pool and its exclusion keys, step results, and the worker adapter contract.", file = "spec/50-control-plane.md", aliases = ["delegate"] }
serve = { gloss = "The read path's two hops, a published hostname's declared posture, and the states in which a store is unavailable.", file = "spec/50-control-plane.md", aliases = ["route"] }
register-store = { gloss = "Which stores a deployment serves, how a store's credential and binding names derive from its id, and how a request reaches its origin.", file = "spec/50-control-plane.md", aliases = ["registry"] }
edit = { gloss = "The configuration document, the structured schedule specification, and connector configuration in the operator surface.", file = "spec/50-control-plane.md", aliases = ["author"] }
apply = { gloss = "Validation, the immutable version claim, the pointer advance, and the authority an apply carries.", file = "spec/50-control-plane.md", aliases = ["materialize"] }
visualize = { gloss = "The operations canvas, the file and ingestion views, and the learnings record a store publishes about itself.", file = "spec/50-control-plane.md", aliases = ["render"] }

