"control-step-cpu-paid" = { value = 5, unit = "min", owner = "control.dispatch.limit.step-cpu-paid", gloss = "Per-step CPU on a paid orchestrator tier." }
"control-heartbeat-beat" = { value = 15, unit = "s", owner = "control.dispatch.limit.heartbeat-beat", gloss = "The interval between worker heartbeats." }
"control-heartbeat-lapse" = { value = 60, unit = "s", owner = "control.dispatch.limit.heartbeat-lapse", gloss = "The heartbeat lapse after which in-flight work reschedules onto another worker." }
