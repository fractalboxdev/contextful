# Registry fragment — the `console` contract.
# The analyst console, in `spec/51-console.md`.

[operation]
speak = { gloss = "The language every visitor-visible string carries, answer hygiene as a persona and audience contract, the deterministic backstops beneath it, and what a gated surface publishes about itself.", file = "spec/51-console.md", aliases = ["product-language", "answer-hygiene"] }
ground = { gloss = "Where an answer's material comes from: the closed tool set, the two trust layers, the per-reader credential, the web supplement, and the sources block.", file = "spec/51-console.md", aliases = ["grounding", "cite"] }
plan-turn = { gloss = "The shape of one turn: planner scaffolding, the replanning round, the answerability test, the code path under a failed search, and the store's prompt overlay.", file = "spec/51-console.md", aliases = ["turn-loop", "replan"] }
set-vantage = { gloss = "A session's time basis: one vantage, its statement to the reader, the bound each leg carries, the snapshot timeline, and the arrivals strip.", file = "spec/51-console.md", aliases = ["vantage", "time-basis"] }
browse = { gloss = "What a store advertises before a question is asked: discovered chips, humanized labels, soft discovery, the file gallery, and the insights panel.", file = "spec/51-console.md", aliases = ["chips", "discover"] }
learn = { gloss = "The reading loop's memory: recall ahead of planning, the per-turn distillation, an anchored conclusion at a vantage, and the commit a write runs.", file = "spec/51-console.md", aliases = ["learning", "console-memory"] }
render = { gloss = "The render contract: three channels, the component union, deterministic component choice, view hints, and the sanitizer walk.", file = "spec/51-console.md", aliases = ["widget", "view-spec"] }
brief = { gloss = "The proactive card: its derivation, its payload, its matching tiers, the client-side clock, and the absence it earns.", file = "spec/51-console.md", aliases = ["catch-up", "greeting"] }

