[limit]
snapshot-id-digits    = { value = 20, unit = "chars", owner = "store.lay-out.limit.snapshot-id-width", gloss = "Width of the zero-padded nanosecond field in a snapshot directory name." }
reserved-optional-column-count = { value = 4, unit = "entries", owner = "store.reserve.limit.optional-producer-columns", gloss = "Reserved optional columns a producer may set on a row." }
modality-value-count  = { value = 5, unit = "entries", owner = "store.reserve.limit.modality-values", gloss = "Accepted values of the reserved modality column." }
compaction-interval-trigger = { value = 6, unit = "h", owner = "store.fold.limit.compaction-interval", gloss = "Elapsed time after which a table's compaction pass fires." }
run-retention-window  = { value = 7, unit = "d", owner = "store.fold.limit.run-retention", gloss = "Default window a folded or displaced run directory stays readable." }
partition-median-floor = { value = 16, unit = "MiB", owner = "store.index.limit.partition-median-size", gloss = "Projected median partition size below which planning warns." }
