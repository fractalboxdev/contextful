# Registry fragment — the `store` contract.
# Operations, canonical subjects, error identifiers and named bounds asserted by
# spec/10-store.md. Every fourth segment of a `store.*` clause id appears here.

[operation]
lay-out    = { gloss = "The directory tree, snapshot and run naming, the commit markers, the manifests, and the catalog derived from them.", file = "spec/10-store.md", aliases = ["layout", "on-disk-layout"] }
declare    = { gloss = "A table's declaration block: its key, its ordering column, its write mode, and what a read returns for a withdrawn row.", file = "spec/10-store.md", aliases = ["table-declaration"] }
reserve    = { gloss = "The column and table namespaces the engine holds for itself, and the provenance columns it injects into every row.", file = "spec/10-store.md", aliases = ["reservation"] }
reconcile  = { gloss = "Schema evolution across a table's file set: the type lattice, additive columns, and what a scan may invent.", file = "spec/10-store.md", aliases = ["schema-reconciliation"] }
fold       = { gloss = "Compaction: pass order, triggers, retention, ownership, and the moment a snapshot becomes readable.", file = "spec/10-store.md", aliases = ["compact", "compaction"] }
index      = { gloss = "Sidecar index kinds and their identity, the physical arrangement that makes zone maps effective, and partitioning.", file = "spec/10-store.md", aliases = ["sidecar-index"] }
bound-time = { gloss = "The two clocks a row carries, the parameter bounding each, and what a bounded read resolves to.", file = "spec/10-store.md", aliases = ["time-travel", "bitemporal-read"] }
encrypt    = { gloss = "At-rest encryption of Parquet and its sidecars, key rotation per snapshot, and the column an index is withheld from.", file = "spec/10-store.md", aliases = ["encryption"] }

# ----------------------------------------------------------------------------
# Shared tokens this contract owns. A backticked spelling appearing in a second
# file resolves here.
# ----------------------------------------------------------------------------

[term]
snapshot            = { gloss = "One immutable fold output for a table, published as a directory under `data/snapshots/`.", owner = "store", resolves = "code" }
run-directory       = { gloss = "The append-only output of one run for one table, at `data/runs/<run-id>/<node-id>/`.", owner = "store", resolves = "concept" }
part                = { gloss = "One Parquet file inside a run or snapshot directory, named `part-<ordinal>.parquet`.", owner = "store", resolves = "code" }
manifest            = { gloss = "The `_manifest.json` indexing a run or a snapshot; the commit marker for a run and the description of a snapshot.", owner = "store", resolves = "code" }
catalog             = { gloss = "`meta.sqlite`, the one stateful store component, derived from the file tree and rebuildable from it.", owner = "store", resolves = "code" }
sidecar             = { gloss = "A derived index artifact under `indexes/` inside the snapshot directory it indexes.", owner = "store", resolves = "concept" }
genre               = { gloss = "Item or artifact: connector-landed rows against synthesized outputs, on one substrate.", owner = "store", resolves = "concept" }
"primary_key"       = { gloss = "The declared column set giving a table's rows an identity the fold collapses on.", owner = "store", resolves = "code" }
"order_by"          = { gloss = "The declared column the fold reads to pick the surviving row per key; defaults to the ingest stamp.", owner = "store", resolves = "code" }
"write_mode"        = { gloss = "`append` or `replace`: what a read returns for a row the source stopped serving.", owner = "store", resolves = "code" }
"cluster_by"        = { gloss = "The declared lexicographic row order inside a Parquet file, making zone maps effective.", owner = "store", resolves = "code" }
"partition_by"      = { gloss = "The declared directory partitioning of a snapshot; outermost column is the tenant boundary.", owner = "store", resolves = "code" }
"retain_runs"       = { gloss = "The window a folded or displaced run directory stays readable before collection.", owner = "store", resolves = "code" }
"valid_time"        = { gloss = "The table's declaration of which of its own columns carry the source's clock.", owner = "store", resolves = "code" }
"includes_runs"     = { gloss = "The snapshot manifest field naming the runs the fold absorbed.", owner = "store", resolves = "code" }
"union_by_name"     = { gloss = "The scan setting resolving a column across the whole file set to the common supertype.", owner = "store", resolves = "code" }
"key_source"        = { gloss = "The `[encryption]` key binding, read from the process environment or a key-management service.", owner = "store", resolves = "code" }
"as_of"             = { gloss = "The transaction-time upper bound, applied to the inner source of every named table.", owner = "store", resolves = "code" }
"valid_as_of"       = { gloss = "The valid-time bound over the pair a table declares.", owner = "store", resolves = "code" }
"_ingested_at"      = { gloss = "The injected RFC3339 ingest stamp, non-null on every row; transaction time.", owner = "store", resolves = "code" }
"_run_id"           = { gloss = "The injected identifier of the run that landed a row.", owner = "store", resolves = "code" }
"_batch_seq"        = { gloss = "The injected int32 batch ordinal, present where a batch scope exists.", owner = "store", resolves = "code" }
"_site_id"          = { gloss = "The injected identifier of the site that wrote a row.", owner = "store", resolves = "code" }
"_authored_by"      = { gloss = "The injected column carrying the principal a write was authorized for.", owner = "store", resolves = "code" }
"_modality"         = { gloss = "Reserved optional producer column: text, image, audio, structured or mixed.", owner = "store", resolves = "code" }
"_lang"             = { gloss = "Reserved optional producer column carrying a BCP-47 tag.", owner = "store", resolves = "code" }
"_provenance"       = { gloss = "Reserved optional producer column naming the evidence rows a row derives from.", owner = "store", resolves = "code" }
"_prompt_hash"      = { gloss = "Reserved optional producer column, `sha256:<hex>` over a prompt template.", owner = "store", resolves = "code" }
"contextful.bounds" = { gloss = "The envelope block echoing the resolved bounds a read ran under.", owner = "store", resolves = "code" }
"contextful.index"  = { gloss = "The span namespace an index build emits under.", owner = "store", resolves = "code" }

