# Registry fragment — the pipeline contract.
# Operations, canonical subject terms, error identifiers and named bounds
# asserted by spec/31-pipeline.md.

[operation]
declare       = { gloss = "The pipeline specification, its two serializations, manifest discovery and merge, the content hash, the table block, and the lifecycle verbs.", file = "spec/31-pipeline.md", aliases = ["author", "specify"] }
compile       = { gloss = "The build-time lowering of a specification into a content-hashed plan of declared nodes.", file = "spec/31-pipeline.md", aliases = ["lower", "emit-plan"] }
transform     = { gloss = "The declarative chain that rewrites a pulled batch in place at pipeline level.", file = "spec/31-pipeline.md", aliases = ["rewrite-batch"] }
normalize     = { gloss = "Nested canonical form, relational shredding at the sink, injected identity columns and recursion depth.", file = "spec/31-pipeline.md", aliases = ["flatten", "shred"] }
guard-secrets = { gloss = "The write-time mask over credential-shaped byte spans in a pulled batch.", file = "spec/31-pipeline.md", aliases = ["mask-secrets", "scrub"] }
land          = { gloss = "Batch write, run commit, stream-position advance, the ingest tally, and containment of input a parser cannot read.", file = "spec/31-pipeline.md", aliases = ["ingest", "write-batch"] }
backfill      = { gloss = "Phases, chunk plans, chunk leases and attempts, and the rewind window over historical range.", file = "spec/31-pipeline.md", aliases = ["catch-up", "chunk-load"] }
seed          = { gloss = "The bulk-load source mode, its ordering ceiling, its namespaced state and its parity guarantee.", file = "spec/31-pipeline.md", aliases = ["bulk-load", "preload"] }
publish       = { gloss = "A published table's contract identity, build log, freshness record, holds and semantics version.", file = "spec/31-pipeline.md", aliases = ["build-model", "materialize"] }

[term]
# declare
pipeline-spec     = { gloss = "The canonical declaration of one pipeline: id, source, tables and the optional blocks.", owner = "pipeline", resolves = "code" }
serialization     = { gloss = "One of the two textual forms a specification deserializes from.", owner = "pipeline", resolves = "concept" }
source-block      = { gloss = "A connector name beside a free-form JSON config object.", owner = "pipeline", resolves = "code" }
manifest-file     = { gloss = "A file the startup scan deserializes one specification from.", owner = "pipeline", resolves = "concept" }
pipeline-id       = { gloss = "The key specifications merge on and destination table names derive from.", owner = "pipeline", resolves = "code" }
content-hash      = { gloss = "The sha256 over a specification's canonical JSON, and the input a replay pin keys on.", owner = "pipeline", resolves = "code" }
table-name        = { gloss = "The derived destination name, pipeline id and table name folded together.", owner = "pipeline", resolves = "code" }
table-entry       = { gloss = "One element of the tables array, a bare name or an object.", owner = "pipeline", resolves = "code" }
table-block       = { gloss = "The declared configuration of one table inside a specification.", owner = "pipeline", resolves = "code" }
primary-key       = { gloss = "The declared column set a fold keeps one row per.", owner = "pipeline", resolves = "code" }
write-mode        = { gloss = "Whether a landing run adds to a table or supersedes it.", owner = "pipeline", resolves = "code" }
empty-commit      = { gloss = "A committed run that landed no rows.", owner = "pipeline", resolves = "concept" }
destination       = { gloss = "The sink a pipeline's rows land in.", owner = "pipeline", resolves = "code" }
config-key        = { gloss = "A key inside a source's config object, measured against the set that source enumerates.", owner = "pipeline", resolves = "code" }
lifecycle-verb    = { gloss = "One of plan, apply, run and serve.", owner = "pipeline", resolves = "code" }
table-error       = { gloss = "What one table's failure does to the rest of a fire.", owner = "pipeline", resolves = "code" }
chunked-load      = { gloss = "A load running under a seed or a backfill chunk plan rather than a single live pass.", owner = "pipeline", resolves = "concept" }
incremental-field = { gloss = "The pipeline-level declaration naming a stream's clock column.", owner = "pipeline", resolves = "code" }
validation-warning = { gloss = "A non-blocking diagnostic a manifest check emits per table.", owner = "pipeline", resolves = "concept" }

# compile
authoring-surface = { gloss = "The build-time layer a specification is written through.", owner = "pipeline", resolves = "concept" }
scripting-runtime = { gloss = "An embedded interpreter executing authored code at serving time.", owner = "pipeline", resolves = "concept" }
plan              = { gloss = "The flat, content-hashed node list a specification compiles to.", owner = "pipeline", resolves = "code" }
plan-node         = { gloss = "One element of a plan: step, sleep, awaitEvent, branch or parallel.", owner = "pipeline", resolves = "code" }
plan-version      = { gloss = "The hash prefix identifying one compiled plan.", owner = "pipeline", resolves = "code" }
plan-schema       = { gloss = "The derived JSON Schema every language binds a plan through.", owner = "pipeline", resolves = "code" }
step              = { gloss = "A plan node whose body is a connector reference.", owner = "pipeline", resolves = "code" }
predicate         = { gloss = "The declared expression a branch node selects an arm by.", owner = "pipeline", resolves = "code" }
lowering          = { gloss = "The node-by-node mapping of a plan onto a durable substrate.", owner = "pipeline", resolves = "concept" }

# transform
transform-chain   = { gloss = "The ordered, in-place list of select, rename, cast and filter.", owner = "pipeline", resolves = "code" }
root-table        = { gloss = "The table a source's top-level records land in, ahead of shredding.", owner = "pipeline", resolves = "concept" }
filter            = { gloss = "The single-column predicate operation of the chain.", owner = "pipeline", resolves = "code" }
cast              = { gloss = "The chain operation rewriting one column's type in place.", owner = "pipeline", resolves = "code" }
projection        = { gloss = "The outgoing column set select and rename fix.", owner = "pipeline", resolves = "concept" }

# normalize
host-stage        = { gloss = "Engine code performing type inference, flattening, extraction and id assignment.", owner = "pipeline", resolves = "concept" }
normalized-form   = { gloss = "Nested Arrow structs and lists, the canonical shape of a normalized batch.", owner = "pipeline", resolves = "concept" }
shredding         = { gloss = "The late projection of nested values into parent-child tables at a sink.", owner = "pipeline", resolves = "concept" }
normalize-mode    = { gloss = "Whether a sink receives the nested form or the relational projection.", owner = "pipeline", resolves = "code" }
mode-resolution   = { gloss = "The declaration-then-capability-then-default order that fixes a mode.", owner = "pipeline", resolves = "concept" }
identity-column   = { gloss = "A column normalize injects: row id, load id, parent id, list index, root id.", owner = "pipeline", resolves = "code" }
list-index        = { gloss = "The ordinal on a shredded child row that makes the projection reversible.", owner = "pipeline", resolves = "code" }
nesting-depth     = { gloss = "The declared bound on how far normalization descends.", owner = "pipeline", resolves = "code" }
valid-time-line   = { gloss = "The partition a fold keeps alongside the key on a table declaring validity.", owner = "pipeline", resolves = "concept" }

# guard-secrets
secret-guard      = { gloss = "The write-time mask running at the pull path shared by streaming and backfill.", owner = "pipeline", resolves = "code" }
matcher           = { gloss = "One linear-time credential-shape recognizer in the guard's set.", owner = "pipeline", resolves = "code" }
token-tail        = { gloss = "The run of characters a prefixed token carries after its prefix.", owner = "pipeline", resolves = "concept" }
assignment        = { gloss = "A keyword-equals-value shape the guard recognizes.", owner = "pipeline", resolves = "concept" }
mask-span         = { gloss = "The matched byte range the replacement covers.", owner = "pipeline", resolves = "code" }
sentinel          = { gloss = "The fixed replacement text a masked span carries.", owner = "pipeline", resolves = "code" }
span-label        = { gloss = "The pattern name a reported span is attributed to.", owner = "pipeline", resolves = "code" }
span-boundary     = { gloss = "The character boundaries a reported span widens to.", owner = "pipeline", resolves = "concept" }
mask-only         = { gloss = "The posture under which a match masks and the pull continues.", owner = "pipeline", resolves = "concept" }
mask-tally        = { gloss = "The per-pull count of masked cells beside the columns they sat in.", owner = "pipeline", resolves = "code" }
coverage          = { gloss = "The shapes the guard reaches and the encodings it passes through.", owner = "pipeline", resolves = "concept" }

# land
batch-write       = { gloss = "One durable write of one record batch inside a run.", owner = "pipeline", resolves = "code" }
commit            = { gloss = "The step making a run's rows visible for a table.", owner = "pipeline", resolves = "code" }
watermark         = { gloss = "The committed clock position a pull's inclusive bound is measured against.", owner = "pipeline", resolves = "code" }
frontier          = { gloss = "The furthest clock value a pull observed, landed or not.", owner = "pipeline", resolves = "code" }
clock-field       = { gloss = "The field name a committed position was measured on.", owner = "pipeline", resolves = "code" }
ingest-tally      = { gloss = "The machine-readable summary a fire returns.", owner = "pipeline", resolves = "code" }
unreadable-input  = { gloss = "Input a parser cannot read, treated as data rather than as a fault.", owner = "pipeline", resolves = "concept" }
partial-parse     = { gloss = "A read that covered part of a multi-part input and stopped.", owner = "pipeline", resolves = "concept" }
parse-boundary    = { gloss = "The process boundary a decode that can die runs behind.", owner = "pipeline", resolves = "concept" }
table-failure     = { gloss = "One table's pull failing inside a fire.", owner = "pipeline", resolves = "concept" }
skip-unchanged    = { gloss = "The snapshot-source option recording an input digest in the cursor.", owner = "pipeline", resolves = "code" }
digest-scope      = { gloss = "What the unchanged-input digest is taken over.", owner = "pipeline", resolves = "concept" }

# backfill
phase             = { gloss = "One of planning, seeding, backfilling and streaming, recorded per pipeline.", owner = "pipeline", resolves = "code" }
chunk-plan        = { gloss = "The set of chunks a backfill window resolves into.", owner = "pipeline", resolves = "code" }
chunk             = { gloss = "One independently committed unit of a chunk plan.", owner = "pipeline", resolves = "code" }
chunk-lease       = { gloss = "The row-level claim a worker takes on a chunk, recording node and attempt.", owner = "pipeline", resolves = "code" }
commit-signal     = { gloss = "The catalog row that makes a chunk's files committed rather than in-flight.", owner = "pipeline", resolves = "concept" }
attempt-isolation = { gloss = "The path segmentation keeping two attempts at one chunk apart.", owner = "pipeline", resolves = "concept" }
tick              = { gloss = "A scheduler wake that dispatches chunks while a pipeline backfills.", owner = "pipeline", resolves = "concept" }
backfill-block    = { gloss = "The declared window and chunk sizing of a backfill.", owner = "pipeline", resolves = "code" }
rewind-window     = { gloss = "The half-open range whose overlapping chunks return to pending.", owner = "pipeline", resolves = "code" }
rewind-log        = { gloss = "The append-only audit table recording each rewound chunk and its reason.", owner = "pipeline", resolves = "code" }

# seed
seed-block        = { gloss = "The bulk-load source attached to a live pipeline, with its ceiling.", owner = "pipeline", resolves = "code" }
attribution       = { gloss = "The provenance by which a seeded row is distinguishable from a live one.", owner = "pipeline", resolves = "concept" }
seed-declarations = { gloss = "The key and event-time ordering a seeded table declares.", owner = "pipeline", resolves = "concept" }
ceiling           = { gloss = "The ordering-stamp bound every seeded row sorts below.", owner = "pipeline", resolves = "code" }
ceiling-evaluation = { gloss = "The comparison of a landed stamp against the declared ceiling.", owner = "pipeline", resolves = "concept" }
ceiling-binding   = { gloss = "Whether a seed's ceiling becomes the live stream's starting position.", owner = "pipeline", resolves = "concept" }
seed-scope        = { gloss = "The namespaced key seed chunk and cursor state live under.", owner = "pipeline", resolves = "code" }
connector-pin     = { gloss = "The recorded connector identity a run is admitted against.", owner = "pipeline", resolves = "code" }
fingerprint       = { gloss = "The cheap content probe of a seed source, stamped at commit.", owner = "pipeline", resolves = "code" }
seed-command      = { gloss = "The status and reset verbs over a seeded table.", owner = "pipeline", resolves = "code" }
parity            = { gloss = "The equality of a seeded-then-live load with a pure live backfill.", owner = "pipeline", resolves = "concept" }
parity-audit      = { gloss = "The validate pass reading every landed row to check seed ordering.", owner = "pipeline", resolves = "code" }
ordering-guarantee = { gloss = "That every seeded stamp sorts strictly below the earliest live one.", owner = "pipeline", resolves = "concept" }
compaction-cadence = { gloss = "The fold job a seeded table declares.", owner = "pipeline", resolves = "concept" }
divergence        = { gloss = "The one behavior where a seed differs from a pure live backfill.", owner = "pipeline", resolves = "concept" }

# publish
published-model   = { gloss = "A table published with a contract and its build artifacts beside its data.", owner = "pipeline", resolves = "concept" }
contract-identity = { gloss = "A published table's version paired with its schema fingerprint.", owner = "pipeline", resolves = "code" }
contract-history  = { gloss = "The append-only record of identity changes on a published table.", owner = "pipeline", resolves = "code" }
build-log         = { gloss = "The append-only entry per build attempt over a published table.", owner = "pipeline", resolves = "code" }
freshness-record  = { gloss = "The newest publishing build, its watermark and its lag bound.", owner = "pipeline", resolves = "code" }
hold              = { gloss = "An entry keeping one build's files reachable past collection.", owner = "pipeline", resolves = "code" }
manifest-section  = { gloss = "The published table's derived entry in the store manifest.", owner = "pipeline", resolves = "code" }
semantics-version = { gloss = "The monotone substrate version an engine column addition bumps.", owner = "pipeline", resolves = "code" }
fingerprint-recipe = { gloss = "The named inputs a schema fingerprint is taken over.", owner = "pipeline", resolves = "code" }
staging           = { gloss = "The location a build materializes into before it renames in.", owner = "pipeline", resolves = "concept" }
disclosure-digest = { gloss = "The hash over a build's declared policy fields, recorded per run.", owner = "pipeline", resolves = "code" }
build-status      = { gloss = "One of published, refused and partial.", owner = "pipeline", resolves = "code" }

[error]
PipelineDuplicateId            = { gloss = "One pipeline id declared in two manifest files.", owner = "pipeline" }
PipelineSpecInvalid            = { gloss = "A manifest file the canonical specification type cannot deserialize.", owner = "pipeline" }
PipelineUnboundTableName       = { gloss = "A destination table named in a spelling the derivation does not produce.", owner = "pipeline" }
PipelineReplaceUnsupported     = { gloss = "The replacing write mode declared beside a windowed or chunked load.", owner = "pipeline" }
PipelineUnknownDestination     = { gloss = "A destination naming something other than the local store.", owner = "pipeline" }
PipelineUnknownConfigKey       = { gloss = "A source config key outside the set that source enumerates.", owner = "pipeline" }
PipelineInlineStepBody         = { gloss = "A plan step whose body is not a connector reference.", owner = "pipeline" }
PipelineUndeclaredControlFlow  = { gloss = "A data-dependent conditional or loop in a workflow body.", owner = "pipeline" }
PipelineNodeIdCollision        = { gloss = "One node id repeated inside a single plan.", owner = "pipeline" }
PipelineTransformArity         = { gloss = "A chain operation emitting more rows than it consumed.", owner = "pipeline" }
PipelineTransformColumnMissing = { gloss = "A chain operation naming a column the batch does not carry.", owner = "pipeline" }
PipelineListIndexMissing       = { gloss = "A relational child table emitted with no list index.", owner = "pipeline" }
PipelineNormalizeModeUnknown   = { gloss = "A normalize block naming a mode outside the two.", owner = "pipeline" }
PipelineUnorderableClock       = { gloss = "A row with no orderable value in the declared clock field.", owner = "pipeline" }
PipelineClockFieldChanged      = { gloss = "An incremental declaration naming a field the committed position was not measured on.", owner = "pipeline" }
PipelineUnreadableInput        = { gloss = "Input a parser cannot read, refused permanently by name and position.", owner = "pipeline" }
PipelinePartialParse           = { gloss = "A read covering part of a multi-part input.", owner = "pipeline" }
PipelineParseCrashed           = { gloss = "A non-zero exit or fatal signal from the contained decode process.", owner = "pipeline" }
PipelineTableFailed            = { gloss = "One table's pull failing inside a fire.", owner = "pipeline" }
PipelineChunkParallelism       = { gloss = "A sequential chunk plan declared beside a parallelism above one.", owner = "pipeline" }
PipelineRewindWindowInvalid    = { gloss = "An inverted, empty or scale-incomparable rewind window.", owner = "pipeline" }
PipelineSeedDeclarationMissing = { gloss = "A seeded table lacking a key or an explicit event-time ordering.", owner = "pipeline" }
PipelineSeedCeilingBreached    = { gloss = "A seeded row whose stamp reaches or passes the declared ceiling.", owner = "pipeline" }
PipelineSeedCeilingUnevaluable = { gloss = "A batch whose stamp cannot be compared with the ceiling at all.", owner = "pipeline" }
PipelineSeedSourceChanged      = { gloss = "A seed source whose fingerprint differs from the one recorded at commit.", owner = "pipeline" }
PipelineContractMismatch       = { gloss = "A materialization failing its published table's declared contract.", owner = "pipeline" }
PipelineModelArtifactsTorn     = { gloss = "Published-table artifacts that disagree with the build log.", owner = "pipeline" }

[limit]
plan-version-prefix = { value = 16, unit = "chars", owner = "pipeline.compile.limit.plan-version", gloss = "Leading characters of a compiled plan's hash that form its version." }
aws-key-id-body     = { value = 16, unit = "chars", owner = "pipeline.guard-secrets.limit.matcher", gloss = "Uppercase alphanumerics following an access-key id prefix." }
github-token-tail   = { value = 36, unit = "chars", owner = "pipeline.guard-secrets.limit.token-tail", gloss = "Characters a GitHub token prefix is matched with." }
assignment-value    = { value = 16, unit = "chars", owner = "pipeline.guard-secrets.limit.assignment", gloss = "Minimum value length for a keyword-equals-value match." }
