# The read face — operations, subjects, error identifiers and named bounds
# owned by `spec/20-read.md`.

[operation]
register    = { gloss = "The relations, tools and templates one connection sees, and the engine executing against them.", file = "spec/20-read.md", aliases = ["registration", "view-registration"] }
guard       = { gloss = "Admission of caller-written SQL: what parses, what a base relation names, whose text runs raw.", file = "spec/20-read.md", aliases = ["statement-guard", "admission"] }
respond     = { gloss = "The one response projection: cell encoding, the row ceiling, truncation, counts and operator metadata.", file = "spec/20-read.md", aliases = ["envelope", "response-projection"] }
retrieve    = { gloss = "Candidate generation for a ranked read: content tokens, the relevance floor, per-table arms, dedup, snippet.", file = "spec/20-read.md", aliases = ["candidate-generation", "ranked-read"] }
rank        = { gloss = "Ordering of a candidate set: the three legs, their fusion, the question's timeframe, reported confidence.", file = "spec/20-read.md", aliases = ["ranking", "fusion"] }
cache       = { gloss = "Locality of the bytes a read touches, and reuse of a result across requests.", file = "spec/20-read.md", aliases = ["result-cache", "hot-set"] }
resolve-pin = { gloss = "Resolution of a named published-model build at read time, and the state each response echoes.", file = "spec/20-read.md", aliases = ["pin-resolution", "build-pin"] }
embed       = { gloss = "The client library, its four transports, the handshake's build identity, and each shape's credential.", file = "spec/20-read.md", aliases = ["embedding", "client-kit"] }

[term]
# register
connection-views              = { gloss = "The per-connection create-or-replace registration issued ahead of a statement.", owner = "read", resolves = "code" }
file-list                     = { gloss = "The explicit sorted part-file list a registered relation scans.", owner = "read", resolves = "code" }
engine                        = { gloss = "The embedded columnar SQL engine that executes an admitted statement.", owner = "read", resolves = "concept" }
quiet-table                   = { gloss = "A table whose committed runs landed no rows, registered as a zero-row relation.", owner = "read", resolves = "concept" }
bare-name                     = { gloss = "An unqualified table name, resolving to the caller's registered relation.", owner = "read", resolves = "concept" }
tool-set                      = { gloss = "The closed set of calls the read face exposes.", owner = "read", resolves = "code" }
describe-payload              = { gloss = "What a describe call answers with: schema, hints, index inventory, limits, lexicon, examples.", owner = "read", resolves = "code" }
advertised-is-enforced        = { gloss = "The equality between a published limits block and the bounds the engine applies.", owner = "read", resolves = "concept" }
template-projection           = { gloss = "The projection of a manifest query template into a named, typed tool.", owner = "read", resolves = "concept" }
ungranted-template            = { gloss = "A template outside the caller's grants: absent from listing and unreachable by identifier.", owner = "read", resolves = "concept" }
file-listing                  = { gloss = "The store-relative path listing over committed data files of readable tables.", owner = "read", resolves = "code" }
file-preview-target           = { gloss = "The path a file preview resolves to a table and run before reading rows back.", owner = "read", resolves = "concept" }
ledger-relation               = { gloss = "The per-table request-ledger child relation registered beside its table.", owner = "read", resolves = "code" }
scoped-ledger                 = { gloss = "A tenant-scoped caller's attempt to name the request-ledger child relation.", owner = "read", resolves = "concept" }
lexicon-surface               = { gloss = "The part of a store's declared lexicon that crosses to a rendering client.", owner = "read", resolves = "concept" }
reserved-namespaces           = { gloss = "Engine-owned table namespaces as they appear through ordinary registration.", owner = "read", resolves = "concept" }

# guard
single-read-only-statement    = { gloss = "The one admitted statement form: a single read-only SELECT.", owner = "read", resolves = "concept" }
engine-own-parse              = { gloss = "The executor's own serialization of a statement, which the guard walks.", owner = "read", resolves = "concept" }
relation-allowlist            = { gloss = "The set of names a base relation may carry: registered views and declared CTEs.", owner = "read", resolves = "concept" }
whole-tree-walk               = { gloss = "The guard's traversal of every node, with CTE names gathered tree-wide first.", owner = "read", resolves = "concept" }
unregistered-relation         = { gloss = "A base relation naming nothing this connection registered.", owner = "read", resolves = "concept" }
table-function                = { gloss = "A function-shaped relation node, and the schema-qualified catalog reach beside it.", owner = "read", resolves = "concept" }
statement-provenance          = { gloss = "Who authored a statement's text, which is what admission binds on.", owner = "read", resolves = "concept" }
quoted-identifiers            = { gloss = "The double-quoting of every schema- or manifest-derived identifier at render time.", owner = "read", resolves = "concept" }
template-declaration          = { gloss = "A template's identifier, statement, typed positional parameters and optional ceiling.", owner = "read", resolves = "code" }
template-relation-shape       = { gloss = "The plain-identifier form a template's relation names take.", owner = "read", resolves = "concept" }
template-binding              = { gloss = "Strict binding of a template's declared parameters to submitted arguments.", owner = "read", resolves = "concept" }
startup-time-check            = { gloss = "The caller-independent template validation run once at face startup.", owner = "read", resolves = "concept" }
subject-values-are-parameters = { gloss = "Caller-describing values reaching a statement through parameter slots.", owner = "read", resolves = "concept" }

# respond
one-projection                = { gloss = "The single canonical response body every transport serializes.", owner = "read", resolves = "code" }
row-ceiling                   = { gloss = "The per-table bound on rows delivered, published as a limits field.", owner = "read", resolves = "code" }
truncation-is-exact           = { gloss = "The probe-row basis of the truncation flag.", owner = "read", resolves = "concept" }
cell-encoding                 = { gloss = "The JSON rendering of each SQL value in a response cell.", owner = "read", resolves = "concept" }
wide-number-shape             = { gloss = "The per-column, per-response decision between numeric and string integer cells.", owner = "read", resolves = "concept" }
type-is-the-cell              = { gloss = "The absence of a separate type list beside the rows.", owner = "read", resolves = "concept" }
zero-rows-is-success          = { gloss = "An under-limit or empty result as a successful answer.", owner = "read", resolves = "concept" }
match-count                   = { gloss = "The count of rows a ranker scored as matching, carried outside the internals opt-in.", owner = "read", resolves = "code" }
coverage-is-a-count           = { gloss = "The untruncated count behind a claim that the corpus lacks a subject.", owner = "read", resolves = "concept" }
internals-opt-in              = { gloss = "The separate object carrying executed SQL, engine, applied limit, count and elapsed time.", owner = "read", resolves = "code" }
operator-metadata             = { gloss = "Table metadata on the operator surface: column count and backing file list.", owner = "read", resolves = "concept" }
in-band-error                 = { gloss = "A refusal delivered inside a transport success on the tool protocol.", owner = "read", resolves = "concept" }
paths-stay-inside             = { gloss = "The withholding of store layout from an ordinary read's result.", owner = "read", resolves = "concept" }

# retrieve
ranked-call                   = { gloss = "The prefix-scoped ranked retrieval call spanning both table genres.", owner = "read", resolves = "code" }
relevance-floor               = { gloss = "The minimum matched-token count a row clears to reach a caller.", owner = "read", resolves = "code" }
content-tokens                = { gloss = "The normalized, deduplicated token set extracted from a query string.", owner = "read", resolves = "concept" }
token-length-floor            = { gloss = "The shortest ASCII run kept in the content-token set.", owner = "read", resolves = "concept" }
token-cap                     = { gloss = "The ceiling on content-token set size.", owner = "read", resolves = "concept" }
script-split-matching         = { gloss = "Word-boundary matching for ASCII tokens and containment matching for the rest.", owner = "read", resolves = "concept" }
plural-suffix-floor           = { gloss = "The token length below which the optional plural suffix is dropped.", owner = "read", resolves = "concept" }
text-free-table-scores-null   = { gloss = "A null rather than zero lexical score for a table carrying no snippet text.", owner = "read", resolves = "concept" }
candidate-window              = { gloss = "The bounded, recency-ordered row set a ranked read draws candidates from.", owner = "read", resolves = "code" }
reserved-columns-project-null = { gloss = "Reserved projected columns rendered null for a table that lacks them.", owner = "read", resolves = "concept" }
unsatisfiable-arm-drops       = { gloss = "The removal of a per-table arm whose filter names a column that table lacks.", owner = "read", resolves = "concept" }
engine-resolved-date          = { gloss = "The publication column the engine picks per table for time-framed handling.", owner = "read", resolves = "concept" }
filter-budget                 = { gloss = "The bound on a filter's membership list, condition count and byte size.", owner = "read", resolves = "code" }
row-key-dedup                 = { gloss = "Read-time collapse to one row per table and declared row key.", owner = "read", resolves = "concept" }
row-key-stays-internal        = { gloss = "The absence of the row key from the outer projection.", owner = "read", resolves = "concept" }
dedup-is-gated                = { gloss = "The gating of the deduplicating window on the same condition as the floor.", owner = "read", resolves = "concept" }
snippet                       = { gloss = "The label-priority text a ranked row carries and both rankers score.", owner = "read", resolves = "code" }
identifiers-never-snippet     = { gloss = "The exclusion of hashes, URLs, identifiers and instants from a snippet.", owner = "read", resolves = "concept" }
sidecar-generates-candidates  = { gloss = "The vector arm's role: widening the window rather than rescoring it.", owner = "read", resolves = "concept" }
sidecar-oversampling          = { gloss = "The candidate count one sidecar probe requests, and its restriction multiplier.", owner = "read", resolves = "concept" }
sidecar-size-cap              = { gloss = "The stored-vector size past which a sidecar is left unloaded.", owner = "read", resolves = "concept" }
sidecar-falls-back            = { gloss = "The exact-scan fallback taken on every sidecar precondition failure.", owner = "read", resolves = "concept" }
gain-never-loss               = { gloss = "The accelerated arm as a strict superset of the exact path for one reader.", owner = "read", resolves = "concept" }

# rank
three-legs                    = { gloss = "Cosine similarity, BM25, and their weighted fusion.", owner = "read", resolves = "concept" }
fusion                        = { gloss = "The weighted combination of a clamped cosine and a normalized lexical score.", owner = "read", resolves = "code" }
lexical-leg-matches-only      = { gloss = "The should-clause disjunction that leaves a non-matching document unranked.", owner = "read", resolves = "concept" }
flat-window-full-credit       = { gloss = "Full lexical credit where a window's scores carry no spread.", owner = "read", resolves = "concept" }
question-window-is-a-tier     = { gloss = "The question's timeframe as a leading sort key rather than a predicate.", owner = "read", resolves = "concept" }
window-anchor-tolerance       = { gloss = "How far past the anchor a publication instant still counts as in-window.", owner = "read", resolves = "concept" }
ordering-casts-first          = { gloss = "The cast applied to a publication value ahead of an ordering comparison.", owner = "read", resolves = "concept" }
retrieval-block               = { gloss = "The per-response confidence block a ranked read carries.", owner = "read", resolves = "code" }
internal-score-stays-internal = { gloss = "The lexical engine's corpus-relative float, withheld from a caller.", owner = "read", resolves = "concept" }
absent-block                  = { gloss = "The omission of the retrieval block where no ranker produced a number.", owner = "read", resolves = "concept" }
degradation-not-error         = { gloss = "A changed ordering, rather than a failed call, where a backend is absent.", owner = "read", resolves = "concept" }
fallback-counts-tokens        = { gloss = "The token-scoring fallback used without the lexical backend.", owner = "read", resolves = "concept" }
caller-embedding              = { gloss = "A caller-supplied query vector, which turns on the cosine leg.", owner = "read", resolves = "code" }
lexical-index-cache           = { gloss = "The fingerprinted, bounded cache of full-text indexes over candidate windows.", owner = "read", resolves = "concept" }
statistics-over-the-widened-window = { gloss = "Term statistics computed across the widened candidate set.", owner = "read", resolves = "concept" }
transports-are-byte-identical = { gloss = "The identical bodies the two ranked-retrieval calls assemble.", owner = "read", resolves = "concept" }

# cache
hot-local-parquet             = { gloss = "The locally synced, memory-mapped snapshot set a container reads.", owner = "read", resolves = "concept" }
cold-start                    = { gloss = "The interval a cold retrieval container takes to reach readiness.", owner = "read", resolves = "concept" }
result-key                    = { gloss = "The policy-subject-plus-statement key a cached result is stored under.", owner = "read", resolves = "concept" }
cache-is-opt-in               = { gloss = "Per-table opt-in for the result cache, and its exclusion for private tables.", owner = "read", resolves = "concept" }
snapshot-invalidates          = { gloss = "The invalidation a newly committed snapshot forces on cached results.", owner = "read", resolves = "concept" }
keep-warm-is-per-deployment   = { gloss = "Retention of a warm retrieval container for a deployment with active traffic.", owner = "read", resolves = "concept" }

# resolve-pin
pin-parameter                 = { gloss = "The read parameter mapping a table name to a published build identifier.", owner = "read", resolves = "code" }
unknown-build                 = { gloss = "A build identifier that is unknown or already collected.", owner = "read", resolves = "concept" }
earlier-bound-wins            = { gloss = "Resolution of two upper bounds on one clock to the earlier of them.", owner = "read", resolves = "concept" }
resolved-echo                 = { gloss = "The block naming each published table's resolved build and watermark.", owner = "read", resolves = "code" }
absent-watermark              = { gloss = "A null watermark for a materialization that carries none.", owner = "read", resolves = "concept" }
consumer-comparison           = { gloss = "The cross-query build-identifier comparison a derivation performs on itself.", owner = "read", resolves = "concept" }

# embed
client-packaging              = { gloss = "Embedding as a client concern over the served contract, not an engine extension.", owner = "read", resolves = "concept" }
headless-client               = { gloss = "The zero-dependency module exposing the read calls over a transport.", owner = "read", resolves = "code" }
one-call-per-read             = { gloss = "The single tool call each read costs, which is what makes transports interchangeable.", owner = "read", resolves = "concept" }
search-tool                   = { gloss = "The free-text search call and its arguments.", owner = "read", resolves = "code" }
four-shapes                   = { gloss = "The proxied, bound, engine-direct and child-process deployment shapes.", owner = "read", resolves = "concept" }
typed-entrypoint              = { gloss = "The account-internal entrypoint exporting query, protocol and health calls.", owner = "read", resolves = "code" }
per-request-token             = { gloss = "The capability token a single read runs under inside the engine.", owner = "read", resolves = "concept" }
wildcard-origin               = { gloss = "Opt-in, non-credentialed cross-origin access over a bearer header.", owner = "read", resolves = "concept" }
per-viewer-token              = { gloss = "The short-lived, audience-bound token minted for one browser viewer.", owner = "read", resolves = "concept" }
build-identity                = { gloss = "The set of optional faces a binary linked, reported at handshake.", owner = "read", resolves = "code" }
required-face                 = { gloss = "A client's declared dependency on an optional face, matched at handshake.", owner = "read", resolves = "code" }
two-absence-shapes            = { gloss = "The distinguishable consequences of a missing lexical and a missing vector backend.", owner = "read", resolves = "concept" }
absent-read-backend           = { gloss = "A binary linked without the embedded SQL engine.", owner = "read", resolves = "concept" }
ask-event-stream              = { gloss = "The typed event sequence an ask experience streams from a model-running backend.", owner = "read", resolves = "code" }
stdio-credential              = { gloss = "The mandatory credential a process-transport client presents.", owner = "read", resolves = "code" }
child-environment             = { gloss = "The explicit passthrough list a spawned engine's environment is built from.", owner = "read", resolves = "concept" }
store-selector                = { gloss = "The working directory a spawned engine resolves its project from.", owner = "read", resolves = "concept" }
serial-dispatch               = { gloss = "One in-flight request at a time over the process transport.", owner = "read", resolves = "concept" }
process-subpath               = { gloss = "The separate import path the child-process transport lives on.", owner = "read", resolves = "code" }

[error]
StatementNotReadOnly         = { gloss = "Admitted text did not parse to exactly one read-only SELECT.", owner = "read" }
RelationNotRegistered        = { gloss = "A base relation named nothing this connection registered.", owner = "read" }
TableFunctionRefused         = { gloss = "A table-function node, or a schema-qualified catalog reach, appeared in caller text.", owner = "read" }
TemplateNamesForeignRelation = { gloss = "A template's SQL named something other than a store table as a plain identifier.", owner = "read" }
TemplateArgumentRejected     = { gloss = "A template argument was missing, unknown, or of the wrong declared type.", owner = "read" }
TemplateNotGranted           = { gloss = "A template identifier outside the caller's grants was called.", owner = "read" }
FilePreviewNotATable         = { gloss = "A previewed path resolved to no table: a snapshot part, a traversal, an absolute path, a ledger file.", owner = "read" }
LedgerNotTenantScoped        = { gloss = "A tenant-scoped token named the request-ledger child relation.", owner = "read" }
FilterBudgetExceeded         = { gloss = "A ranked read's filter exceeded its value, condition or byte budget.", owner = "read" }
PinnedBuildUnavailable       = { gloss = "A pinned build identifier is unknown or already collected.", owner = "read" }
RequiredFaceAbsent           = { gloss = "A client required an optional face this binary did not link.", owner = "read" }
ReadBackendAbsent            = { gloss = "A read tool was called on a binary linked without the embedded SQL engine.", owner = "read" }
StdioCredentialMissing       = { gloss = "A process-transport client presented neither a capability token nor an explicit owner flag.", owner = "read" }
StoreSelectorAbsent          = { gloss = "A spawned engine's working directory resolved to no project manifest.", owner = "read" }

[limit]
read-row-ceiling-overfetch    = { value = 1,   unit = "rows",   owner = "read.respond.limit.row-ceiling",             gloss = "Rows fetched past the row ceiling, whose presence sets the truncation flag." }
read-token-length-floor       = { value = 2,   unit = "chars",  owner = "read.retrieve.limit.token-length-floor",     gloss = "Shortest ASCII run kept in the content-token set." }
read-content-token-cap        = { value = 12,  unit = "tokens", owner = "read.retrieve.limit.token-cap",              gloss = "Ceiling on the content-token set extracted from one query." }
read-plural-suffix-floor      = { value = 4,   unit = "chars",  owner = "read.retrieve.limit.plural-suffix-floor",    gloss = "Token length below which the optional plural suffix is dropped." }
read-candidate-window-floor   = { value = 200, unit = "rows",   owner = "read.retrieve.limit.candidate-window",       gloss = "Smallest candidate window a ranked read draws from." }
read-filter-values            = { value = 256, unit = "entries",owner = "read.retrieve.limit.filter-budget",          gloss = "Values admitted in one filter membership list." }
read-sidecar-probe-floor      = { value = 64,  unit = "rows",   owner = "read.retrieve.limit.sidecar-oversampling",   gloss = "Smallest candidate count one sidecar probe requests." }
read-sidecar-size-cap         = { value = 64,  unit = "MiB",    owner = "read.retrieve.limit.sidecar-size-cap",       gloss = "Stored-vector size past which a sidecar is left unloaded." }
read-window-anchor-tolerance  = { value = 24,  unit = "h",      owner = "read.rank.limit.window-anchor-tolerance",    gloss = "How far past the question's anchor a publication instant still counts as in-window." }
read-lexical-index-cache      = { value = 64,  unit = "entries",owner = "read.rank.limit.lexical-index-cache",        gloss = "Entries held in the FIFO cache of full-text indexes." }
read-cold-start-ceiling       = { value = 8,   unit = "s",      owner = "read.cache.limit.cold-start",                gloss = "Interval within which a cold retrieval container reaches readiness." }
