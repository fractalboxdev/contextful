# Registry fragment — contract `run`, file `spec/30-run.md`.
# Operations, canonical subjects, error identifiers and named bounds the durable
# run path owns. `spec register` folds this into the flattened registry.

[operation]
journal = { gloss = "Recording a step's output once and resolving it on every later replay.", file = "spec/30-run.md", aliases = ["record-step", "checkpoint"] }
advance = { gloss = "Committing an incremental read position under its declared cursor kind.", file = "spec/30-run.md", aliases = ["commit-cursor", "watermark"] }
suspend = { gloss = "Durable suspension on an external callback, its deadline and its resumption.", file = "spec/30-run.md", aliases = ["awakeable", "await-event"] }
retry = { gloss = "Classifying a failure and deciding the delay before the next attempt.", file = "spec/30-run.md", aliases = ["backoff", "reattempt"] }
own = { gloss = "The durable execution owner a scope holds and the connector build it pins while pending.", file = "spec/30-run.md", aliases = ["pin", "admit-execution"] }
cancel = { gloss = "Stopping work in flight at either grain and what the stop leaves behind.", file = "spec/30-run.md", aliases = ["stop", "abort-run"] }
record = { gloss = "The durable run record, its statuses, its provenance columns and windowed history over it.", file = "spec/30-run.md", aliases = ["run-history", "runs"] }
project = { gloss = "The best-effort live view of a run and the subscription that carries it.", file = "spec/30-run.md", aliases = ["subscribe", "run-stream"] }

[term]
# --- journal ---
step-output = { gloss = "What a journaled step produced, written once and returned on every replay.", owner = "run", resolves = "code" }
entry-key = { gloss = "The journal table's primary key, execution id plus step label plus input hash.", owner = "run", resolves = "code" }
inline-cutoff = { gloss = "The size at or under which a journaled value lives in its own row.", owner = "run", resolves = "concept" }
value-tier = { gloss = "Whether a journaled value is inline bytes or a blob pointer; a caller branches on neither.", owner = "run", resolves = "concept" }
blob-address = { gloss = "The content-addressed sha256 filename a offloaded journal value takes.", owner = "run", resolves = "code" }
missing-blob = { gloss = "A journal row whose blob reference resolves to no file.", owner = "run", resolves = "concept" }
row-admission = { gloss = "Insert-or-ignore admission of a journal row under a contested key.", owner = "run", resolves = "concept" }
effect-boundary = { gloss = "The journal as the line every observable side effect crosses.", owner = "run", resolves = "concept" }
recorded-batch = { gloss = "The source's own bytes as a journaled pull serialized them, ahead of the land path.", owner = "run", resolves = "concept" }
replay-lands = { gloss = "A journal hit re-running the land path over the recorded batch without re-pulling.", owner = "run", resolves = "concept" }
ledger-settles-first = { gloss = "The outbound request ledger committing ahead of the journal entry it belongs to.", owner = "run", resolves = "concept" }
removable-value = { gloss = "A value a policy would strip, which reaches the journal under no ordering.", owner = "run", resolves = "concept" }
journaling-opt-out = { gloss = "A source's declaration that its pulls are not recorded.", owner = "run", resolves = "code" }
redacting-source = { gloss = "A pipeline pairing write-path redaction with a source that journals its pulls.", owner = "run", resolves = "concept" }
escape-hatch = { gloss = "The two greppable ways to skip recording, each carrying an idempotency argument.", owner = "run", resolves = "code" }
substrate-port = { gloss = "The one interface the run-path substrate is reached through.", owner = "run", resolves = "code" }
plan-pin = { gloss = "The content-hashed plan reference a run resolves for the whole of its life.", owner = "run", resolves = "code" }
unwired-capability = { gloss = "A capability the running profile links no implementation for.", owner = "run", resolves = "concept" }
rebuild-survival = { gloss = "Journal rows and execution ownership passing through a catalog rebuild unchanged.", owner = "run", resolves = "concept" }

# --- advance ---
cursor-kind = { gloss = "One of monotonic, opaque-token or snapshot-id, declared by the source.", owner = "run", resolves = "code" }
concurrency-by-kind = { gloss = "The rule that a position's kind, not the executor, decides how many writers move it.", owner = "run", resolves = "concept" }
no-last-write-wins = { gloss = "The absence of recency resolution over any cursor of any kind.", owner = "run", resolves = "concept" }
engine-owned = { gloss = "A connector committing its position through the engine rather than a state file.", owner = "run", resolves = "concept" }
advance-after-write = { gloss = "Committing a position only behind the durable write of the batch it covers.", owner = "run", resolves = "concept" }
cursor-bytes = { gloss = "The opaque bytes a connector owns as its position, verbatim in the catalog.", owner = "run", resolves = "code" }
inclusive-boundary = { gloss = "Admitting a row whose clock field is newer than or equal to the stored position.", owner = "run", resolves = "concept" }
declared-key-required = { gloss = "The destination-side key that makes a re-landed boundary instant idempotent.", owner = "run", resolves = "concept" }
watermark-serialization = { gloss = "The field-and-value JSON a monotonic position serializes as.", owner = "run", resolves = "code" }
field-rename = { gloss = "A stored position measured against a column the manifest no longer declares.", owner = "run", resolves = "concept" }
frontier-never-rewinds = { gloss = "A committed position moving forward or holding, counting every fetched row.", owner = "run", resolves = "concept" }
unorderable-position = { gloss = "A clock value with no ordering, or a stream switching position types mid-pass.", owner = "run", resolves = "concept" }
turning-incremental-on = { gloss = "Enabling incremental reading over a pipeline that already holds a position.", owner = "run", resolves = "concept" }
skip-unchanged = { gloss = "A snapshot source's content-digest cursor that returns zero batches on an unchanged input.", owner = "run", resolves = "code" }
digest-scope = { gloss = "The raw input bytes the skip digest covers, and nothing beyond them.", owner = "run", resolves = "concept" }
zero-row-commit = { gloss = "A commit landing nothing, which adds nothing and replaces nothing.", owner = "run", resolves = "concept" }

# --- suspend ---
awakeable-token = { gloss = "The opaque single-use token an external party posts back to resume a run.", owner = "run", resolves = "code" }
resume-is-a-step-output = { gloss = "A resume payload written as the awaited step's journal output.", owner = "run", resolves = "concept" }
deadline = { gloss = "The creation instant plus a time-to-live, both supplied by the caller.", owner = "run", resolves = "code" }
timeout-is-sticky = { gloss = "A persisted expiry transition that an earlier instant cannot read back as pending.", owner = "run", resolves = "concept" }
idempotent-resolution = { gloss = "A repeated resolution with an identical payload returning the written value.", owner = "run", resolves = "concept" }
conflicting-resolution = { gloss = "A second resolution carrying a payload different from the written one.", owner = "run", resolves = "concept" }
expired-token = { gloss = "A token whose deadline passed before a resolution arrived.", owner = "run", resolves = "concept" }
unknown-token = { gloss = "A token string with no registry row behind it.", owner = "run", resolves = "concept" }
resume-route = { gloss = "The HTTP surface that resumes and inspects a suspension.", owner = "run", resolves = "code" }
payload-offload = { gloss = "A resume payload above the inline cutoff referencing the shared blob store.", owner = "run", resolves = "concept" }
registry-survives-restart = { gloss = "Pending suspensions persisting in the catalog across a process restart.", owner = "run", resolves = "concept" }

# --- retry ---
failure-taxonomy = { gloss = "The one tagged failure type crossing every port and both halves of the engine.", owner = "run", resolves = "code" }
branch-by-tag = { gloss = "Pattern-matching a failure's tag rather than a discriminant or a message substring.", owner = "run", resolves = "concept" }
schedule = { gloss = "The backoff shape, attempt count, delay clamp and jitter ceiling attached to a step.", owner = "run", resolves = "code" }
default-policy = { gloss = "The schedule a step inherits when it declares none of its own.", owner = "run", resolves = "concept" }
single-attempt = { gloss = "The no-retry schedule, where one failure closes the step.", owner = "run", resolves = "concept" }
retryable-classes = { gloss = "The failure tags a schedule carries through a delay rather than terminating on.", owner = "run", resolves = "concept" }
permanent-failure = { gloss = "A failure that closes its step whatever attempt budget remains.", owner = "run", resolves = "concept" }
deterministic-verdict = { gloss = "A refusal pure over static input, terminal and outside the attempt budget.", owner = "run", resolves = "concept" }
retry-after-verbatim = { gloss = "An upstream's stated delay honored unclamped by the local schedule.", owner = "run", resolves = "concept" }
decision-is-pure = { gloss = "The retry decision as a function of attempt number and classified failure alone.", owner = "run", resolves = "code" }
runner-owns-the-timer = { gloss = "The runner turning a returned duration into the actual sleep.", owner = "run", resolves = "concept" }
idempotent-attempt = { gloss = "A successful attempt's write under the step key that blocks a double-fire.", owner = "run", resolves = "concept" }
step-declaration = { gloss = "A step's own maximum attempt count plus the tags it retries on.", owner = "run", resolves = "code" }
partial-failure = { gloss = "A run that wrote some of its batches and then failed, naming how many landed.", owner = "run", resolves = "code" }
pressure-is-local = { gloss = "Rate-limit pacing confined to the source that produced it.", owner = "run", resolves = "concept" }
bound-hit-is-transient = { gloss = "A connector striking a declared resource bound answering as a transient failure.", owner = "run", resolves = "concept" }

# --- own ---
execution-owner = { gloss = "The durable owner one live table or backfill chunk holds while work is pending.", owner = "run", resolves = "code" }
execution-id-keys-the-journal = { gloss = "Recorded work keying on the execution id rather than on an attempt's run id.", owner = "run", resolves = "concept" }
retirement-is-atomic = { gloss = "Position publication and owner retirement sharing one catalog transaction.", owner = "run", resolves = "concept" }
pinned-plan-changed = { gloss = "A connector identity, component world or plan hash moving under a pending owner.", owner = "run", resolves = "concept" }
pin-recovery = { gloss = "Restoring the recorded build and resuming, or rewinding the chunk explicitly.", owner = "run", resolves = "concept" }
scope-independence = { gloss = "One scope's completion releasing nothing another scope's unfinished work holds.", owner = "run", resolves = "concept" }
pin-release = { gloss = "The exhaustive split of terminal statuses into those that free a pin and those that hold it.", owner = "run", resolves = "concept" }
admission-pin = { gloss = "The connector identity a run records when it opens, which replay resolves against.", owner = "run", resolves = "code" }
no-hot-reload = { gloss = "The refusal to re-resolve a connector while a journaled run is live.", owner = "run", resolves = "concept" }
run-concurrency = { gloss = "One run as one asynchronous task, with parallelism only across declared partitions.", owner = "run", resolves = "concept" }
backpressure = { gloss = "The runner pulling from a source's stream, with no unbounded buffer between them.", owner = "run", resolves = "concept" }
schema-evolution = { gloss = "Additive columns and widening promotions accepted while a run is in flight.", owner = "run", resolves = "concept" }
one-snapshot-per-run = { gloss = "One run producing one atomic snapshot and, on a crash, partial parts under its own directory.", owner = "run", resolves = "concept" }
data-flow = { gloss = "The order one run touches durable state, from open to terminal status.", owner = "run", resolves = "concept" }

# --- cancel ---
catalog-channel = { gloss = "The run row as the channel a stop travels on between two processes.", owner = "run", resolves = "code" }
two-grains = { gloss = "The run scope and the pipeline scope a stop names.", owner = "run", resolves = "code" }
poll-interval = { gloss = "The cadence at which a pull in flight reads the cancellation columns.", owner = "run", resolves = "concept" }
standing-request-is-seen = { gloss = "A request already in the catalog observed on the race's first tick.", owner = "run", resolves = "concept" }
land-path-uncut = { gloss = "The absence of a stop check once bytes are home.", owner = "run", resolves = "concept" }
abandoned-pull = { gloss = "A pull dropped mid-await, surfacing as a typed failure rather than a dropped future.", owner = "run", resolves = "concept" }
storage-blip = { gloss = "A failing cancellation poll that warns and keeps polling.", owner = "run", resolves = "concept" }
terminal-run = { gloss = "A run past its terminal status, which accepts no cancellation mark.", owner = "run", resolves = "concept" }
re-mark = { gloss = "A second stop overwriting the first on the same row.", owner = "run", resolves = "concept" }
distinct-terminal-status = { gloss = "Cancellation as its own terminal status, apart from failure.", owner = "run", resolves = "code" }
resumable-remains = { gloss = "What a stopped run leaves behind — its owner, its chunk state, its unmoved position.", owner = "run", resolves = "concept" }
authority-from-the-record = { gloss = "Reading the pipeline a stop authorizes against off the run record.", owner = "run", resolves = "concept" }

# --- record ---
reserved-table = { gloss = "The run record as a reserved store table of two append-only rows per run.", owner = "run", resolves = "code" }
columns = { gloss = "The field set a run row carries.", owner = "run", resolves = "code" }
status-set = { gloss = "The six statuses a run row takes, in flight and terminal.", owner = "run", resolves = "code" }
row-at-open = { gloss = "The row written before the first pull, which tells three silences apart.", owner = "run", resolves = "concept" }
time-travel = { gloss = "Run history inheriting the transaction-time bound like any other table.", owner = "run", resolves = "concept" }
abandoned-is-a-reading = { gloss = "Running and abandoned as readings of the rows rather than a heartbeat mechanism.", owner = "run", resolves = "concept" }
writing-site = { gloss = "The engine-injected provenance column naming which site produced a row.", owner = "run", resolves = "code" }
site-id-length = { gloss = "The character bound a site id holds, being interpolated into paths and filenames.", owner = "run", resolves = "concept" }
site-id-unresolved = { gloss = "A site id with no source bound, or with two sources declared.", owner = "run", resolves = "concept" }
history-window = { gloss = "The inclusive start bound plus row ceiling a history read is answered under.", owner = "run", resolves = "code" }
describe-window = { gloss = "The default and clamped ceilings the describe surface answers history with.", owner = "run", resolves = "concept" }
bound-spelling = { gloss = "The two accepted spellings of a history window's lower bound.", owner = "run", resolves = "concept" }
truncation-flag = { gloss = "The echoed window and clipped marker that separate a clipped page from a quiet week.", owner = "run", resolves = "code" }
empty-window = { gloss = "A window matching no runs, answered empty rather than as an error.", owner = "run", resolves = "concept" }
history-export = { gloss = "The process listing and NDJSON export that carry history off the machine.", owner = "run", resolves = "code" }
export-ceiling = { gloss = "The default and clamped row ceilings the export answers under.", owner = "run", resolves = "concept" }
error-cap = { gloss = "The masked, size-capped rendering of a recorded run error on the shared projection.", owner = "run", resolves = "concept" }
failure-publishes = { gloss = "The bucket push running on the failure arm so a failure row leaves its machine.", owner = "run", resolves = "concept" }
orphan-reap = { gloss = "The startup sweep that marks rows abandoned by a dead process.", owner = "run", resolves = "concept" }
per-table-accounting = { gloss = "A failed table's own row, events and position, identical under either fire policy.", owner = "run", resolves = "concept" }
byte-and-row-counts = { gloss = "The landed rows and bytes a run row reports, counted at the destination.", owner = "run", resolves = "code" }

# --- project ---
best-effort = { gloss = "Live run state as a projection that gates no execution and may lag or drop.", owner = "run", resolves = "concept" }
snapshot = { gloss = "The wire shape one fold of a run's events produces.", owner = "run", resolves = "code" }
step-view = { gloss = "One step's entry inside a run snapshot.", owner = "run", resolves = "code" }
wire-status = { gloss = "The run and step status unions the projection serializes.", owner = "run", resolves = "code" }
cancelled-step-view = { gloss = "A stopped run's executing step reported as failed carrying a cancelled tag.", owner = "run", resolves = "concept" }
emission-never-blocks = { gloss = "Progress handed to a bounded drop-on-full channel after the durable write.", owner = "run", resolves = "concept" }
coalescing = { gloss = "The window broadcasts collapse into, with a terminal transition flushing immediately.", owner = "run", resolves = "concept" }
metadata-size = { gloss = "The serialized bound application metadata on a snapshot holds.", owner = "run", resolves = "concept" }
oversized-metadata = { gloss = "A metadata write past the bound, rejected rather than clipped.", owner = "run", resolves = "concept" }
version-monotonic = { gloss = "The per-fold counter a client uses to discard reordered or stale deltas.", owner = "run", resolves = "code" }
reducer-is-total = { gloss = "The fold that ignores backward and stale deltas rather than corrupting on them.", owner = "run", resolves = "code" }
outputs-by-reference = { gloss = "A step output carried as a post-redaction reference and a byte count.", owner = "run", resolves = "concept" }
connect = { gloss = "Handing a subscriber its snapshot and its receiver under one lock.", owner = "run", resolves = "code" }
broadcast-ring = { gloss = "The per-run buffer an overrunning subscriber resynchronizes past.", owner = "run", resolves = "code" }
unauthenticated-upgrade = { gloss = "A stream request carrying no valid credential at the pre-upgrade check.", owner = "run", resolves = "concept" }
read-only-socket = { gloss = "A subscription connection that mutates nothing about the run it watches.", owner = "run", resolves = "concept" }
restart-discards = { gloss = "In-memory snapshots lost on restart, with the durable record as the recoverable half.", owner = "run", resolves = "concept" }
one-writer = { gloss = "One ordering authority over a run's projection, delegated steps included.", owner = "run", resolves = "concept" }

[error]
BlobMissing = { gloss = "A journal row's blob reference resolves to no file.", owner = "run" }
JournalRedactionConflict = { gloss = "Write-path redaction declared over a source whose pulls are journaled.", owner = "run" }
CapabilityUnwired = { gloss = "A caller reached for a capability the running profile links no implementation for.", owner = "run" }
CursorFieldMismatch = { gloss = "A stored position's field name differs from the declared incremental field.", owner = "run" }
CursorPositionUnorderable = { gloss = "A clock value with no ordering, or a position type that changed mid-pass.", owner = "run" }
AwakeableAlreadyResolved = { gloss = "A second resolution carried a payload different from the written one.", owner = "run" }
AwakeableTimedOut = { gloss = "A resolution arrived past the suspension's deadline.", owner = "run" }
AwakeableUnknown = { gloss = "A resume token with no registry row behind it.", owner = "run" }
StepFailed = { gloss = "A step closed on a terminal failure, carrying its label and the underlying tag.", owner = "run" }
ExecutionPinMismatch = { gloss = "A connector identity, component world or plan hash moved under a pending execution owner.", owner = "run" }
Canceled = { gloss = "Work abandoned on a standing stop request; also the terminal run status.", owner = "run" }
CancelTargetNotInFlight = { gloss = "A stop matched no running or pending run row.", owner = "run" }
SiteIdUnresolved = { gloss = "A site id has no bound source, or declares two.", owner = "run" }
HistoryBoundSpelling = { gloss = "A history window bound spelled outside the two accepted forms.", owner = "run" }
RunMetadataTooLarge = { gloss = "A snapshot metadata write exceeded the serialized bound.", owner = "run" }
RunStreamUnauthorized = { gloss = "A run-stream request presented no valid credential before the upgrade.", owner = "run" }
Transient = { gloss = "A failure a further attempt may clear.", owner = "run" }
Permanent = { gloss = "A failure no further attempt clears.", owner = "run" }
SchemaIncompatible = { gloss = "An incoming schema change neither additive nor a widening promotion.", owner = "run" }
AuthExpired = { gloss = "A credential the upstream rejected as expired.", owner = "run" }
RateLimited = { gloss = "An upstream throttle, carrying the delay it asked for.", owner = "run" }
Config = { gloss = "A declaration the engine read and could not act on.", owner = "run" }
Storage = { gloss = "A durable-storage operation that did not complete.", owner = "run" }
UnknownConnector = { gloss = "A connector name that resolves to nothing installed.", owner = "run" }
SecretNotFound = { gloss = "A credential reference that resolved to no value.", owner = "run" }

[limit]
journal-inline-cutoff = { value = 1, unit = "MiB", owner = "run.journal.limit.inline-cutoff", gloss = "Largest journaled value held inline in its own row." }
retry-base-delay = { value = 100, unit = "ms", owner = "run.retry.limit.default-policy", gloss = "First delay of the default exponential schedule." }
retry-max-delay = { value = 30, unit = "s", owner = "run.retry.limit.default-policy", gloss = "Clamp on any single computed retry delay." }
retry-default-attempts = { value = 5, unit = "attempts", owner = "run.retry.limit.default-policy", gloss = "Total attempts the default schedule allows, the first included." }
retry-single-attempt = { value = 1, unit = "attempts", owner = "run.retry.limit.single-attempt", gloss = "Total attempts of the no-retry schedule." }
cancel-poll-interval = { value = 500, unit = "ms", owner = "run.cancel.limit.poll-interval", gloss = "Cadence at which a pull in flight reads the cancellation columns." }
site-id-min-length = { value = 1, unit = "chars", owner = "run.record.limit.site-id-length", gloss = "Shortest accepted site id." }
site-id-max-length = { value = 64, unit = "chars", owner = "run.record.limit.site-id-length", gloss = "Longest accepted site id." }
describe-history-default = { value = 5, unit = "rows", owner = "run.record.limit.describe-window", gloss = "Runs the describe surface answers with when the caller names no ceiling." }
describe-history-ceiling = { value = 500, unit = "rows", owner = "run.record.limit.describe-window", gloss = "Highest ceiling the describe surface honors." }
export-history-default = { value = 500, unit = "rows", owner = "run.record.limit.export-ceiling", gloss = "Runs the export answers with when the caller names no ceiling." }
export-history-ceiling = { value = 5000, unit = "rows", owner = "run.record.limit.export-ceiling", gloss = "Highest ceiling the export honors, applied per pipeline before the merge." }
run-error-cap = { value = 2, unit = "KiB", owner = "run.record.limit.error-cap", gloss = "Size a recorded run error is clipped to on the shared projection." }
projection-coalesce-window = { value = 100, unit = "ms", owner = "run.project.limit.coalescing", gloss = "Window snapshot broadcasts collapse into." }
run-metadata-bytes = { value = 16384, unit = "B", owner = "run.project.limit.metadata-size", gloss = "Serialized bound on application metadata attached to a run snapshot." }
broadcast-ring-entries = { value = 256, unit = "entries", owner = "run.project.limit.broadcast-ring", gloss = "Snapshots the per-run broadcast buffer holds before a subscriber resynchronizes." }
