# Registry fragment — the `corpus` contract.
# Operations, subjects, error identifiers and named bounds asserted by
# spec/00-corpus.md.

[operation]
address   = { gloss = "The four coordinates of a clause id and what makes each one legal.", file = "spec/00-corpus.md", aliases = ["addressing", "clause-address"] }
anatomy   = { gloss = "The heading order every contract file carries, and the binding between an operation and the clauses constraining it.", file = "spec/00-corpus.md", aliases = ["file-shape"] }
registry  = { gloss = "Registration of a spelling, and the collision test that refuses a near-synonym.", file = "spec/00-corpus.md", aliases = ["registration", "vocabulary"] }
reference = { gloss = "The one legal way a file reaches a fact another file owns.", file = "spec/00-corpus.md", aliases = ["transclude", "cross-reference"] }
rationale = { gloss = "Where an argument lives, and what a specification sentence is forbidden to contain.", file = "spec/00-corpus.md", aliases = ["argument"] }
state     = { gloss = "How performed, committed and broken are computed rather than written.", file = "spec/00-corpus.md", aliases = ["status", "build-state"] }
render    = { gloss = "The generated tree, and the equality that keeps it honest.", file = "spec/00-corpus.md", aliases = ["generate", "extract"] }

[term]
clause-id       = { gloss = "Four dot-separated segments addressing one normative sentence.", owner = "corpus", resolves = "code" }
contract-file   = { gloss = "A spec file carrying the standard anatomy and one contract's clauses.", owner = "corpus", resolves = "concept" }
kind            = { gloss = "The third segment: invariant, refusal, limit, shape, interface or workflow.", owner = "corpus", resolves = "code" }
decided-by      = { gloss = "The clause-table column naming the record that settles a refusal's direction.", owner = "corpus", resolves = "code" }
transclusion    = { gloss = "The generated second appearance of a fact, written `{{clause-id}}`.", owner = "corpus", resolves = "code" }
pointer         = { gloss = "A sentence naming an owning section and one local consequence, carrying no numeral, error identifier or modal.", owner = "corpus", resolves = "concept" }
unsettled       = { gloss = "An inline line recording an unknown, carrying a question, an owner and an affected operation.", owner = "corpus", resolves = "code" }
pin             = { gloss = "The mapping from a clause id to the one artifact demonstrating it.", owner = "corpus", resolves = "code" }
coverage-floor  = { gloss = "The machine-maintained pinned-clause count per contract that a live count may not fall below.", owner = "corpus", resolves = "code" }
shingle         = { gloss = "An n-gram over normalized statement text, used to detect a restatement.", owner = "corpus", resolves = "concept" }
scope-entry     = { gloss = "The record in scope.toml giving a check its globs and its exemptions.", owner = "corpus", resolves = "code" }
role            = { gloss = "A path's classification: contract, registry, generated, record or plan.", owner = "corpus", resolves = "code" }

[error]
SpecDuplicateId        = { gloss = "A clause id extracted from two locations.", owner = "corpus" }
SpecRetiredId          = { gloss = "A clause id reused after retirement.", owner = "corpus" }
SpecOwnsConflict       = { gloss = "An operation claimed twice, claimed by none, or addressed from the wrong file.", owner = "corpus" }
SpecSpellingCollision  = { gloss = "A proposed spelling normalizing onto an existing canonical or alias.", owner = "corpus" }
SpecAliasUsed          = { gloss = "A statement written in a refused alias spelling.", owner = "corpus" }
SpecUnmeasuredLimit    = { gloss = "A limit clause with no numeral, no registered unit, or a numeral spelled as a word.", owner = "corpus" }
SpecUnnamedRefusal     = { gloss = "A refusal clause naming no registered error identifier.", owner = "corpus" }
SpecForeignAssertion   = { gloss = "A clause asserting something about a term another contract owns.", owner = "corpus" }
SpecRestatement        = { gloss = "Two authored statements sharing an 8-gram.", owner = "corpus" }
SpecDanglingReference  = { gloss = "A transclusion or term link resolving to nothing.", owner = "corpus" }
SpecRationaleLeak      = { gloss = "An argument in a contract file.", owner = "corpus" }
SpecStrayModal         = { gloss = "A normative modal outside a clause cell.", owner = "corpus" }
SpecOrphanRecord       = { gloss = "A decision record no clause cites, or one spanning more than two contracts.", owner = "corpus" }
SpecAppendixHeading    = { gloss = "An Open questions, Out of scope or See also heading.", owner = "corpus" }
SpecBrokenPin          = { gloss = "A pin that does not resolve, or whose clause names a code term the tree no longer defines.", owner = "corpus" }
SpecPresencePinOnBound = { gloss = "A type-path pin on a refusal or limit clause.", owner = "corpus" }
SpecCoverageRegression = { gloss = "A live pinned count below its contract's floor.", owner = "corpus" }
SpecDatedProse         = { gloss = "A build-state word, a date or a milestone token in authored text.", owner = "corpus" }
SpecStaleRender        = { gloss = "A regenerated tree differing from the committed one.", owner = "corpus" }
SpecBannedNoun         = { gloss = "A banned noun in authored text.", owner = "corpus" }
SpecProvenanceLeak     = { gloss = "A bare issue reference or a pull-request link.", owner = "corpus" }
SpecLocalPath          = { gloss = "An absolute path from an author's machine.", owner = "corpus" }
SpecOperatorTable      = { gloss = "A sign-off or operations action-item table inside the corpus.", owner = "corpus" }
SpecAsciiDiagram       = { gloss = "Box-drawing or pipe-and-dash art outside a mermaid fence.", owner = "corpus" }

[limit]
contract-file-lines = { value = 900, unit = "rows", owner = "corpus.anatomy.limit.file-length", gloss = "The line ceiling on a file whose role is contract." }
restatement-gram    = { value = 8, unit = "tokens", owner = "corpus.reference.refusal.restated-sentence", gloss = "The n-gram width at which two statements count as a restatement." }
