# Registry fragment — the `build` contract.
# Engineering conventions, gates and the quality harness, in `spec/61-engineering.md`.

[operation]
structure-tree = { gloss = "Where a capability lives, what a surface calls, when an adapter stands in for a call, and who owns control-plane state.", file = "spec/61-engineering.md", aliases = ["single-home", "dry"] }
automate = { gloss = "Typed subcommands over compiled binaries, the boundary shell keeps, and the tree's record of an operator credential.", file = "spec/61-engineering.md", aliases = ["orchestrate", "script"] }
test = { gloss = "Assertion construction, guard validation, and where a suite compiles and runs.", file = "spec/61-engineering.md", aliases = ["assert"] }
build = { gloss = "Target directories, engine-linked cargo invocations, linked query functions, and debug information.", file = "spec/61-engineering.md", aliases = ["target-dir"] }
gate = { gloss = "Stage order, the container's four resources, the disk and footprint steps, and the proof and surface stages.", file = "spec/61-engineering.md", aliases = ["check-in"] }
evaluate = { gloss = "The read-path quality harness: the case format, the deterministic metrics, the judged dimensions and the grounded reader.", file = "spec/61-engineering.md", aliases = ["measure", "score"] }
baseline = { gloss = "Holding a run against committed thresholds, golden custody, case generation, and the anti-gaming rules.", file = "spec/61-engineering.md", aliases = ["threshold"] }

