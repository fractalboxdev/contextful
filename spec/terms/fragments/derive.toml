DeriveUnredactedError       = { gloss = "A `last_error` value was written without passing address redaction.", owner = "derive" }
DerivePrimaryKeyMissing     = { gloss = "A derive output table declared no unit-and-sequence key pair.", owner = "derive" }
DeriveCueOutOfOrder         = { gloss = "A caption block starts before the block already accepted.", owner = "derive" }
DeriveTestEngineUnsupported = { gloss = "The single-file verb was handed a driver it does not exercise.", owner = "derive" }

# ---------------------------------------------------------------------------
# Named bounds — one entry per limit clause, one clause per entry.
# ---------------------------------------------------------------------------

[limit]
derive-rows-per-run        = { value = 25,      unit = "rows",     owner = "derive.select.limit.rows-per-run",              gloss = "Units one derive run attempts, after the anti-join truncates the outstanding list." }
derive-attempts-per-unit   = { value = 3,       unit = "attempts", owner = "derive.select.limit.attempts-per-unit",         gloss = "Attempts one unit receives before its marker settles." }
derive-seconds-per-run     = { value = 300,     unit = "s",        owner = "derive.select.limit.seconds-per-run",           gloss = "Wall clock the serial unit loop holds for a socket-opening task." }
derive-upstream-excerpt    = { value = 4,       unit = "KiB",      owner = "derive.bind.limit.upstream-excerpt",            gloss = "Vendor response text an upstream error carries back." }
derive-chain-deadline      = { value = 1800,    unit = "s",        owner = "derive.exec.limit.chain-deadline",              gloss = "Wall clock one unit's whole subprocess chain runs for." }
derive-step-output         = { value = 8,       unit = "MiB",      owner = "derive.exec.limit.step-output",                 gloss = "Captured output one chain step may produce." }
derive-audit-entries       = { value = 64,      unit = "entries",  owner = "derive.exec.limit.audit-entries",               gloss = "Captured step-output entries one chain contributes to the run record." }
derive-step-error-excerpt  = { value = 4,       unit = "KiB",      owner = "derive.exec.limit.step-error-excerpt",          gloss = "Error text a failing step carries inside its typed error." }
derive-engine-id-prefix    = { value = 12,      unit = "chars",    owner = "derive.exec.limit.engine-id-prefix",            gloss = "Hexadecimal characters of digest inside an exec engine identifier." }
derive-redirect-chain      = { value = 5,       unit = "hops",     owner = "derive.fetch.limit.redirect-chain",             gloss = "Redirect hops one fetch follows." }
derive-document-prefix     = { value = 1,       unit = "MiB",      owner = "derive.fetch.limit.document-prefix",            gloss = "Document prefix the head scanner reads before the remainder is dropped." }
derive-probe-prefix        = { value = 64,      unit = "KiB",      owner = "derive.fetch.limit.probe-prefix",               gloss = "Bytes one range request against a picture candidate reads." }
derive-hop-timeout         = { value = 20,      unit = "s",        owner = "derive.fetch.limit.hop-timeout",                gloss = "Wall clock one fetch hop holds." }
derive-retry-after-default = { value = 60,      unit = "s",        owner = "derive.fetch.limit.retry-after-default",        gloss = "Rate-limit wait used when a response supplies no usable header." }
derive-empty-ceiling       = { value = 1,       unit = "attempts", owner = "derive.land.limit.empty-attempt-ceiling",       gloss = "Attempts a unit in the established-empty status receives in total." }
derive-passage-chars       = { value = 600,     unit = "chars",    owner = "derive.parse-cues.limit.passage-chars",         gloss = "Character length at which an open passage closes." }
derive-passage-span        = { value = 60,      unit = "s",        owner = "derive.parse-cues.limit.passage-span",          gloss = "Elapsed span at which an open passage closes." }
derive-passage-bytes       = { value = 8,       unit = "KiB",      owner = "derive.parse-cues.limit.passage-bytes",         gloss = "Text one passage holds." }
derive-passages-per-doc    = { value = 2000,    unit = "rows",     owner = "derive.parse-cues.limit.passages-per-document", gloss = "Passages one caption document yields." }
