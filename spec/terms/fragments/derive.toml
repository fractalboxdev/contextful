# Registry fragment — the derive tier. Every clause id in spec/34-derive.md
# resolves its second and fourth segments here, and every refusal and limit it
# asserts is registered below.

[operation]
select      = { gloss = "Turning a landed table into the outstanding unit list: the declared configuration, the anti-join, eligibility and a run's budget.", file = "spec/34-derive.md", aliases = ["scan", "work-set"] }
bind        = { gloss = "Where an engine's definition lives and what the port every engine implements hands back.", file = "spec/34-derive.md", aliases = ["engine-binding"] }
exec        = { gloss = "Running operator-declared argv chains against binaries installed on this machine, under one deadline and one process group.", file = "spec/34-derive.md", aliases = ["subprocess-chain"] }
fetch       = { gloss = "Following an address a third party wrote into a row, under an operator host list and pre-socket guards.", file = "spec/34-derive.md", aliases = ["link-fetch"] }
land        = { gloss = "The derived row and the marker: columns, the status union, attempt accounting, citation keys and provenance.", file = "spec/34-derive.md", aliases = ["derived-row"] }
parse-cues  = { gloss = "Reading a caption document into passages: one grammar for two formats, defect accounting, coalescing and rolling display.", file = "spec/34-derive.md", aliases = ["cue-parsing"] }
test-engine = { gloss = "Building one engine outside a pipeline and running it against a single file on disk.", file = "spec/34-derive.md", aliases = ["derive-test"] }

