# Registry fragment — contract `secret`, spec/33-secrets.md.

[operation]
reference = { gloss = "Naming an outbound credential: the two credential planes, the `secret://` scheme, and the value template with its parse errors.", file = "spec/33-secrets.md", aliases = ["naming", "binding"] }
resolve   = { gloss = "Turning a reference into material: the provider port, the assembled chain and its precedence, hydration timing, the redacting wrapper, and the decoupling postures.", file = "spec/33-secrets.md", aliases = ["hydrate", "hydration"] }
lease     = { gloss = "The declaration-scoped lease provider at the head of the chain: its mint endpoint, its expiry and retirement margin, its failure classes, and its non-recursive bootstrap.", file = "spec/33-secrets.md", aliases = ["mint"] }
attach    = { gloss = "Host mediation of an outbound request: the one bound host, the header template, redirect and landed-origin pinning, and URL scrubbing.", file = "spec/33-secrets.md", aliases = ["mediate"] }
rotate    = { gloss = "Credential turnover: the division of labor on refresh, the four rotation mechanisms, and the know-how a backend does not hold.", file = "spec/33-secrets.md", aliases = ["refresh", "turnover"] }
record    = { gloss = "The operator record of a credential — grants, covered scope, creation date, expiry, rotation location — and the provider attribution a run emits.", file = "spec/33-secrets.md", aliases = ["document"] }

[term]
credential-plane        = { gloss = "One of the two separated planes: outbound credentials that reach a vendor, and the admission of a caller into a store.", owner = "secret", resolves = "concept" }
secret-reference        = { gloss = "`secret://<name>` — a stable logical name a resolver maps onto a backend location.", owner = "secret", resolves = "code" }
logical-name            = { gloss = "The `[a-z0-9-]+` name that joins a declaration, a provider entry, a cache key, a record and a run's attribution.", owner = "secret", resolves = "code" }
value-template          = { gloss = "Literal text carrying `${secret://<name>}` placeholders, hydrated before a request is built.", owner = "secret", resolves = "code" }
whole-value-binding     = { gloss = "`env://NAME` — a binding whose entire value is the credential, outside the template grammar.", owner = "secret", resolves = "code" }
provider-port           = { gloss = "The single port every credential backend implements as an adapter.", owner = "secret", resolves = "code" }
provider-chain          = { gloss = "The assembled adapter order a reference walks, first hit wins.", owner = "secret", resolves = "concept" }
secrets-backend         = { gloss = "`CONTEXTFUL_SECRETS_BACKEND` — the environment read selecting which adapters the chain assembles.", owner = "secret", resolves = "code" }
redacting-wrapper       = { gloss = "The carrier whose debug and display forms print a fixed sentinel, revealing bytes at the attachment point alone.", owner = "secret", resolves = "code" }
decoupling-posture      = { gloss = "One of the four distances between material and the engine process, from inline environment to a secretless broker sidecar.", owner = "secret", resolves = "concept" }
broker-sidecar          = { gloss = "A component that attaches a credential inside the customer boundary, so plaintext never enters the engine process.", owner = "secret", resolves = "concept" }
lease                   = { gloss = "Credential material plus one expiry, minted per declared scope and held in memory for the run.", owner = "secret", resolves = "code" }
lease-scope             = { gloss = "The scope string a mint request carries, declared per logical name in `CONTEXTFUL_LEASE_SCOPES`.", owner = "secret", resolves = "code" }
lease-scopes            = { gloss = "`CONTEXTFUL_LEASE_SCOPES` — the environment read listing which logical names hydrate as leases.", owner = "secret", resolves = "code" }
mint-credential         = { gloss = "The standing credential the engine presents at the lease endpoint, scoped to minting and granting no vendor access.", owner = "secret", resolves = "concept" }
bootstrap-backend       = { gloss = "`CONTEXTFUL_LEASE_BOOTSTRAP_BACKEND` — the environment read composing a manager behind the lease provider for the mint reference.", owner = "secret", resolves = "code" }
retirement-margin       = { gloss = "The interval a cached lease is dropped ahead of nominal expiry.", owner = "secret", resolves = "concept" }
attach-block            = { gloss = "`[attach]` — a header-name to value-template map the host hydrates and writes onto a permitted request.", owner = "secret", resolves = "code" }
bound-host              = { gloss = "The one exact, non-wildcard host a source binding a credential declares, judged at validation and again at session open.", owner = "secret", resolves = "concept" }
redirect-pinning        = { gloss = "Following a hop only to the configured host and port on the same transport or a stronger one.", owner = "secret", resolves = "concept" }
landed-origin           = { gloss = "The origin that answered the request whose body lands in a column.", owner = "secret", resolves = "concept" }
url-scrubbing           = { gloss = "Reducing a URL to scheme, host, port and path before a diagnostic, a log line or a column receives it.", owner = "secret", resolves = "concept" }
sensitive-header        = { gloss = "A header whose value hydrates from a reference, recorded by name in the run and refused against a cleartext endpoint.", owner = "secret", resolves = "code" }
credential-backend      = { gloss = "An adapter holding opaque versioned ciphertext under a logical name, carrying no provider know-how.", owner = "secret", resolves = "concept" }
operator-record         = { gloss = "The plaintext comment above an encrypted entry, stating grants, covered scope, creation date, expiry and rotation location.", owner = "secret", resolves = "concept" }
provider-attribution    = { gloss = "The run-audit statement of which adapter answered each reference, by logical name and adapter.", owner = "secret", resolves = "code" }
secrets-allow-env-templates = { gloss = "`CONTEXTFUL_SECRETS_ALLOW_ENV_TEMPLATES` — the environment read re-admitting the environment provider to template hydration.", owner = "secret", resolves = "code" }

[error]
SecretForeignPlaceholder       = { gloss = "A template carries `${env://NAME}` or a bare `${NAME}`.", owner = "secret" }
SecretMalformedTemplate        = { gloss = "A placeholder is unclosed, empty or nested.", owner = "secret" }
SecretUnresolvedReference      = { gloss = "No assembled adapter answers the logical name.", owner = "secret" }
SecretMaterialInDeclaration    = { gloss = "A credential-shaped literal stands where a reference belongs.", owner = "secret" }
SecretInlineCredential         = { gloss = "A profile other than development binds plaintext material at a call site.", owner = "secret" }
SecretForwardingBroker         = { gloss = "A sidecar reads a stored long-lived credential and forwards it outward.", owner = "secret" }
SecretProviderKnowHowInBackend = { gloss = "An adapter exposes a provider-specific exchange, refresh or lifetime entry point.", owner = "secret" }
SecretLeaseShadowed            = { gloss = "An adapter behind the lease provider also answers a declared leased name.", owner = "secret" }
SecretLeaseScopesEmpty         = { gloss = "The lease backend is selected with no scope declared.", owner = "secret" }
SecretMalformedLease           = { gloss = "A lease carries no declared expiry, or an expiry already past on arrival.", owner = "secret" }
SecretLeaseScopeUnknown        = { gloss = "The mint endpoint answers `404` for a declared scope.", owner = "secret" }
SecretMintRejected             = { gloss = "The mint endpoint answers `401` or `403`; the mint credential is revoked.", owner = "secret" }
SecretLeaseRequestRejected     = { gloss = "The mint endpoint answers a `4xx` other than 401, 403, 404 or 429.", owner = "secret" }
SecretLeaseRedirect            = { gloss = "The mint endpoint answers a redirect.", owner = "secret" }
SecretBootstrapUnresolved      = { gloss = "No adapter behind the lease provider answers the bootstrap reference.", owner = "secret" }
SecretBootstrapLeased          = { gloss = "The bootstrap name appears among the declared lease scopes.", owner = "secret" }
SecretWildcardHost             = { gloss = "A wildcard host entry stands alongside a bound credential.", owner = "secret" }
SecretUnpermittedRequest       = { gloss = "A guest request names a destination the declaration does not cover.", owner = "secret" }
SecretLiteralAttachValue       = { gloss = "An attach value embeds no reference.", owner = "secret" }
SecretRedirectOffOrigin        = { gloss = "A hop weakens the transport or names another host or port.", owner = "secret" }
SecretCleartextEndpoint        = { gloss = "A sensitive header would ride a cleartext endpoint outside loopback.", owner = "secret" }
SecretCredentialInUrl          = { gloss = "A configured endpoint carries userinfo.", owner = "secret" }
SecretRotationWriteDenied      = { gloss = "The customer's manager refuses the versioned put of a refreshed token.", owner = "secret" }
SecretUndocumentedEntry        = { gloss = "An encrypted entry carries a value with no operator record above it.", owner = "secret" }

[limit]
secret-name-length                      = { value = 128, unit = "chars", owner = "secret.reference.limit.name-length", gloss = "Longest logical name a reference carries." }
secret-resolve-cache-ttl                = { value = 300, unit = "s", owner = "secret.resolve.limit.cache-ttl", gloss = "Longest life of a hydrated value in a resolver's cache." }
secret-lease-retirement-fraction        = { value = 10, unit = "percent", owner = "secret.lease.limit.retirement-margin", gloss = "Share of a lease window a cached entry retires early." }
secret-lease-retirement-cap             = { value = 30, unit = "s", owner = "secret.lease.limit.retirement-margin", gloss = "Ceiling on the early-retirement margin." }
secret-lease-retry-attempts             = { value = 3, unit = "attempts", owner = "secret.lease.limit.retry-attempts", gloss = "Default mint retries under `CONTEXTFUL_LEASE_MAX_ATTEMPTS`." }
secret-lease-backoff-floor              = { value = 250, unit = "ms", owner = "secret.lease.limit.retry-backoff", gloss = "Default first mint backoff under `CONTEXTFUL_LEASE_RETRY_BACKOFF_MS`." }
secret-lease-backoff-cap                = { value = 30, unit = "s", owner = "secret.lease.limit.retry-backoff", gloss = "Ceiling on exponential mint backoff." }
secret-lease-calls-per-resolver         = { value = 1, unit = "calls", owner = "secret.lease.limit.calls-per-resolver", gloss = "Mint calls a resolver issues per declared name per lease window." }
secret-lease-vendor-requests-on-failure = { value = 0, unit = "requests", owner = "secret.lease.limit.vendor-requests-on-failure", gloss = "Vendor requests a run issues on an expired lease whose provider is unreachable." }
secret-record-expiry-warning            = { value = 30, unit = "d", owner = "secret.record.limit.expiry-warning", gloss = "Window within which the inventory marks an expiring credential." }
