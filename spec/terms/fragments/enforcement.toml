# Registry fragment — the enforcement contract.
# Operations, canonical subjects, error identifiers and named bounds asserted by
# spec/41-enforcement.md.

[operation]
redact               = { gloss = "Removal and transformation inside the writer, ahead of columnar bytes and ahead of the run path's durable record.", file = "spec/41-enforcement.md", aliases = ["write-time-redaction", "scrub"] }
compose              = { gloss = "The three layers as one reference monitor, the order a registered relation applies, and where the single pass sits in a ranked read.", file = "spec/41-enforcement.md", aliases = ["layer-composition", "stack"] }
filter-rows          = { gloss = "The typed row-predicate grammar, subject binding, the tenant equality and the project default.", file = "spec/41-enforcement.md", aliases = ["row-level-security", "rls"] }
mask                 = { gloss = "Column strategies and combines, the guardrails over an exhaustible value space, the project pepper, and masked behavior under caller SQL.", file = "spec/41-enforcement.md", aliases = ["column-level-security", "cls"] }
refuse               = { gloss = "The two shapes an unauthorized read takes, the scope guard's decidable cases, and what a refusal discloses.", file = "spec/41-enforcement.md", aliases = ["deny", "scope-refusal"] }
bound-redistribution = { gloss = "The per-table licence bound applied at push, the root-object allowlist, and the per-credential filter a serving edge applies.", file = "spec/41-enforcement.md", aliases = ["replication-bound", "withhold"] }
place                = { gloss = "Inference zones: grammar, composition across grains, floors, incognito, and the serve-time outcome.", file = "spec/41-enforcement.md", aliases = ["inference-placement", "zone-policy"] }
reside               = { gloss = "Where the data plane runs, the region allow-set gating placement, and operation with no external reach.", file = "spec/41-enforcement.md", aliases = ["residency", "data-placement"] }
resist               = { gloss = "Adversary-facing placement: where enforcement sits relative to the prompt, and which paths stay closed to an injected instruction.", file = "spec/41-enforcement.md", aliases = ["injection-posture", "threat-placement"] }

