# Subjects — the fourth segment of a clause id, and every backticked token appearing
# in two or more contract files. `resolves = "code"` marks a token the status
# computation looks for in a definition position; `"concept"` is excluded from that
# test. Owner `wire` names protocol vocabulary no contract owes, which no clause is
# addressed on and the usage-to-owner join passes over.
