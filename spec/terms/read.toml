# Registry fragment — contract `read`, files spec/20-read.md and spec/21-memory.md.

[operation]
register       = {}
guard          = {}
respond        = {}
query          = {}
reference      = {}
retrieve       = {}
rank           = {}
cache          = {}
resolve-pin    = {}
embed          = {}
declare        = {}
synthesize     = {}
revise         = {}
recall         = {}
resolve-entity = {}
settle         = {}

[error]
FilePreviewNotATable          = { clause = "read.register.file-preview-target", gloss = "A previewed path resolved to no table." }
LedgerNotTenantScoped         = { clause = "read.register.scoped-ledger", gloss = "A tenant-scoped token named the request-ledger child relation." }
StatementNotReadOnly          = { clause = "read.guard.single-read-only-statement", gloss = "Admitted text did not parse to exactly one read-only SELECT." }
QueryNotOneStatement          = { clause = "read.query.one-statement", gloss = "Operator text held other than exactly one statement." }
QueryProjectAbsent            = { clause = "read.query.project-store", gloss = "A `--project` named no store on disk." }
TableFunctionRefused          = { clause = "read.guard.table-function", gloss = "A table function or a schema-qualified catalog reach appeared in caller text." }
TemplateNamesForeignRelation  = { clause = "read.guard.template-relation-shape", gloss = "A template named a non-store relation or collided with a built-in tool prefix." }
TemplateArgumentRejected      = { clause = "read.guard.template-binding", gloss = "A template argument was missing, unknown or mistyped." }
QueryParameterRejected        = { clause = "read.guard.query-binding", gloss = "A query parameter was missing, unused, untyped or mistyped." }
ReadDurationExceeded          = { clause = "read.respond.duration-ceiling", gloss = "A statement reached its selected duration ceiling." }
ReadResponseTooLarge          = { clause = "read.respond.byte-ceiling", gloss = "A response envelope or first row exceeds its selected byte ceiling." }
FilterBudgetExceeded          = { clause = "read.retrieve.filter-budget-refusal", gloss = "A ranked read's filter exceeded its value, condition or byte budget." }
PinnedBuildUnavailable        = { clause = "read.resolve-pin.unknown-build", gloss = "A pinned build identifier is unknown or collected." }
RequiredFaceAbsent            = { clause = "read.embed.required-face", gloss = "A client required a face this binary did not link." }
ReadBackendAbsent             = { clause = "read.embed.absent-read-backend", gloss = "A read tool was called on a binary without the embedded SQL engine." }
ServeDeclarationMissing       = { clause = "read.register.serve-declaration", gloss = "The network transport was started with no audience or no positive in-flight ceiling." }
HttpCredentialMissing         = { clause = "read.register.credential-missing", gloss = "A network transport request carried no credential." }
MemoryShapeColumnMissing      = { clause = "read.declare.canonical-column", gloss = "A table naming a memory shape omits a canonical column." }
MemoryUndeclaredRelation      = { clause = "read.declare.undeclared-relation", gloss = "A candidate edge carries an undeclared relation type." }
MemoryExtractExhausted        = { clause = "read.synthesize.dead-letter", gloss = "An extract batch exhausted its attempts and was dead-lettered." }
MemoryDirectWriteShapeRefused = { clause = "read.revise.direct-write", gloss = "A direct write targeted a memory shape other than claims." }
MemoryCitationNotLive         = { clause = "read.revise.citation-live", gloss = "A direct write cites a keyed row that is not its key's live version." }
MemoryClaimScopeRefused        = { clause = "read.revise.served-scope", gloss = "A served claim write names another actor or reading session." }
MemoryClaimBrowserRefused      = { clause = "read.revise.browser-request", gloss = "A browser-origin request reached the served claim-write route." }
MemoryClaimMalformed           = { clause = "read.revise.malformed-request", gloss = "A served claim write holds a malformed or client-scoped body." }
MemoryClaimWriteRefused        = { clause = "read.revise.served-fault", gloss = "A served claim write's store effect refused." }
MemoryEvidenceUnresolved      = { clause = "read.recall.evidence-unresolved", gloss = "A claim's evidence does not resolve through the caller's session." }
MemoryEvidenceOverflow        = { clause = "read.recall.evidence-references", gloss = "A claim names more evidence references than the bound." }
MemoryObservationOutOfOrder   = { clause = "read.revise.observed-order", gloss = "A claim was observed before a live contradicting claim of its line." }
MemoryRecallNotClaims         = { clause = "read.recall.keyed-not-claims", gloss = "A keyed recall named a table declaring no `memory_facts` shape." }
MemoryEntityAmbiguous         = { clause = "read.resolve-entity.ambiguous-mention", gloss = "A mention resolves onto two identities with no separating key." }
MemoryEdgeEndpointUnresolved  = { clause = "read.resolve-entity.edge-endpoint", gloss = "A candidate edge endpoint resolves to no identity." }
OutcomeRegistrationInvalid    = { clause = "read.settle.registration", gloss = "A prediction registration breaks the one-form, one-source, comparator-iff-metric rule." }
OutcomeSourceMismatch         = { clause = "read.settle.source-mismatch", gloss = "An observation's verdict carries no source or a source other than the registration's." }
OutcomeCitationMissing        = { clause = "read.settle.settling-citation", gloss = "A judgment verdict carries no http or https settling citation." }

[limit]
read-row-ceiling-overfetch   = { clause = "read.respond.row-ceiling", value = 1, unit = "rows", basis = "chosen", gloss = "Rows fetched past the row ceiling, whose presence sets `truncated`." }
read-face-row-ceiling        = { clause = "read.respond.face-ceiling", value = 10000, unit = "rows", basis = "chosen", gloss = "Most rows one read delivers on any face, whatever its other ceilings declare." }
read-relevance-floor-wide    = { clause = "read.retrieve.relevance-floor", value = 2, unit = "tokens", basis = "chosen", gloss = "Lexical-score floor for a query of at least the threshold's content tokens." }
read-relevance-floor-narrow  = { clause = "read.retrieve.relevance-floor", value = 1, unit = "tokens", basis = "chosen", gloss = "Lexical-score floor for a query below the threshold." }
read-relevance-floor-split   = { clause = "read.retrieve.relevance-floor", value = 3, unit = "tokens", basis = "chosen", gloss = "Content-token count at which the wider floor applies." }
read-token-length-floor      = { clause = "read.retrieve.token-length-floor", value = 2, unit = "chars", basis = "chosen", gloss = "Shortest ASCII run kept in the content-token set." }
read-content-token-cap       = { clause = "read.retrieve.token-cap", value = 12, unit = "tokens", basis = "chosen", gloss = "Largest content-token set from one query." }
read-plural-suffix-floor     = { clause = "read.retrieve.plural-suffix-floor", value = 4, unit = "chars", basis = "chosen", gloss = "Token length below which no plural suffix is matched." }
read-candidate-window-floor  = { clause = "read.retrieve.candidate-window", value = 200, unit = "rows", basis = "chosen", gloss = "Smallest candidate window of a ranked read." }
read-candidate-window-factor = { clause = "read.retrieve.candidate-window", value = 8, unit = "times", basis = "chosen", gloss = "Multiple of the requested limit forming the candidate window." }
read-filter-values           = { clause = "read.retrieve.filter-budget", value = 256, unit = "entries", basis = "chosen", gloss = "Values in one filter membership list." }
read-filter-conditions       = { clause = "read.retrieve.filter-budget", value = 32, unit = "conditions", basis = "chosen", gloss = "Conditions in one ranked read's filter, `kinds` counting as one." }
read-filter-bytes            = { clause = "read.retrieve.filter-budget", value = 16, unit = "KiB", basis = "chosen", gloss = "Serialized JSON size of one ranked read's filter and `kinds`." }
read-sidecar-probe-floor     = { clause = "read.retrieve.sidecar-oversampling", value = 64, unit = "rows", basis = "chosen", gloss = "Smallest candidate count one sidecar probe requests." }
read-sidecar-probe-factor    = { clause = "read.retrieve.sidecar-oversampling", value = 4, unit = "times", basis = "chosen", gloss = "Multiple of the limit one sidecar probe requests." }
read-sidecar-restricted-factor = { clause = "read.retrieve.sidecar-oversampling", value = 4, unit = "times", basis = "chosen", gloss = "Further multiple applied when the request carries restriction context." }
read-over-fetch-rounds        = { clause = "read.retrieve.adaptive-over-fetch", value = 4, unit = "rounds", basis = "chosen", gloss = "Most probe rounds one sidecar arm runs while visible rows under-fill the limit." }
read-bytes-per-token         = { clause = "read.register.size-estimate", value = 4, unit = "B", basis = "chosen", gloss = "Serialized bytes counted as one estimated token in a table description." }
read-sidecar-size-cap        = { clause = "read.retrieve.sidecar-size-cap", value = 64, unit = "MiB", basis = "chosen", gloss = "Stored-vector size past which a sidecar stays unloaded." }
read-fulltext-sealed-cap     = { clause = "read.retrieve.fulltext-sealed-cap", value = 256, unit = "MiB", basis = "chosen", gloss = "Sealed full-text sidecar size past which it stays unopened." }
read-window-anchor-tolerance = { clause = "read.rank.window-anchor-tolerance", value = 24, unit = "h", basis = "chosen", gloss = "How far past the anchor a publication instant still counts in-window." }
read-fusion-vector-weight    = { clause = "read.rank.fusion", value = 60, unit = "percent", basis = "chosen", gloss = "Default weight of the clamped cosine leg in fusion." }
read-fusion-lexical-weight   = { clause = "read.rank.fusion", value = 40, unit = "percent", basis = "chosen", gloss = "Default weight of the min-max BM25 leg in fusion." }
read-lexical-index-cache     = { clause = "read.rank.lexical-index-cache", value = 64, unit = "entries", basis = "chosen", gloss = "FIFO capacity of opened full-text sidecars." }
read-session-pool-entries    = { clause = "read.cache.pool-entries", value = 16, unit = "entries", basis = "chosen", gloss = "Resolved sessions one read face pools." }
read-session-pool-connections = { clause = "read.cache.pool-connections", value = 4, unit = "connections", basis = "chosen", gloss = "Idle connections one pooled session keeps." }
read-http-retry-after        = { clause = "read.register.past-ceiling", value = 1, unit = "s", basis = "chosen", gloss = "The `Retry-After` a request shed past the in-flight ceiling carries." }
read-http-request-body       = { clause = "read.register.request-body", value = 1, unit = "MiB", basis = "chosen", gloss = "Largest request body the network transport reads." }
memory-extract-attempts      = { clause = "read.synthesize.extract-attempts", value = 3, unit = "attempts", basis = "chosen", gloss = "Extract attempts per batch, feedback included." }
memory-prompt-bytes          = { clause = "read.synthesize.prompt-bound", value = 32, unit = "KiB", basis = "chosen", gloss = "Fenced row bytes one extraction batch packs." }
memory-row-chars             = { clause = "read.synthesize.row-cap", value = 16384, unit = "chars", basis = "chosen", gloss = "Characters of one fenced row before the truncation mark cuts it." }
memory-evidence-references   = { clause = "read.recall.evidence-references", value = 256, unit = "entries", basis = "chosen", gloss = "Evidence references one claim names before recall suppresses it." }
outcome-grace-window         = { clause = "read.settle.grace-window", value = 86400, unit = "s", basis = "chosen", gloss = "Inclusive window past a deadline within which an observation is scored." }
