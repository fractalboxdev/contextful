# The advisory prose report (`corpus.registry.prose-report`): `contextful-ci prose` runs
# Vale over spec/guide/ and references/ with this file. Clause items keep the corpus
# grammar, which states behavior in the present tense, so the `Modals` rule stays off.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
# A `{{…}}` pointer names a clause or operation id, whose words are identifiers, not prose.
TokenIgnores = (\{\{[^}]+\}\})
BasedOnStyles = WriteTechnically
WriteTechnically.Modals = NO
