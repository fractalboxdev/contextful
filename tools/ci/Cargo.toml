[package]
name = "contextful-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "contextful-ci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
contextful-eval = { path = "../eval" }
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# The release step digests each archive (`assurance.build.release-artifact`).
sha2 = "0.10"
toml = "0.8"
# The footprint step compresses a profile artifact as the release archive does.
zstd = { version = "0.13", default-features = false }
# The posture probe's client (`topology.publish-hostname.posture-mismatch`).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
