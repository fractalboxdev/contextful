[package]
name = "contextful-ci"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "contextful-ci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
contextful-eval = { path = "../eval" }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
