[package]
name = "contextful-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "contextful-ci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
contextful-eval = { path = "../eval" }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
# The footprint step compresses a profile artifact as the release archive does.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
