[package]
name = "contextful-spec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "contextful-spec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
