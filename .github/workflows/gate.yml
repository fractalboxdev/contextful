# The gate, one FlareDispatch `check` per stage.
#
# Each matrix entry dispatches `contextful-ci gate --predecessors --stage <stage>` to the
# org's Dispatcher, which clones the PR head into a Rust-equipped sandbox and reports the
# verdict as the check-run `flare-dispatch/check:<stage>`. `--predecessors` also runs each
# stage whose output the stage reads, so the formal check runs pins and toolchain first.
# The features and budget stages dispatch one part each, `<stage>.<part>`, so each part fits
# the sandbox's 30 min wall clock; `contextful-ci stages --parts` prints the list.
# This job goes green once the dispatch is accepted; one check-run per stage or part:
#
#   flare-dispatch/check:pins        every pinned identity resolved before any compilation
#   flare-dispatch/check:toolchain   the pinned Lean toolchain and the WebAssembly target provisioned
#   flare-dispatch/check:schema      secrets of record, mirrors: annotations, derived artifacts regenerated, contextful-spec lint
#   flare-dispatch/check:test-first  a test under tests/ fails against the base source
#   flare-dispatch/check:workspace   cargo test --workspace, acceptance excluded
#   flare-dispatch/check:acceptance  the milestone acceptance suite
#   flare-dispatch/check:evaluate    every gate-tier entry of evals/ledger.toml, held to its target
#   flare-dispatch/check:features.packages      each package but the binary declaring a feature, tested with none, with all and with each listed set
#   flare-dispatch/check:features.binary-<set>  the binary tested under one feature set: none, all, or one its manifest lists
#   flare-dispatch/check:crate-graph the topology dependency rules over `cargo tree --locked` per package, and cargo-deny bans per profile
#   flare-dispatch/check:connectors  the connector and guest-host suites with every feature on
#   flare-dispatch/check:surfaces    each TypeScript surface's typecheck, unit tests and framework build
#   flare-dispatch/check:formal      the assumption audit, the differential run and the protocol check
#   flare-dispatch/check:budget.<profile>       one profile built static for Linux, held to its footprint budget
#
# Lean is provisioned by the dispatched command, not by a step in this file:
# `contextful-ci gate` runs `provision_lean` (tools/ci/src/main.rs) before the
# test-first and workspace stages. It installs elan and the toolchain
# `formal/lean-toolchain` pins when the sandbox lacks them, exports ELAN_TOOLCHAIN
# and CONTEXTFUL_REQUIRE_LEAN=1, and fails the stage when setup fails, so a
# Lean-backed test fails rather than skips.
#
# A contributor runs the same stages locally: `cargo run --locked -q -p contextful-ci -- gate`.
# `contextful-ci`'s integration suite fails when this matrix and its stage list differ.
#
# A fork's pull request dispatches nothing: the dispatch signs with the org's HMAC
# secret and runs the head commit on the org's runner, so only a branch of this
# repository reaches it, and a fork's missing checks hold its merge.
name: gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ vars.FLAREDISPATCH_ENDPOINT != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        stage: [pins, toolchain, schema, test-first, workspace, acceptance, evaluate, features.packages, features.binary-none, features.binary-all, features.binary-data-plane, features.binary-contextful-edge, crate-graph, connectors, surfaces, formal, budget.control, budget.edge, budget.full]
    steps:
      - if: ${{ matrix.stage == 'workspace' }}
        uses: fractalboxdev/flare-dispatch/actions/flare-dispatch-action@a5118d6594c8f3e4040bb90afcb02898a6e7b7bd
        with:
          run: check
          endpoint: ${{ vars.FLAREDISPATCH_ENDPOINT }}
          hmac-secret: ${{ secrets.FLAREDISPATCH_HMAC }}
          installation-id: ${{ vars.FLAREDISPATCH_INSTALLATION_ID }}
          inputs: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha }}",
              "checkLabel": "${{ matrix.stage }}",
              "command": "timeout --kill-after=10s 1650s cargo run --locked -q -p contextful-ci -- gate --predecessors --stage ${{ matrix.stage }} --base ${{ github.event.pull_request.base.sha }}",
              "failOnNonZeroExit": true,
              "timeoutSec": 1800
            }
