# The gate, one FlareDispatch `check` per stage.
#
# Each matrix entry dispatches `contextful-ci gate --stage <stage>` to the org's
# Dispatcher, which clones the PR head into a Rust-equipped sandbox and reports the
# verdict as the check-run `flare-dispatch/check:<stage>`. This job goes green once
# the dispatch is accepted; branch protection requires the five check-runs:
#
#   flare-dispatch/check:schema      secrets of record, mirrors: annotations, contextful-spec lint
#   flare-dispatch/check:test-first  a test under tests/ fails against the base source
#   flare-dispatch/check:workspace   cargo test --workspace, acceptance excluded
#   flare-dispatch/check:acceptance  the milestone acceptance suite
#   flare-dispatch/check:features    each package declaring a feature, tested with none and with all
#
# Lean is provisioned by the dispatched command, not by a step in this file:
# `contextful-ci gate` runs `provision_lean` (tools/ci/src/main.rs) before the
# test-first and workspace stages. It installs elan and the toolchain
# `formal/lean-toolchain` pins when the sandbox lacks them, exports ELAN_TOOLCHAIN
# and CONTEXTFUL_REQUIRE_LEAN=1, and fails the stage when setup fails, so a
# Lean-backed test fails rather than skips.
#
# A contributor runs the same stages locally: `cargo run -q -p contextful-ci -- gate`.
# `contextful-ci`'s integration suite fails when this matrix and its stage list differ.
#
# A fork's pull request dispatches nothing: the dispatch signs with the org's HMAC
# secret and runs the head commit on the org's runner, so only a branch of this
# repository reaches it, and a fork's missing checks hold its merge.
name: gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ vars.FLAREDISPATCH_ENDPOINT != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [schema, test-first, workspace, acceptance, features]
    steps:
      - uses: fractalboxdev/flare-dispatch/actions/flare-dispatch-action@a5118d6594c8f3e4040bb90afcb02898a6e7b7bd
        with:
          run: check
          endpoint: ${{ vars.FLAREDISPATCH_ENDPOINT }}
          hmac-secret: ${{ secrets.FLAREDISPATCH_HMAC }}
          installation-id: ${{ vars.FLAREDISPATCH_INSTALLATION_ID }}
          inputs: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha }}",
              "checkLabel": "${{ matrix.stage }}",
              "command": "cargo run -q -p contextful-ci -- gate --stage ${{ matrix.stage }} --base ${{ github.event.pull_request.base.sha }}",
              "failOnNonZeroExit": true,
              "timeoutSec": 1800
            }
