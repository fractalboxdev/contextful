{
  "name": "Deploy a Cloudflare app",
  "run-name": "deploy ${{ inputs.app }}",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "app": {
          "description": "The app under apps/ to deploy",
          "type": "choice",
          "required": true,
          "options": ["cloudflare-execution", "gateway", "console"]
        },
        "ref": {
          "description": "The branch, tag or commit to deploy; the dispatched branch when empty",
          "type": "string",
          "required": false,
          "default": ""
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "deploy-cloudflare-${{ inputs.app }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ inputs.ref || github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Deploy",
          "run": "cargo run --locked -q -p contextful-ci -- deploy cloudflare --app \"$APP\"",
          "env": {
            "APP": "${{ inputs.app }}",
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          }
        }
      ]
    }
  }
}
