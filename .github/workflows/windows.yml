# Native execution verifies directory flushes and file identity on both Windows targets.
name: native-windows

on:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install 1.97.0 --profile minimal --target ${{ matrix.target }}
      - run: cargo check --locked --target ${{ matrix.target }} --no-default-features -p contextful-core -p contextful-fs -p contextful-policy -p contextful-context
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-fs --test integration an_open_directory_handle_syncs_its_entries
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-fs --test integration a_renamed_open_file_does_not_identify_its_replacement
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-fs --test integration open_handles_keep_their_identity_across_rename_and_path_reuse
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-fs --test integration racing_creates_land_exactly_one
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-policy --test integration an_audit_append_syncs_its_directories
      - run: cargo test --locked --target ${{ matrix.target }} --no-default-features -p contextful-context --test integration a_ledger_append_syncs_its_directory
      - run: cargo test --locked --target ${{ matrix.target }} --no-default-features -p contextful-context --test integration a_renamed_lock_does_not_remove_the_file_that_replaces_it

  command-tree-red:
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e6c777fd07f74b85ec20f4a2247c8dc58192a580
          fetch-depth: 0
      - run: rustup toolchain install 1.97.0 --profile minimal --target ${{ matrix.target }}
      - run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}
      - run: git restore --source=${{ github.event.pull_request.head.sha }} -- crates/contextful-engine/tests/integration/main.rs crates/contextful-engine/tests/integration/command_windows.rs crates/contextful-engine/tests/fixtures/command_tree.rs
      - run: git diff --exit-code e6c777fd07f74b85ec20f4a2247c8dc58192a580 -- crates/contextful-engine/src
      - run: cargo test --locked --target ${{ matrix.target }} -p contextful-engine --test integration --no-run
      - run: "cargo test --locked --target ${{ matrix.target }} -p contextful-engine --test integration command_windows:: -- --list"
      - run: "cargo test --locked --target ${{ matrix.target }} -p contextful-engine --test integration command_windows:: -- --test-threads=2"
