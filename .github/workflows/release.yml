# The release, cut from a `v*` tag (`assurance.build.release-artifact`).
#
# Each build job runs `contextful-ci release` natively for one target: musl inside the
# Alpine Rust image on an x86_64 and an arm64 Linux runner, and the two Apple targets on
# macOS runners. Each packages every profile shipping for its target: an archive holding
# the binary and the licence, its `.sha256`, and a CycloneDX SBOM. The publish job writes
# the formulae and `SHA256SUMS` with `contextful-ci formula` and attaches everything, with
# `install.sh`, to the GitHub release. The image job builds the `Dockerfile` once per
# profile and tags each image on its own.
#
# A manual run is a dry run unless `dry-run` is cleared: it builds and packages every
# archive and image and keeps them as workflow artifacts, publishing nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and package without publishing
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            container: rust:1.97-alpine
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            container: rust:1.97-alpine
          - target: aarch64-apple-darwin
            runner: macos-15
            container: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - if: matrix.container != ''
        run: apk add --no-cache build-base git perl bash tar
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo run --locked -q -p contextful-ci -- release --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.target }}
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cargo run --locked -q -p contextful-ci -- formula --dist dist --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: dist
      - if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --title "${{ github.ref_name }}" dist/*.tar.gz dist/*.sha256 dist/*.cdx.json dist/SHA256SUMS dist/Formula/*.rb install.sh

  image:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [contextful-control, contextful-edge, contextful-full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - if: env.DRY_RUN != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          build-args: PROFILE=${{ matrix.profile }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.profile }}:${{ steps.version.outputs.version }}
          push: ${{ env.DRY_RUN != 'true' }}
